# SPDX-FileCopyrightText: 2026 CubieCode
# SPDX-License-Identifier: MIT
#
# Release builds for wardlockd and wardlock: binaries for linux, darwin and
# windows on amd64 and arm64, archives, checksums, an SPDX SBOM per archive,
# and the multi-arch image ghcr.io/cubiecode/wardlock.
#
# Publishing is disabled. CI runs `goreleaser release --snapshot --clean`
# (.github/workflows/release.yml), which never pushes or creates a release:
# snapshot images are loaded into the local Docker daemon as
# <version>-amd64 and <version>-arm64. Outside a snapshot, the image and the
# GitHub release are also skipped unless WARDLOCK_PUBLISH=true, which only the
# disabled publish job sets. Enabling it is O4.4 and needs explicit
# authorisation. Module tags (apps/cli/vX.Y.Z and friends) are separate; see
# docs/DEPLOYMENT.md.
version: 2
project_name: wardlock
dist: .local/goreleaser

before:
  hooks:
    # Builds the dashboard and copies it into the server for go:embed.
    - pnpm install --frozen-lockfile
    - pnpm exec turbo build
    - bash scripts/embed-dashboard.sh

builds:
  - id: wardlockd
    dir: apps/server
    main: ./cmd/wardlockd
    binary: wardlockd
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X wardlock.nz/server/internal/platform.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: '{{ .CommitTimestamp }}'
  - id: wardlock
    dir: apps/cli
    main: ./cmd/wardlock
    binary: wardlock
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: wardlockd
    ids: [wardlockd]
    name_template: 'wardlockd_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - apps/server/LICENSE
      - README.md
      - deploy/wardlockd.service
  - id: wardlock
    ids: [wardlock]
    name_template: 'wardlock_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, apps/cli/LICENSE, README.md]

checksum:
  name_template: checksums.txt

# One SPDX JSON document per archive (<archive>.sbom.json), generated by syft.
# Each is listed in checksums.txt.
sboms:
  - artifacts: archive

dockers_v2:
  - id: wardlockd
    ids: [wardlockd]
    # Snapshots build the image; anything else only with WARDLOCK_PUBLISH.
    disable: '{{ and (not .IsSnapshot) (ne (index .Env "WARDLOCK_PUBLISH") "true") }}'
    dockerfile: deploy/Dockerfile
    images: [ghcr.io/cubiecode/wardlock]
    tags:
      - '{{ .Version }}'
      - '{{ if not .IsSnapshot }}latest{{ end }}'
    platforms: [linux/amd64, linux/arm64]
    # Attached as an attestation when pushed; snapshots cannot carry one.
    sbom: true
    labels:
      org.opencontainers.image.title: wardlock
      org.opencontainers.image.description: Self-hostable static site host with built-in access control
      org.opencontainers.image.source: https://github.com/CubieCode/wardlock
      org.opencontainers.image.url: https://wardlock.nz
      org.opencontainers.image.licenses: AGPL-3.0-only
      org.opencontainers.image.version: '{{ .Version }}'
      org.opencontainers.image.revision: '{{ .FullCommit }}'
      org.opencontainers.image.created: '{{ .CommitDate }}'

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot.{{ .ShortCommit }}'

changelog:
  disable: true

release:
  disable: '{{ ne (index .Env "WARDLOCK_PUBLISH") "true" }}'
  draft: true

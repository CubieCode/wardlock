version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /apps/server
      - /apps/cli
      - /packages/apiclient-go
      - /tools
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      go:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - '*'

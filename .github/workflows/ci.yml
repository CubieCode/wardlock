name: CI
# Runs the full definition-of-done gate (`pnpm check`) on every pull request,
# including the codegen drift check and govulncheck, plus the Playwright
# acceptance suite against a real server at desktop and mobile widths.
# Actions are pinned by commit; the comment gives the release.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - &go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/*/go.sum
            packages/*/go.sum
            tools/go.sum
      # Pinned Go tools (tools/go.mod) are built into .local/bin on first use.
      - &tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('tools/go.mod', 'tools/go.sum', 'go.work') }}
      - &install
        run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: git diff --check && git diff --exit-code

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *checkout
      - *pnpm
      - *node
      - *go
      - *install
      - run: pnpm --filter @wardlock/web exec playwright install --with-deps --only-shell chromium
      - run: pnpm browser:test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: .local/test-results
          retention-days: 7

name: Release
# Snapshot release builds with GoReleaser: server and CLI binaries for every
# platform, archives, checksums, SBOMs and the multi-arch container image,
# then scripts/release-smoke.sh checks them (checksums, install.sh, the image
# runs as non-root and answers /healthz). scripts/test-module-tags.sh proves
# the Go module tag scheme against a temporary local clone.
#
# Pull requests, main and manual runs only build snapshots: they never push
# an image or create a release, and the publish job is skipped. Publishing
# happens only when a vX.Y.Z tag is pushed to this repository (docs/
# DEPLOYMENT.md, "Releases and module tags"): after the snapshot and module
# tag checks pass, the publish job logs in to ghcr.io, pushes
# ghcr.io/cubiecode/wardlock and creates a draft GitHub release. It is the
# only job with write permissions. Tag filters match the whole tag name and
# `*` does not match `/`, so the module tags (apps/cli/vX.Y.Z,
# apps/server/vX.Y.Z, packages/apiclient-go/vX.Y.Z) do not trigger it.
# Snapshots are built and smoke-tested but not uploaded: nothing reads them,
# and at about 65 MB a run they filled the Actions artifact quota.
#
# Runners: vars.RUNNER as in ci.yml (unset means ubuntu-latest); pull
# requests from forks always run on ubuntu-latest. A self-hosted runner needs
# Docker with buildx; the arm64 image needs no emulation. Publishing always
# runs on ubuntu-latest.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  # Never cancel a tag run part-way through publishing.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  snapshot:
    runs-on: &runner ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.environment == 'github-hosted' && '~/setup-pnpm' || format('{0}/setup-pnpm', runner.temp) }}
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - &go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: |
            apps/*/go.sum
            packages/*/go.sum
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - &syft
        name: Install syft for SBOMs
        # Built from the pinned module (checked against the Go checksum
        # database) outside the repository, so no go.sum changes.
        run: |
          GOWORK=off GOFLAGS= GOBIN="$RUNNER_TEMP/syft" go -C "$RUNNER_TEMP" install github.com/anchore/syft/cmd/syft@v1.52.0
          echo "$RUNNER_TEMP/syft" >> "$GITHUB_PATH"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean
      - run: bash scripts/release-smoke.sh

  module-tags:
    runs-on: *runner
    timeout-minutes: 15
    steps:
      - *checkout
      - *node
      - *go
      - run: bash scripts/test-module-tags.sh

  # Runs only for a vX.Y.Z tag pushed to this repository, never for pull
  # requests, main or manual runs. Module tags are created separately
  # (DEPLOYMENT) and do not match the tag filter.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'CubieCode/wardlock'
    needs: [snapshot, module-tags]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - *checkout
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - *node
      - *go
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - *syft
      - name: Log in to ghcr.io
        # A plain docker login: the repository's allowed actions do not
        # include docker/login-action.
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          WARDLOCK_PUBLISH: 'true'
          # The release commit also carries the module tags; name the one
          # that triggered the run so GoReleaser never picks another.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

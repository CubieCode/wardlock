name: Docs site
# Builds the public documentation site from docs/ (docs-site/README.md) and
# checks every link in it. The build and the checker need no network beyond
# the package install, and nothing here contacts a Wardlock instance.
# The built site is kept as a workflow artifact for inspection.
#
# Nothing is deployed. The deploy job is disabled with `if: false`; enabling
# it needs explicit authorisation, a reviewed change to this file and the
# WARDLOCK_SERVER variable and WARDLOCK_TOKEN secret, neither of which exists
# yet. The site is public: a new site has no `/` policy, so the deploy job
# sets none.
#
# Runners: vars.RUNNER as in ci.yml (unset means ubuntu-latest); pull
# requests from forks always run on ubuntu-latest.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/**
      - docs-site/**
      - .github/workflows/docs-site.yml
permissions:
  contents: read
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: &runner ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Concurrent self-hosted jobs share $HOME; install pnpm per job.
          dest: ${{ runner.environment == 'github-hosted' && '~/setup-pnpm' || format('{0}/setup-pnpm', runner.temp) }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile --filter @wardlock/docs-site
      # Builds docs-site/dist, then checks every link and anchor in it.
      - run: pnpm docs:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs-site/dist
          retention-days: 7

  deploy:
    # Disabled: deploying needs explicit authorisation (see the header).
    if: false
    needs: build
    runs-on: *runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: docs-site
          path: docs-site/dist
      - run: go build -o "$RUNNER_TEMP/wardlock" ./apps/cli/cmd/wardlock
      # wardlock.json names the site (docs) and the directory (dist).
      - working-directory: docs-site
        env:
          WARDLOCK_SERVER: ${{ vars.WARDLOCK_SERVER }}
          WARDLOCK_TOKEN: ${{ secrets.WARDLOCK_TOKEN }}
        run: '"$RUNNER_TEMP/wardlock" deploy --json --message "docs ${GITHUB_SHA::12}"'

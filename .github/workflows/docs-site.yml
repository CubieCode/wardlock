name: Docs site
# Builds the public documentation site from docs/ (docs-site/README.md) and
# checks every link in it. The build and the checker need no network beyond
# the package install, and the build job contacts no Wardlock instance.
# Nothing is uploaded; the deploy job builds the site itself.
#
# The deploy job publishes the site to the instance in the WARDLOCK_SERVER
# variable with the WARDLOCK_TOKEN secret (a deploy-scope API token) on every
# push to main that changes the docs, and on a manual run from main, through
# this repository's deploy action (actions/deploy) with the CLI built from
# source. The site is public: a new site has no `/` policy, so the deploy job
# sets none.
#
# Pull requests only build, unless the DOCS_PREVIEWS variable is `true`: then
# a pull request from a branch of this repository also deploys the preview
# docs--pr-<number> (public, like the site, since previews follow the site's
# policies), comments its address on the pull request, and deletes it when
# the pull request closes. Turn it on only once the instance runs a release
# with preview deploys (C1.19). Pull requests from forks get no secrets and
# never deploy.
#
# Concurrency: pull request runs are grouped by pull request number, never by
# github.ref. For the `closed` event of a merged pull request github.ref is
# the base branch (refs/heads/main), so a ref-keyed group put that run in
# main's group and cancelled the production deploy of the merge commit (run
# 41025681285, cancelled by the close run 41025682156). Within one pull
# request a newer run still cancels an older one; when `closed` cancels an
# in-flight preview deploy, the group waits for that run to stop before the
# close run deletes the preview, so no preview is left behind. Pushes to
# main still cancel superseded main runs.
#
# Runners: vars.RUNNER as in ci.yml (unset means ubuntu-latest); pull
# requests from forks always run on ubuntu-latest.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/**
      - docs-site/**
      - .github/workflows/docs-site.yml
permissions:
  contents: read
concurrency:
  group: docs-site-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: &runner ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Concurrent self-hosted jobs share $HOME; install pnpm per job.
          dest: ${{ runner.environment == 'github-hosted' && '~/setup-pnpm' || format('{0}/setup-pnpm', runner.temp) }}
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - &install
        run: pnpm install --frozen-lockfile --filter @wardlock/docs-site
      # Builds docs-site/dist, then checks every link and anchor in it.
      - &build
        run: pnpm docs:build

  deploy:
    # Main only: pull requests never deploy (see the header).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: *runner
    timeout-minutes: 10
    steps:
      - *checkout
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - *pnpm
      - *node
      - *install
      - *build
      - &cli
        run: go build -o "$RUNNER_TEMP/wardlock" ./apps/cli/cmd/wardlock
      - id: message
        run: echo "message=docs ${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      # wardlock.json names the site (docs) and the directory (dist).
      - uses: ./actions/deploy
        with:
          server: ${{ vars.WARDLOCK_SERVER }}
          token: ${{ secrets.WARDLOCK_TOKEN }}
          working-directory: docs-site
          cli-path: ${{ runner.temp }}/wardlock
          message: ${{ steps.message.outputs.message }}

  # Off unless vars.DOCS_PREVIEWS is 'true' (see the header). Forks are
  # left out here rather than by the action's notice, so their runs stay
  # quiet.
  preview:
    if: >-
      vars.DOCS_PREVIEWS == 'true' && github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: *runner
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - *checkout
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - *pnpm
      - *node
      - *install
      - *build
      - *cli
      # Deploys to docs--pr-<number> and comments its address.
      - uses: ./actions/deploy
        with:
          server: ${{ vars.WARDLOCK_SERVER }}
          token: ${{ secrets.WARDLOCK_TOKEN }}
          working-directory: docs-site
          cli-path: ${{ runner.temp }}/wardlock

  # Deletes the pull request's preview when it closes, under the same switch.
  preview-delete:
    if: >-
      vars.DOCS_PREVIEWS == 'true' && github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: *runner
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - *checkout
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - *cli
      - uses: ./actions/deploy
        with:
          server: ${{ vars.WARDLOCK_SERVER }}
          token: ${{ secrets.WARDLOCK_TOKEN }}
          working-directory: docs-site
          cli-path: ${{ runner.temp }}/wardlock

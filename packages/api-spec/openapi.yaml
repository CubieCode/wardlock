      - $ref: '#/components/parameters/DomainHostname'
    post:
      operationId: verifyDomain
      summary: Check a custom domain's DNS now.
      description: >-
        Runs a check immediately and answers with the result: `status`,
        `lastCheckedAt` and, on failure, `failureReason`. Rate-limited per
        domain: a check too soon after the last answers `429` with code
        `checked_recently`. Any other `429` code, such as `rate_limited` for
        an API token refused after failed attempts, is not a cooldown.
      tags: [domains]
      security:
        - sessionCookie: []
        - apiToken: [manage]
      responses:
        '200':
          description: Checked. The body carries the outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
              examples:
                verified:
                  $ref: '#/components/examples/ActiveDomain'
                failed:
                  $ref: '#/components/examples/PendingDomain'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/CheckedRecently'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/primary-host:
    parameters:
      - $ref: '#/components/parameters/SiteName'
    put:
      operationId: setPrimaryHost
      summary: Choose a site's primary hostname.
      description: >-
        Makes `host` the site's primary hostname (C1.18): requests for the
        site on any of its other hostnames then answer `308` to the same
        path and query on the primary, before any access decision, except
        under `/.wardlock/`. `host` is the site's base-domain hostname or
        one of its active custom domains, in any spelling (case, trailing
        dot, Unicode); it replaces any earlier choice. A hostname that is
        not one of this site's, including another site's or another
        owner's, answers `404 not_found` like a missing site. A pending or
        lapsed custom domain of the site answers `409 domain_not_active`.
        A site the operator has taken down answers `409 site_unavailable`:
        its hostnames are frozen. Clients that do not follow redirects
        with their credentials, such as those sending `Authorization:
        Bearer`, should use the primary hostname once one is set.
      tags: [domains]
      security:
        - sessionCookie: []
        - apiToken: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPrimaryHostRequest'
            example:
              host: www.example.org
      responses:
        '200':
          description: The site as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
              examples:
                site:
                  $ref: '#/components/examples/SiteWithPrimaryHost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: clearPrimaryHost
      summary: Stop redirecting to a primary hostname.
      description: >-
        Leaves the site with no primary hostname, so every one of its
        hostnames serves it again. Clearing a site with none changes
        nothing. A site the operator has taken down answers
        `409 site_unavailable`.
      tags: [domains]
      security:
        - sessionCookie: []
        - apiToken: [manage]
      responses:
        '200':
          description: The site as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
              examples:
                site:
                  $ref: '#/components/examples/Site'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'


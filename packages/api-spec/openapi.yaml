#
# The Wardlock HTTP API contract and the single source of truth for API types.
# Changing this file is a serialization gate (AGENTS.md). After editing, run
# `pnpm codegen` and commit the regenerated Go and TypeScript code;
# `pnpm check:api-spec` lints it with the rules in lint.redocly.yaml.
openapi: 3.1.0
info:
  title: Wardlock API
  version: 0.0.0
  summary: Owner API for the Wardlock server, used by the dashboard and the CLI.
  description: |
    All paths sit under `/api/v0/` on the dashboard host. Requests and
    responses are JSON (`application/json`) except blob uploads, which send
    raw bytes (`application/octet-stream`).

    ## Authentication

    - `sessionCookie`: the dashboard's owner session, a `__Host-` cookie set
      by setup, sign-in-link and email-code sign-in (C1.1) and passkey sign-in
      (C1.6). Cookie-authenticated
      requests with an unsafe method (`POST`, `PUT`, `DELETE`) must come from
      the dashboard origin (C1.1 enforces this). The server checks `Origin`;
      without it, `Sec-Fetch-Site`, which must be `same-origin`. A request with
      the session cookie is rejected with `403 forbidden` when either header
      names another origin or neither is present. Only a request with neither
      header and no session cookie is outside this check.
    - `apiToken`: `Authorization: Bearer wl_<public id>_<secret>` (C1.7). A
      token carries one or both scopes. `deploy` covers creating sites and
      deploys, uploading blobs, activation and rollback. `manage` covers
      deleting sites and managing custom domains. Read operations accept
      either scope. `manage` also covers setting and deleting access
      policies and creating, revoking and rotating share links. Tokens never
      manage owners, sessions or other tokens.

    Each operation lists the credentials it accepts; any one of them is
    enough. Operations with no security take no credentials and are
    rate-limited.

    ## Conventions

    - **IDs** are lowercase, hyphenated UUIDv7 text generated by the server.
      Sites are addressed by name, custom domains by hostname, everything else
      by ID.
    - **Timestamps** are integers: UTC milliseconds since the Unix epoch.
    - **Absent values** are omitted from responses; the API never sends `null`.
    - **Field names** are camelCase.
    - **Pagination**: list operations take `limit` (1 to 100, default 50) and
      an opaque `cursor`, and answer `{items, nextCursor}`. `nextCursor` is
      present only when there is another page; pass it back unchanged.
    - **Owner scoping**: every resource belongs to the signed-in owner. A
      resource that does not exist and one that belongs to another owner get
      the same `404 not_found` with the same body.
    - **Secrets** (API tokens, CLI device codes, share-link tokens) appear in
      exactly one response, at creation (or a share link's rotation), and are
      never returned again.

    ## Errors

    Every error response is an `Error` object: a stable machine-readable
    `code`, a human-readable `message` and, where it helps, the `target` the
    error is about (a field, a manifest path or a hostname). Clients branch on
    `code`, never on `message`.

    | Status | Codes |
    | ------ | ----- |
    | 400 | `invalid_request` (malformed JSON, missing or invalid field), `invalid_code`, `invalid_site_name`, `reserved_site_name`, `invalid_path`, `invalid_manifest`, `invalid_hostname`, `hash_mismatch`, `unexpected_blob`, `invalid_policy_path`, `invalid_policy`, `invalid_share_link`, `invalid_passkey` |
    | 401 | `unauthenticated`: no credential, or an expired, revoked or unknown one |
    | 403 | `forbidden`: the credential lacks the scope, or a cookie request came from another origin; `invites_restricted`: the operator has kept invitations to themselves |
    | 404 | `not_found` |
    | 409 | `site_name_taken`, `domain_taken`, `blobs_missing`, `deploy_not_pending`, `deploy_not_activated`, `no_previous_deploy`, `default_policy`, `passkey_limit`, `site_unavailable` (the operator has taken the site down) |
    | 410 | `login_expired` |
    | 413 | `limit_exceeded` |
    | 429 | `rate_limited`, `slow_down`, `checked_recently` (a domain check came too soon after the last); `Retry-After` gives the seconds to wait |
    | 500 | `internal` |
    | 501 | `not_implemented`: the operation is in the contract but not built yet |
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: The dashboard host of the Wardlock server.
tags:
  - name: system
    description: Server status.
  - name: owners
    description: Owner bootstrap, sign-in, sessions and invitations (C1.1); passkeys (C1.6).
  - name: tokens
    description: API tokens and the CLI device login (C1.7).
  - name: sites
    description: Sites (C1.2).
  - name: deploys
    description: Deploys, blob uploads, activation and rollback (C1.2).
  - name: domains
    description: Custom domains (C1.9).
  - name: policies
    description: Access policies (A2.1).
  - name: links
    description: Share links (A2.2).
security: []
paths:
  /api/v0/health:
    get:
      operationId: getHealth
      summary: Report that the API is serving requests.
      description: >-
        Returns the server version so clients can report it. Database and
        certificate readiness are reported separately (O4.2).
      tags: [system]
      security: []
      responses:
        '200':
          description: The API is serving requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                version: 0.1.0
        default:
          $ref: '#/components/responses/Error'

  /api/v0/setup:
    post:
      operationId: completeSetup
      summary: Create the first owner from the one-time setup code.
      description: >-
        Redeems the code from the setup URL that `wardlockd serve` prints
        while no owner exists, creates the owner with the given email address
        and signs them in. The code is single use and valid for 60 minutes. A
        wrong, used or expired code, or an instance that already has an
        owner, all answer `400 invalid_code`.
      tags: [owners]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
            example:
              code: EXAMPLEsetupCodeEXAMPLE
              email: owner@example.com
      responses:
        '201':
          description: The owner exists and is signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                meSession:
                  $ref: '#/components/examples/MeSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/auth/sign-in-link:
    post:
      operationId: redeemSignInLink
      summary: Sign in with a one-time sign-in link code.
      description: >-
        Redeems the code from a one-time sign-in URL, such as the one printed
        by `wardlockd admin create` or sent with an invitation, and starts a
        dashboard session. A wrong, used or expired code answers
        `400 invalid_code`.
      tags: [owners]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInLinkRequest'
            example:
              code: EXAMPLEsignInCodeEXAMPLE
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                meSession:
                  $ref: '#/components/examples/MeSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/auth/email-code:
    post:
      operationId: sendEmailCode
      summary: Email a sign-in code.
      description: >-
        Sends a 6-digit code valid for 10 minutes if the address belongs to
        an owner. The response is the same whether or not it does. Sends are
        rate-limited per IP and per address.
      tags: [owners]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
            example:
              email: owner@example.com
      responses:
        '202':
          description: Accepted. A code is on its way if the address belongs to an owner.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/auth/email-code/verify:
    post:
      operationId: verifyEmailCode
      summary: Sign in with an emailed code.
      description: >-
        Checks the code sent to the address and starts a dashboard session.
        A code allows 5 attempts. A wrong, expired or exhausted code, and an
        address that is not an owner's, all answer `400 invalid_code`.
      tags: [owners]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeVerifyRequest'
            example:
              email: owner@example.com
              code: '482913'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                meSession:
                  $ref: '#/components/examples/MeSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/auth/passkey:
    post:
      operationId: startPasskeySignIn
      summary: Start signing in with a passkey.
      description: >-
        Returns a WebAuthn challenge for a discoverable-credential sign-in:
        it names no owner, and the browser offers whichever of this
        dashboard's passkeys it holds. Pass `options` to
        `navigator.credentials.get({publicKey})` after decoding its base64url
        fields, then send the result to `verifyPasskeySignIn` with
        `ceremonyId` within 5 minutes. Rate-limited per IP, at the same rate
        as `verifyEmailCode` but counted separately, with at most 5 sign-ins
        open at once per IPv4 address or IPv6 /48.
      tags: [owners]
      security: []
      responses:
        '200':
          description: The challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyChallenge'
              example:
                ceremonyId: 3q2-7wCqUu8pX1rM0dLh9N5bYk4sQe6tVz2aJf8gHcI
                options:
                  challenge: oN7c4Hd0sYp2qL1v9xRk3TfW6mEuB8aZgJ5iQcV0nXs
                  timeout: 300000
                  rpId: wardlock.example.com
                  userVerification: preferred
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/auth/passkey/verify:
    post:
      operationId: verifyPasskeySignIn
      summary: Finish signing in with a passkey.
      description: >-
        Checks the authenticator's assertion against the challenge and starts
        a dashboard session for the passkey's owner. Each challenge is used
        once, whatever the outcome. An unknown, used or expired challenge, an
        assertion for another origin or relying party, a bad signature, an
        unknown or removed passkey and a signature counter that did not
        increase all answer `400 invalid_passkey`.
      tags: [owners]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeySignInRequest'
            example:
              ceremonyId: 3q2-7wCqUu8pX1rM0dLh9N5bYk4sQe6tVz2aJf8gHcI
              credential:
                id: AbCdEfGhIjKlMnOp
                rawId: AbCdEfGhIjKlMnOp
                type: public-key
                response:
                  clientDataJSON: eyJ0eXBlIjoid2ViYXV0aG4uZ2V0In0
                  authenticatorData: SZYN5YgOjGh0NBcPZHZgW4_krrmihjLHmVzzuoMdl2MFAAAAAQ
                  signature: MEUCIQDexample
                  userHandle: MDE5MjhjNWU
                clientExtensionResults: {}
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                meSession:
                  $ref: '#/components/examples/MeSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/auth/sign-out:
    post:
      operationId: signOut
      summary: End the current session or revoke the current API token.
      description: >-
        With a session cookie, ends that session and clears the cookie. With
        an API token, revokes that token (`wardlock logout`).
      tags: [owners]
      security:
        - sessionCookie: []
        - apiToken: []
      responses:
        '204':
          description: Signed out.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookie'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/me:
    get:
      operationId: getMe
      summary: Describe the signed-in owner and the credential used.
      tags: [owners]
      security:
        - sessionCookie: []
        - apiToken: []
      responses:
        '200':
          description: The signed-in owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                session:
                  $ref: '#/components/examples/MeSession'
                apiToken:
                  $ref: '#/components/examples/MeApiToken'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/owners:
    post:
      operationId: inviteOwner
      summary: Invite another owner by email.
      description: >-
        Emails the address a one-time sign-in link. The response is the same
        whether or not the address already belongs to an owner, so it reveals
        nothing about other owners. Rate-limited per owner. On an instance
        where the operator has kept invitations to themselves
        (`WARDLOCK_INVITES=operator`), every request answers
        `403 invites_restricted`.
      tags: [owners]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteOwnerRequest'
            example:
              email: colleague@example.com
      responses:
        '202':
          description: Accepted. The invitation is on its way.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sessions:
    get:
      operationId: listSessions
      summary: List the signed-in owner's dashboard sessions.
      description: Most recently used first.
      tags: [owners]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
              example:
                items:
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e0f
                    createdAt: 1767225600000
                    lastUsedAt: 1767312000000
                    expiresAt: 1768521600000
                    userAgent: Mozilla/5.0 (X11; Linux x86_64)
                    current: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      operationId: revokeSession
      summary: Revoke one of the signed-in owner's sessions.
      description: Takes effect on the session's next request.
      tags: [owners]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/passkeys:
    get:
      operationId: listPasskeys
      summary: List the signed-in owner's passkeys.
      description: >-
        Every passkey, oldest first, in one page: an owner has at most 20.
      tags: [owners]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The owner's passkeys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyList'
              example:
                items:
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e40
                    name: Chrome on macOS
                    createdAt: 1767225600000
                    lastUsedAt: 1767312000000
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createPasskey
      summary: Finish adding a passkey.
      description: >-
        Checks the authenticator's attestation against a challenge from
        `startPasskeyRegistration` started by the same owner, and stores the
        passkey. Each challenge is used once, whatever the outcome. A bad,
        used, expired, cross-origin or already registered credential answers
        `400 invalid_passkey`.
      tags: [owners]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePasskeyRequest'
            example:
              ceremonyId: 7Kq1mZp4xR9sT2vW5yA8bC3dE6fG0hJ1kL4nP7qS9uV
              name: Chrome on macOS
              credential:
                id: AbCdEfGhIjKlMnOp
                rawId: AbCdEfGhIjKlMnOp
                type: public-key
                response:
                  clientDataJSON: eyJ0eXBlIjoid2ViYXV0aG4uY3JlYXRlIn0
                  attestationObject: o2NmbXRkbm9uZWdhdHRTdG10oGhhdXRoRGF0YQ
                  transports: [internal, hybrid]
                clientExtensionResults: {}
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
              example:
                id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e40
                name: Chrome on macOS
                createdAt: 1767225600000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/PasskeyLimit'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/passkeys/registration:
    post:
      operationId: startPasskeyRegistration
      summary: Start adding a passkey.
      description: >-
        Returns a WebAuthn challenge to create a discoverable passkey for the
        signed-in owner, with the dashboard host as the relying party and the
        owner's existing passkeys excluded. Pass `options` to
        `navigator.credentials.create({publicKey})` after decoding its
        base64url fields, then send the result to `createPasskey` with
        `ceremonyId` within 5 minutes. Rate-limited per owner (10 starts per
        15 minutes, at most 3 open at once).
      tags: [owners]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyChallenge'
              example:
                ceremonyId: 7Kq1mZp4xR9sT2vW5yA8bC3dE6fG0hJ1kL4nP7qS9uV
                options:
                  rp:
                    id: wardlock.example.com
                    name: Wardlock
                  user:
                    id: MDE5MjhjNWU
                    name: owner@example.com
                    displayName: owner@example.com
                  challenge: oN7c4Hd0sYp2qL1v9xRk3TfW6mEuB8aZgJ5iQcV0nXs
                  pubKeyCredParams:
                    - type: public-key
                      alg: -7
                  timeout: 300000
                  authenticatorSelection:
                    residentKey: required
                    requireResidentKey: true
                    userVerification: preferred
                  attestation: none
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/PasskeyLimit'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/passkeys/{passkeyId}:
    parameters:
      - $ref: '#/components/parameters/PasskeyId'
    delete:
      operationId: deletePasskey
      summary: Remove one of the signed-in owner's passkeys.
      description: >-
        The passkey stops working for sign-in at once. Sessions it started
        are not ended. The authenticator keeps its copy until the owner
        deletes it there.
      tags: [owners]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/tokens:
    get:
      operationId: listApiTokens
      summary: List the signed-in owner's API tokens.
      description: Newest first. Token secrets are never returned.
      tags: [tokens]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of API tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenPage'
              example:
                items:
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e20
                    publicId: k7m2q6xw4a
                    name: CI deploys
                    scopes: [deploy]
                    createdAt: 1767225600000
                    expiresAt: 1798761600000
                    lastUsedAt: 1767312000000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createApiToken
      summary: Create an API token.
      description: The response is the only time the token is shown.
      tags: [tokens]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiTokenRequest'
            example:
              name: CI deploys
              scopes: [deploy]
              expiresAt: 1798761600000
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiToken'
              examples:
                createdApiToken:
                  $ref: '#/components/examples/CreatedApiToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    delete:
      operationId: revokeApiToken
      summary: Revoke an API token.
      description: Takes effect on the token's next request.
      tags: [tokens]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/cli-login:
    post:
      operationId: startCliLogin
      summary: Start a CLI device login.
      description: >-
        Called by `wardlock login`. The CLI shows `userCode`, opens
        `verificationUrlComplete` in a browser and polls `pollCliLogin` with
        `deviceCode` no more often than every `interval` seconds until a
        signed-in owner approves or denies it on the dashboard, or it
        expires. `deviceCode` is a secret: keep it out of logs.
      tags: [tokens]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartCliLoginRequest'
            example:
              clientName: wardlock 0.1.0 on build-laptop
      responses:
        '201':
          description: Started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliLogin'
              example:
                deviceCode: dc_EXAMPLEonlyEXAMPLEonlyEXAMPLEonlyEXAMPLE
                userCode: BDFH-KMPR
                verificationUrl: https://wardlock.example.com/cli-login
                verificationUrlComplete: https://wardlock.example.com/cli-login?code=BDFH-KMPR
                expiresAt: 1767226500000
                interval: 5
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/cli-login/poll:
    post:
      operationId: pollCliLogin
      summary: Poll a CLI device login for its token.
      description: >-
        Answers `202` while the login waits for approval and `200` with a new
        API token once approved; the token is delivered once. A denied,
        expired, already delivered or unknown login answers
        `410 login_expired`. Polling faster than `interval` answers
        `429 slow_down`.
      tags: [tokens]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollCliLoginRequest'
            example:
              deviceCode: dc_EXAMPLEonlyEXAMPLEonlyEXAMPLEonlyEXAMPLE
      responses:
        '200':
          description: Approved. The response carries the new API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiToken'
              examples:
                createdApiToken:
                  $ref: '#/components/examples/CreatedApiToken'
        '202':
          description: Waiting for approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliLoginPending'
              example:
                status: pending
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/cli-login/approve:
    post:
      operationId: approveCliLogin
      summary: Approve a CLI device login.
      description: >-
        Called by the dashboard's `/cli-login` page once the owner confirms
        the code matches their terminal. Creates an API token with the chosen
        scopes for the waiting CLI. An unknown, expired or already decided
        code answers `400 invalid_code`.
      tags: [tokens]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveCliLoginRequest'
            example:
              userCode: BDFH-KMPR
              scopes: [deploy, manage]
              name: wardlock CLI on build-laptop
      responses:
        '204':
          description: Approved. The CLI receives its token on its next poll.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/cli-login/deny:
    post:
      operationId: denyCliLogin
      summary: Deny a CLI device login.
      description: >-
        An unknown, expired or already decided code answers
        `400 invalid_code`.
      tags: [tokens]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DenyCliLoginRequest'
            example:
              userCode: BDFH-KMPR
      responses:
        '204':
          description: Denied. The CLI's next poll answers `410 login_expired`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites:
    get:
      operationId: listSites
      summary: List the owner's sites.
      description: >-
        Ordered by name. With `hostname`, answers the owner's site served at
        that hostname (`<name>.<base domain>` or one of its custom domains,
        whatever the domain's status), or an empty page; the CLI uses it to
        resolve the DOMAIN argument.
      tags: [sites]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: hostname
          in: query
          required: false
          description: Only the site served at this hostname.
          schema:
            $ref: '#/components/schemas/Hostname'
          example: docs.example.com
      responses:
        '200':
          description: One page of sites.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitePage'
              example:
                items:
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e01
                    name: docs
                    hostname: docs.wardlock.example.net
                    url: https://docs.wardlock.example.net/
                    createdAt: 1767225600000
                    unavailable: false
                    activeDeployId: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e10
                    activatedAt: 1767225660000
                nextCursor: c2l0ZTpkb2Nz
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createSite
      summary: Create an empty site.
      description: >-
        Site names are unique per instance. A name held by any site, the
        caller's or another owner's, answers `409 site_name_taken`; site
        names are public through DNS, so this reveals nothing secret. The CLI
        calls this before the first deploy to a new name.
      tags: [sites]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
            example:
              name: docs
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
              example:
                id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e01
                name: docs
                hostname: docs.wardlock.example.net
                url: https://docs.wardlock.example.net/
                createdAt: 1767225600000
                unavailable: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}:
    parameters:
      - $ref: '#/components/parameters/SiteName'
    get:
      operationId: getSite
      summary: Get one of the owner's sites.
      tags: [sites]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      responses:
        '200':
          description: The site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
              examples:
                site:
                  $ref: '#/components/examples/Site'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSite
      summary: Tear down a site.
      description: >-
        Deletes the site with its deploys, links, policies and custom domains
        and frees the name. Serving stops immediately. Unreferenced blobs are
        removed later by garbage collection (C1.8). A site the operator has
        taken down answers `409 site_unavailable`: its files are kept until
        the operator restores or tears it down.
      tags: [sites]
      security:
        - sessionCookie: []
        - apiToken: [manage]
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/deploys:
    parameters:
      - $ref: '#/components/parameters/SiteName'
    get:
      operationId: listDeploys
      summary: List a site's deploys.
      description: Newest first.
      tags: [deploys]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of deploys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployPage'
              example:
                items:
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e10
                    status: active
                    createdAt: 1767225600000
                    activatedAt: 1767225660000
                    fileCount: 42
                    totalSize: 1532918
                    message: Fix typo on the install page
                    spa: false
                    immutableAssets: false
                  - id: 01928c4a-1f2e-7d3c-8b4a-596877665544
                    status: inactive
                    createdAt: 1767139200000
                    activatedAt: 1767139260000
                    fileCount: 40
                    totalSize: 1480233
                    spa: false
                    immutableAssets: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createDeploy
      summary: Create a deploy from a manifest.
      description: >-
        Records the manifest and answers with the SHA-256 hashes the server
        still needs. Upload each with `uploadDeployBlob`, then call
        `activateDeploy`. Files whose content the server already holds for
        the owner are not listed, so an unchanged re-deploy uploads nothing.
        Paths are normalised to forward slashes and must be valid UTF-8,
        without `..`, empty segments, control characters or a leading
        `.wardlock/`; a rejected path answers `400 invalid_path` with the
        path as `target`. A duplicate path answers `400 invalid_manifest`.
        Exceeding the file count, file size or total size limits answers
        `413 limit_exceeded`. A site the operator has taken down answers
        `409 site_unavailable`.
      tags: [deploys]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeployRequest'
            example:
              message: Fix typo on the install page
              spa: false
              immutableAssets: false
              files:
                - path: index.html
                  sha256: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
                  size: 5120
                - path: assets/app.js
                  sha256: fcde2b2edba56bf408601fb721fe9b5c338d10ee429ea04fae5511b68fbf8fb9
                  size: 48211
      responses:
        '201':
          description: Created. Upload the missing blobs, then activate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedDeploy'
              example:
                deploy:
                  id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e10
                  status: pending
                  createdAt: 1767225600000
                  fileCount: 2
                  totalSize: 53331
                  message: Fix typo on the install page
                  spa: false
                  immutableAssets: false
                missing:
                  - fcde2b2edba56bf408601fb721fe9b5c338d10ee429ea04fae5511b68fbf8fb9
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/deploys/{deployId}/blobs/{sha256}:
    parameters:
      - $ref: '#/components/parameters/SiteName'
      - $ref: '#/components/parameters/DeployId'
      - name: sha256
        in: path
        required: true
        description: The blob's SHA-256, as listed in the deploy's manifest.
        schema:
          $ref: '#/components/schemas/Sha256'
        example: fcde2b2edba56bf408601fb721fe9b5c338d10ee429ea04fae5511b68fbf8fb9
    put:
      operationId: uploadDeployBlob
      summary: Upload one file body for a pending deploy.
      description: >-
        The body is the file's raw bytes. The server verifies the SHA-256
        before storing it (`400 hash_mismatch`) and accepts only hashes in
        this deploy's manifest (`400 unexpected_blob`). Uploading a blob the
        server already holds succeeds without storing it again, so retries
        are safe. Bodies over the per-file limit answer
        `413 limit_exceeded`. A site the operator has taken down answers
        `409 site_unavailable`.
      tags: [deploys]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
            example: console.log("hello");
      responses:
        '204':
          description: Stored.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/deploys/{deployId}/activate:
    parameters:
      - $ref: '#/components/parameters/SiteName'
      - $ref: '#/components/parameters/DeployId'
    post:
      operationId: activateDeploy
      summary: Make a pending deploy the site's active deploy.
      description: >-
        Atomic: visitors see the previous deploy or this one, never a mix. A
        deploy with blobs still missing answers `409 blobs_missing`; one that
        is not pending answers `409 deploy_not_pending` (use `rollbackSite`
        to return to an earlier deploy). A site the operator has taken down
        answers `409 site_unavailable`.
      tags: [deploys]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
      responses:
        '200':
          description: Activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
              examples:
                activation:
                  $ref: '#/components/examples/Activation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/rollback:
    parameters:
      - $ref: '#/components/parameters/SiteName'
    post:
      operationId: rollbackSite
      summary: Reactivate an earlier deploy.
      description: >-
        Reactivates `deployId`, or without it the deploy that was active
        before the current one, instantly and with no upload. A deploy that
        was never activated answers `409 deploy_not_activated`; a site with
        no earlier deploy answers `409 no_previous_deploy`; a site the
        operator has taken down answers `409 site_unavailable`.
      tags: [deploys]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequest'
            example:
              deployId: 01928c4a-1f2e-7d3c-8b4a-596877665544
      responses:
        '200':
          description: Rolled back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
              examples:
                activation:
                  $ref: '#/components/examples/Activation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/domains:
    parameters:
      - $ref: '#/components/parameters/SiteName'
    get:
      operationId: listDomains
      summary: List a site's custom domains.
      description: Ordered by hostname.
      tags: [domains]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of custom domains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainPage'
              example:
                items:
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e31
                    hostname: www.example.org
                    status: active
                    routingRecord:
                      type: CNAME
                      name: www.example.org
                      value: docs.wardlock.example.net
                    verificationRecord:
                      type: TXT
                      name: _wardlock.www.example.org
                      value: wardlock-verify=EXAMPLEverifyTokenEXAMPLE1
                    createdAt: 1767225600000
                    verifiedAt: 1767225660000
                    lastCheckedAt: 1767312060000
                    nextCheckAt: 1767398460000
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e30
                    hostname: docs.example.com
                    status: pending
                    routingRecord:
                      type: CNAME
                      name: docs.example.com
                      value: docs.wardlock.example.net
                    verificationRecord:
                      type: TXT
                      name: _wardlock.docs.example.com
                      value: wardlock-verify=EXAMPLEverifyTokenEXAMPLE0
                    createdAt: 1767225600000
                    lastCheckedAt: 1767225660000
                    nextCheckAt: 1767225780000
                    failingSince: 1767225600000
                    failureReason: no_record
                    failureDetail: No CNAME or TXT record found for docs.example.com.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addDomain
      summary: Attach a custom domain to a site.
      description: >-
        Normalises the hostname (lowercase, IDN to A-label, no trailing dot or
        port) and answers with the records to create. The domain starts
        `pending` and is checked straight away. IP addresses, wildcards, the
        base domain and names under it, the dashboard host and the auth origin
        answer `400 invalid_hostname`. A hostname attached to any site answers
        `409 domain_taken` without saying which. A site the operator has
        taken down answers `409 site_unavailable`: its domains are frozen.
      tags: [domains]
      security:
        - sessionCookie: []
        - apiToken: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDomainRequest'
            example:
              hostname: Docs.Example.com.
      responses:
        '201':
          description: Attached and pending verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
              examples:
                pendingDomain:
                  $ref: '#/components/examples/PendingDomain'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/domains/{hostname}:
    parameters:
      - $ref: '#/components/parameters/SiteName'
      - $ref: '#/components/parameters/DomainHostname'
    get:
      operationId: getDomain
      summary: Get one of a site's custom domains.
      tags: [domains]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      responses:
        '200':
          description: The custom domain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
              examples:
                active:
                  $ref: '#/components/examples/ActiveDomain'
                pending:
                  $ref: '#/components/examples/PendingDomain'
                lapsed:
                  $ref: '#/components/examples/LapsedDomain'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeDomain
      summary: Detach a custom domain from its site.
      description: >-
        Serving stops immediately and the domain's certificate is deleted.
        The owner should also delete the DNS record, or whoever later holds
        the site name could claim the hostname. A site the operator has taken
        down answers `409 site_unavailable`: its domains are frozen.
      tags: [domains]
      security:
        - sessionCookie: []
        - apiToken: [manage]
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/domains/{hostname}/verify:
    parameters:
      - $ref: '#/components/parameters/SiteName'
      - $ref: '#/components/parameters/DomainHostname'
    post:
      operationId: verifyDomain
      summary: Check a custom domain's DNS now.
      description: >-
        Runs a check immediately and answers with the result: `status`,
        `lastCheckedAt` and, on failure, `failureReason`. Rate-limited per
        domain: a check too soon after the last answers `429` with code
        `checked_recently`. Any other `429` code, such as `rate_limited` for
        an API token refused after failed attempts, is not a cooldown.
      tags: [domains]
      security:
        - sessionCookie: []
        - apiToken: [manage]
      responses:
        '200':
          description: Checked. The body carries the outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
              examples:
                verified:
                  $ref: '#/components/examples/ActiveDomain'
                failed:
                  $ref: '#/components/examples/PendingDomain'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/CheckedRecently'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/policies:
    parameters:
      - $ref: '#/components/parameters/SiteName'
    get:
      operationId: listPolicies
      summary: List a site's access policies.
      description: >-
        Ordered by path, so the site default (`/`) comes first. Every site
        has a default; until its owner sets one it is public, so protection
        is opt-in per site or path.
      tags: [policies]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyPage'
              example:
                items:
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e40
                    path: /
                    visibility: protected
                    methods: [links, email, oauth]
                    allowlist:
                      emails: []
                      domains: [example.com]
                      githubOrgs: [example-org]
                    version: 3
                    createdAt: 1767225600000
                    updatedAt: 1767312000000
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e41
                    path: /assets/
                    visibility: public
                    methods: []
                    allowlist:
                      emails: []
                      domains: []
                      githubOrgs: []
                    version: 1
                    createdAt: 1767225600000
                    updatedAt: 1767225600000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setPolicy
      summary: Set the default or a path policy.
      description: >-
        Creates the policy for `path` or replaces its settings. The policy
        for a request is the one with the longest path matching it, falling
        back to the default (`/`); policies do not stack. A change takes
        effect on the next request and increments `version`, which ends
        every visitor session created under the old version. Setting the
        same settings again changes nothing. A path that is not `/` or a
        clean directory prefix such as `/docs/` answers
        `400 invalid_policy_path`; methods on a public policy, or none on a
        protected one, answer `400 invalid_policy`, as does the `password`
        method without a password to set or keep (`target: password`), and
        the `email` method without an allowed address or domain to set or
        keep (`target: allowlist`). The password is write-only: no response
        includes it or its hash. The `allowlist` is shared by the email-code
        and OAuth methods; omitting it keeps the current one, any change to
        it increments `version` (ending the sessions it let in), and a
        public policy has none (setting a policy public clears it).
      tags: [policies]
      security:
        - sessionCookie: []
        - apiToken: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPolicyRequest'
            example:
              path: /docs/
              visibility: protected
              methods: [links]
      responses:
        '200':
          description: The stored policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
              examples:
                policy:
                  $ref: '#/components/examples/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/policies/{policyId}:
    parameters:
      - $ref: '#/components/parameters/SiteName'
      - $ref: '#/components/parameters/PolicyId'
    delete:
      operationId: deletePolicy
      summary: Delete a path policy.
      description: >-
        Its paths fall back to the next longest matching policy on the next
        request, and visitor sessions created under it end. The site
        default cannot be deleted (`409 default_policy`); set it instead.
        A site the operator has taken down answers `409 site_unavailable`,
        since deleting a policy deletes the records of the sessions it
        issued.
      tags: [policies]
      security:
        - sessionCookie: []
        - apiToken: [manage]
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/links:
    parameters:
      - $ref: '#/components/parameters/SiteName'
    get:
      operationId: listShareLinks
      summary: List a site's share links.
      description: >-
        Newest first. Revoked links are not listed; expired and used-up links
        are, with their `status`. Tokens are never returned.
      tags: [links]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of share links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkPage'
              example:
                items:
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e50
                    publicId: q4v7m2xkpa
                    label: Linear ENG-123
                    path: /
                    status: active
                    uses: 0
                    createdAt: 1767225600000
                    lastAccessedAt: 1767312000000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createShareLink
      summary: Create a share link.
      description: >-
        The response is the only time the token and its URL are shown, and is
        sent with `Cache-Control: no-store`. The
        link lets anyone holding it read the site, or only `path` and below,
        wherever a protected policy enables share links; it works whatever
        the site's policies are now, so it starts working if the site is
        protected later. `url` opens the page directly with status 200 and a
        site session, with no login page or redirect; `Authorization: Bearer`
        with the token works too. A link with `maxUses` shows a "Click to
        view" page and counts a use only when the button is pressed. A label
        longer than 200 characters or with control characters, an expiry not
        in the future, a use limit outside 1 to 1000000 or a path that is not
        `/` or a clean directory prefix answers `400 invalid_share_link`.
      tags: [links]
      security:
        - sessionCookie: []
        - apiToken: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareLinkRequest'
            example:
              label: Linear ENG-123
              path: /docs/
              expiresAt: 1767830400000
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedShareLink'
              examples:
                createdShareLink:
                  $ref: '#/components/examples/CreatedShareLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/SiteName'
      - $ref: '#/components/parameters/LinkId'
    delete:
      operationId: revokeShareLink
      summary: Revoke a share link.
      description: >-
        Immediate: the token and every site session created from it stop
        working on their next request. A revoked link is no longer listed,
        and revoking it again answers `404`.
      tags: [links]
      security:
        - sessionCookie: []
        - apiToken: [manage]
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/links/{linkId}/rotate:
    parameters:
      - $ref: '#/components/parameters/SiteName'
      - $ref: '#/components/parameters/LinkId'
    post:
      operationId: rotateShareLink
      summary: Rotate a share link's token.
      description: >-
        Issues a new token for the same link, keeping its public ID, label,
        path, expiry and use count. The old token and every site session
        created from the link stop working on their next request. The
        response is the only time the new token is shown, and is sent with
        `Cache-Control: no-store`.
      tags: [links]
      security:
        - sessionCookie: []
        - apiToken: [manage]
      responses:
        '200':
          description: The link with its new token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedShareLink'
              examples:
                createdShareLink:
                  $ref: '#/components/examples/CreatedShareLink'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/links/{linkId}/access-log:
    parameters:
      - $ref: '#/components/parameters/SiteName'
      - $ref: '#/components/parameters/LinkId'
    get:
      operationId: listShareLinkAccessLog
      summary: List one share link's access log.
      description: >-
        The requests that came in through the link (its token or a site
        session created from it), newest first. A revoked link's entries
        stay readable for as long as the access log keeps them. Entries name
        the link by public ID and never hold a token. A missing link, and a
        link on another site or of another owner, answer the same `404`.
      tags: [links]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of access-log entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessLogPage'
              example:
                items:
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e60
                    occurredAt: 1767312000000
                    host: docs.wardlock.example.net
                    path: /docs/
                    status: 200
                    via: link
                    linkPublicId: q4v7m2xkpa
                    ip: 203.0.113.0
                    userAgent: Mozilla/5.0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/access-log:
    parameters:
      - $ref: '#/components/parameters/SiteName'
    get:
      operationId: listSiteAccessLog
      summary: List a site's access log.
      description: >-
        Every logged request for the site's content, allowed or refused,
        newest first, however it got in. An entry that came through a share
        link names the link by public ID, and by label when the link has
        one; entries never hold a token. Only the site as it is now is read:
        a torn-down site's entries are not reachable, even after its name is
        reused. A missing site and another owner's answer the same `404`.
      tags: [sites]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of access-log entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessLogPage'
              example:
                items:
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e61
                    occurredAt: 1767312060000
                    host: docs.wardlock.example.net
                    path: /pricing/
                    status: 401
                    via: none
                    ip: 198.51.100.0
                    userAgent: curl/8.5.0
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e60
                    occurredAt: 1767312000000
                    host: docs.wardlock.example.net
                    path: /docs/
                    status: 200
                    via: link
                    linkPublicId: q4v7m2xkpa
                    linkLabel: Linear ENG-123
                    ip: 203.0.113.0
                    userAgent: Mozilla/5.0
                nextCursor: MTc2NzMxMjAwMDAwMDowMTkyOGM1ZQ
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-wardlock_session
      description: >-
        Dashboard owner session (C1.1): host-only, `Secure`, `HttpOnly`,
        `SameSite=Lax`, idle timeout 14 days, absolute 90 days.
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: wl_<public id>_<secret>
      description: >-
        API token (C1.7). Required scopes are listed per operation: `deploy`
        or `manage`.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
      example: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `nextCursor` of the previous page.
      schema:
        $ref: '#/components/schemas/Cursor'
      example: c2l0ZTpkb2Nz
    SiteName:
      name: site
      in: path
      required: true
      description: The site's name.
      schema:
        $ref: '#/components/schemas/SiteName'
      example: docs
    DeployId:
      name: deployId
      in: path
      required: true
      description: The deploy's ID.
      schema:
        $ref: '#/components/schemas/Id'
      example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e10
    SessionId:
      name: sessionId
      in: path
      required: true
      description: The session's ID.
      schema:
        $ref: '#/components/schemas/Id'
      example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e0f
    PasskeyId:
      name: passkeyId
      in: path
      required: true
      description: The passkey's ID (not its WebAuthn credential ID).
      schema:
        $ref: '#/components/schemas/Id'
      example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e40
    TokenId:
      name: tokenId
      in: path
      required: true
      description: The API token's ID (not its public ID).
      schema:
        $ref: '#/components/schemas/Id'
      example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e20
    PolicyId:
      name: policyId
      in: path
      required: true
      description: The policy's ID.
      schema:
        $ref: '#/components/schemas/Id'
      example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e41
    LinkId:
      name: linkId
      in: path
      required: true
      description: The share link's public ID.
      schema:
        $ref: '#/components/schemas/LinkPublicId'
      example: q4v7m2xkpa
    DomainHostname:
      name: hostname
      in: path
      required: true
      description: The custom domain, in its normalised form.
      schema:
        $ref: '#/components/schemas/Hostname'
      example: docs.example.com

  headers:
    SetSessionCookie:
      description: >-
        The dashboard session cookie, `__Host-wardlock_session`, `Path=/`,
        `Secure`, `HttpOnly`, `SameSite=Lax`.
      schema:
        type: string
      example: __Host-wardlock_session=<opaque>; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=1209600
    ClearSessionCookie:
      description: Clears the dashboard session cookie when the request used one.
      schema:
        type: string
      example: __Host-wardlock_session=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 30

  responses:
    BadRequest:
      description: The request is malformed or a field is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid_request
            message: name must be 1-63 characters of a-z, 0-9 and '-'.
            target: name
    Unauthenticated:
      description: No valid credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthenticated
            message: Sign in or provide an API token.
    Forbidden:
      description: >-
        The credential lacks the scope this operation needs, or a
        cookie-authenticated request came from another origin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: forbidden
            message: This API token lacks the manage scope.
    NotFound:
      description: >-
        No such resource for this owner. Missing resources and other owners'
        resources get the same response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: Not found.
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: site_name_taken
            message: The site name docs is taken.
            target: name
    PasskeyLimit:
      description: The owner already has the most passkeys allowed (20).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: passkey_limit
            message: You have 20 passkeys, the most allowed. Remove one first.
    Gone:
      description: The CLI login is over; start a new one.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: login_expired
            message: This login has expired or was denied. Run wardlock login again.
    TooLarge:
      description: A size or count limit was exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: limit_exceeded
            message: assets/video.mp4 is 31457280 bytes; the limit is 26214400.
            target: assets/video.mp4
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rate_limited
            message: Too many attempts. Try again in 30 seconds.
    CheckedRecently:
      description: >-
        The domain was checked moments ago (`checked_recently`); try again
        after `Retry-After`. A refused API token answers `rate_limited`
        instead, which waiting out the cooldown does not fix.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: checked_recently
            message: This domain was checked moments ago. Try again shortly.
    Error:
      description: >-
        Any other error, including `500 internal` and `501 not_implemented`
        for an operation that is in the contract but not built yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_implemented
            message: This operation is not implemented yet.

  examples:
    MeSession:
      summary: Signed in with a dashboard session.
      value:
        owner:
          id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e00
          email: owner@example.com
          createdAt: 1767225600000
        credential: session
        scopes: [deploy, manage]
    MeApiToken:
      summary: Authenticated with a deploy-only API token.
      value:
        owner:
          id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e00
          email: owner@example.com
          createdAt: 1767225600000
        credential: apiToken
        scopes: [deploy]
    CreatedApiToken:
      summary: A new API token with its secret.
      value:
        apiToken:
          id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e20
          publicId: k7m2q6xw4a
          name: CI deploys
          scopes: [deploy]
          createdAt: 1767225600000
          expiresAt: 1798761600000
        token: wl_k7m2q6xw4a_EXAMPLEonlyEXAMPLEonlyEXAMPLEonlyEXAMPLEonl
    Site:
      summary: A site with an active deploy.
      value:
        id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e01
        name: docs
        hostname: docs.wardlock.example.net
        url: https://docs.wardlock.example.net/
        createdAt: 1767225600000

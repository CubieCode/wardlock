        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/policies:
    parameters:
      - $ref: '#/components/parameters/SiteName'
    get:
      operationId: listPolicies
      summary: List a site's access policies.
      description: >-
        Ordered by path, so the site default (`/`) comes first. Every site
        has a default; until its owner sets one it is public, so protection
        is opt-in per site or path.
      tags: [policies]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyPage'
              example:
                items:
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e40
                    path: /
                    visibility: protected
                    methods: [links]
                    version: 3
                    createdAt: 1767225600000
                    updatedAt: 1767312000000
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e41
                    path: /assets/
                    visibility: public
                    methods: []
                    version: 1
                    createdAt: 1767225600000
                    updatedAt: 1767225600000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setPolicy
      summary: Set the default or a path policy.
      description: >-
        Creates the policy for `path` or replaces its settings. The policy
        for a request is the one with the longest path matching it, falling
        back to the default (`/`); policies do not stack. A change takes
        effect on the next request and increments `version`, which ends
        every visitor session created under the old version. Setting the
        same settings again changes nothing. A path that is not `/` or a
        clean directory prefix such as `/docs/` answers
        `400 invalid_policy_path`; methods on a public policy, or none on a
        protected one, answer `400 invalid_policy`.
      tags: [policies]
      security:
        - sessionCookie: []
        - apiToken: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPolicyRequest'
            example:
              path: /docs/
              visibility: protected
              methods: [links]
      responses:
        '200':
          description: The stored policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
              examples:
                policy:
                  $ref: '#/components/examples/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/policies/{policyId}:
    parameters:
      - $ref: '#/components/parameters/SiteName'
      - $ref: '#/components/parameters/PolicyId'
    delete:
      operationId: deletePolicy
      summary: Delete a path policy.
      description: >-
        Its paths fall back to the next longest matching policy on the next
        request, and visitor sessions created under it end. The site
        default cannot be deleted (`409 default_policy`); set it instead.
      tags: [policies]
      security:
        - sessionCookie: []
        - apiToken: [manage]
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-wardlock_session
      description: >-
        Dashboard owner session (C1.1): host-only, `Secure`, `HttpOnly`,
        `SameSite=Lax`, idle timeout 14 days, absolute 90 days.
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: wl_<public id>_<secret>
      description: >-
        API token (C1.7). Required scopes are listed per operation: `deploy`
        or `manage`.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
      example: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `nextCursor` of the previous page.
      schema:
        $ref: '#/components/schemas/Cursor'
      example: c2l0ZTpkb2Nz
    SiteName:
      name: site
      in: path
      required: true
      description: The site's name.
      schema:
        $ref: '#/components/schemas/SiteName'
      example: docs
    DeployId:
      name: deployId
      in: path
      required: true
      description: The deploy's ID.
      schema:
        $ref: '#/components/schemas/Id'
      example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e10
    SessionId:
      name: sessionId
      in: path
      required: true
      description: The session's ID.
      schema:
        $ref: '#/components/schemas/Id'
      example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e0f
    PasskeyId:
      name: passkeyId
      in: path
      required: true
      description: The passkey's ID (not its WebAuthn credential ID).
      schema:
        $ref: '#/components/schemas/Id'
      example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e40
    TokenId:
      name: tokenId
      in: path
      required: true
      description: The API token's ID (not its public ID).
      schema:
        $ref: '#/components/schemas/Id'
      example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e20
    PolicyId:
      name: policyId
      in: path
      required: true
      description: The policy's ID.
      schema:
        $ref: '#/components/schemas/Id'
      example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e41
    DomainHostname:
      name: hostname
      in: path
      required: true
      description: The custom domain, in its normalised form.
      schema:
        $ref: '#/components/schemas/Hostname'
      example: docs.example.com

  headers:
    SetSessionCookie:
      description: >-
        The dashboard session cookie, `__Host-wardlock_session`, `Path=/`,
        `Secure`, `HttpOnly`, `SameSite=Lax`.
      schema:
        type: string
      example: __Host-wardlock_session=<opaque>; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=1209600
    ClearSessionCookie:
      description: Clears the dashboard session cookie when the request used one.
      schema:
        type: string
      example: __Host-wardlock_session=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 30

  responses:
    BadRequest:
      description: The request is malformed or a field is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid_request
            message: name must be 1-63 characters of a-z, 0-9 and '-'.
            target: name
    Unauthenticated:
      description: No valid credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthenticated
            message: Sign in or provide an API token.
    Forbidden:
      description: >-
        The credential lacks the scope this operation needs, or a
        cookie-authenticated request came from another origin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: forbidden
            message: This API token lacks the manage scope.
    NotFound:
      description: >-
        No such resource for this owner. Missing resources and other owners'
        resources get the same response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: Not found.
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: site_name_taken
            message: The site name docs is taken.
            target: name
    PasskeyLimit:
      description: The owner already has the most passkeys allowed (20).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: passkey_limit
            message: You have 20 passkeys, the most allowed. Remove one first.
    Gone:
      description: The CLI login is over; start a new one.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: login_expired
            message: This login has expired or was denied. Run wardlock login again.
    TooLarge:
      description: A size or count limit was exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: limit_exceeded
            message: assets/video.mp4 is 31457280 bytes; the limit is 26214400.
            target: assets/video.mp4
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rate_limited
            message: Too many attempts. Try again in 30 seconds.
    Error:
      description: >-
        Any other error, including `500 internal` and `501 not_implemented`
        for an operation that is in the contract but not built yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_implemented
            message: This operation is not implemented yet.

  examples:
    MeSession:
      summary: Signed in with a dashboard session.
      value:
        owner:
          id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e00
          email: owner@example.com
          createdAt: 1767225600000
        credential: session
        scopes: [deploy, manage]
    MeApiToken:
      summary: Authenticated with a deploy-only API token.
      value:
        owner:
          id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e00
          email: owner@example.com
          createdAt: 1767225600000
        credential: apiToken
        scopes: [deploy]
    CreatedApiToken:
      summary: A new API token with its secret.
      value:
        apiToken:
          id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e20
          publicId: k7m2q6xw4a
          name: CI deploys
          scopes: [deploy]
          createdAt: 1767225600000
          expiresAt: 1798761600000
        token: wl_k7m2q6xw4a_EXAMPLEonlyEXAMPLEonlyEXAMPLEonlyEXAMPLEonl
    Site:
      summary: A site with an active deploy.
      value:
        id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e01
        name: docs
        hostname: docs.wardlock.example.net
        url: https://docs.wardlock.example.net/
        createdAt: 1767225600000
        activeDeployId: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e10
        activatedAt: 1767225660000
    Activation:
      summary: The site after activation.
      value:
        site:
          id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e01
          name: docs
          hostname: docs.wardlock.example.net
          url: https://docs.wardlock.example.net/
          createdAt: 1767225600000
          activeDeployId: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e10
          activatedAt: 1767225660000
        deploy:
          id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e10
          status: active
          createdAt: 1767225600000
          activatedAt: 1767225660000
          fileCount: 42
          totalSize: 1532918
          message: Fix typo on the install page
          spa: false
    Policy:
      summary: A protected path policy.
      value:
        id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e42
        path: /docs/
        visibility: protected
        methods: [links]
        version: 1
        createdAt: 1767225600000
        updatedAt: 1767225600000
    PendingDomain:
      summary: A domain waiting for its DNS record.
      value:
        id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e30
        hostname: docs.example.com
        status: pending
        routingRecord:
          type: CNAME
          name: docs.example.com
          value: docs.wardlock.example.net
        verificationRecord:
          type: TXT
          name: _wardlock.docs.example.com
          value: wardlock-verify=EXAMPLEverifyTokenEXAMPLE0
        createdAt: 1767225600000
        lastCheckedAt: 1767225660000
        nextCheckAt: 1767225780000
        failingSince: 1767225600000
        failureReason: no_record
        failureDetail: No CNAME or TXT record found for docs.example.com.
    ActiveDomain:
      summary: A verified domain.
      value:
        id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e31
        hostname: www.example.org
        status: active
        routingRecord:
          type: CNAME
          name: www.example.org
          value: docs.wardlock.example.net
        verificationRecord:
          type: TXT
          name: _wardlock.www.example.org
          value: wardlock-verify=EXAMPLEverifyTokenEXAMPLE1
        createdAt: 1767225600000
        verifiedAt: 1767225660000
        lastCheckedAt: 1767312060000
        nextCheckAt: 1767398460000
    LapsedDomain:
      summary: A domain whose record has been gone for 72 hours.
      value:
        id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e32
        hostname: old.example.org
        status: lapsed
        routingRecord:
          type: CNAME
          name: old.example.org
          value: docs.wardlock.example.net
        verificationRecord:
          type: TXT
          name: _wardlock.old.example.org
          value: wardlock-verify=EXAMPLEverifyTokenEXAMPLE2
        createdAt: 1767225600000
        verifiedAt: 1767225660000
        lastCheckedAt: 1767571260000
        nextCheckAt: 1767657660000
        failingSince: 1767312060000
        failureReason: cname_elsewhere
        failureDetail: old.example.org is a CNAME for elsewhere.example.net.

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: The server's release version, or `dev` for local builds.
          examples: ['0.1.0']

    Error:
      type: object
      description: The body of every error response.
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            Stable machine-readable error code; see the table in the API
            description. New codes may be added.
          pattern: ^[a-z][a-z_]*$
          examples: [not_found]
        message:
          type: string
          description: Human-readable explanation. Never contains secrets.
          examples: [Not found.]
        target:
          type: string
          description: The field, manifest path or hostname the error is about.
          examples: [assets/../secret.txt]

    Id:
      type: string
      description: A lowercase, hyphenated UUIDv7.
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      examples: [01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e01]
    Timestamp:
      type: integer
      format: int64
      description: UTC milliseconds since the Unix epoch.
      minimum: 0
      examples: [1767225600000]
    Cursor:
      type: string
      description: Opaque pagination cursor.
      minLength: 1
      maxLength: 512
      examples: [c2l0ZTpkb2Nz]
    Email:
      type: string
      format: email
      maxLength: 254
      examples: [owner@example.com]
    Scope:
      type: string
      description: >-
        An API token scope. `deploy` creates sites and deploys, uploads,
        activates and rolls back; `manage` deletes sites, manages custom
        domains and sets access policies. Both read.
      enum: [deploy, manage]
    Scopes:
      type: array
      minItems: 1
      maxItems: 2
      uniqueItems: true
      items:
        $ref: '#/components/schemas/Scope'
      examples: [[deploy, manage]]
    SiteName:
      type: string
      description: >-
        A DNS label: 1-63 characters of a-z, 0-9 and '-', not starting or
        ending with '-'.
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
      examples: [docs]
    Hostname:
      type: string
      description: >-
        A hostname. Stored and returned lowercase, as A-labels, with no
        trailing dot or port.
      minLength: 1
      maxLength: 253
      examples: [docs.example.com]
    Sha256:
      type: string
      description: A SHA-256 digest as 64 lowercase hex characters.
      pattern: ^[0-9a-f]{64}$
      examples:
        [2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae]

    SetupRequest:
      type: object
      additionalProperties: false
      required: [code, email]
      properties:
        code:
          type: string
          description: The `code` query parameter of the setup URL.
          minLength: 1
          maxLength: 128
        email:
          $ref: '#/components/schemas/Email'
    SignInLinkRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: The `code` query parameter of the sign-in URL.
          minLength: 1
          maxLength: 128
    EmailCodeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    EmailCodeVerifyRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        code:
          type: string
          description: The 6-digit code from the email.
          pattern: ^[0-9]{6}$
    InviteOwnerRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'

    Owner:
      type: object
      additionalProperties: false
      required: [id, email, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          $ref: '#/components/schemas/Email'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    Me:
      type: object
      additionalProperties: false
      required: [owner, credential, scopes]
      properties:
        owner:
          $ref: '#/components/schemas/Owner'
        credential:
          type: string
          description: How this request was authenticated.
          enum: [session, apiToken]
        scopes:
          description: What the credential may do. A session has every scope.
          $ref: '#/components/schemas/Scopes'

    OwnerSession:
      type: object
      additionalProperties: false
      required: [id, createdAt, lastUsedAt, expiresAt, current]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastUsedAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          description: >-
            When the session ends if not used again: the earlier of the idle
            and absolute expiry.
          $ref: '#/components/schemas/Timestamp'
        userAgent:
          type: string
          description: The User-Agent that signed in, truncated to 200 characters.
          maxLength: 200
        current:
          type: boolean
          description: Whether this is the session making the request.
    SessionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OwnerSession'
        nextCursor:
          $ref: '#/components/schemas/Cursor'

    PasskeyChallenge:
      type: object
      additionalProperties: false
      required: [ceremonyId, options]
      properties:
        ceremonyId:
          type: string
          description: Names this challenge; send it back with the authenticator's response.
          maxLength: 128
        options:
          type: object
          additionalProperties: true
          description: >-
            WebAuthn `PublicKeyCredentialCreationOptions` (registration) or
            `PublicKeyCredentialRequestOptions` (sign-in) in their JSON form,
            with binary members (`challenge`, `user.id`, credential `id`s)
            base64url-encoded without padding.
    PasskeyCredential:
      type: object
      additionalProperties: true
      description: >-
        The `PublicKeyCredential` the authenticator returned, in its JSON
        form (`PublicKeyCredential.toJSON()`), binary members
        base64url-encoded without padding.
      required: [id, rawId, type, response]
      properties:
        id:
          type: string
        rawId:
          type: string
        type:
          type: string
          enum: [public-key]
        response:
          type: object
          additionalProperties: true
    PasskeySignInRequest:
      type: object
      additionalProperties: false
      required: [ceremonyId, credential]
      properties:
        ceremonyId:
          type: string
          maxLength: 128
        credential:
          $ref: '#/components/schemas/PasskeyCredential'
    CreatePasskeyRequest:
      type: object
      additionalProperties: false
      required: [ceremonyId, credential]
      properties:
        ceremonyId:
          type: string
          maxLength: 128
        name:
          type: string
          description: >-
            A label for the passkey, such as the device or password manager
            that holds it. Trimmed; blank or absent means "Passkey". No
            control characters.
          maxLength: 100
        credential:
          $ref: '#/components/schemas/PasskeyCredential'
    Passkey:
      type: object
      additionalProperties: false
      required: [id, name, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          maxLength: 100
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastUsedAt:
          description: The last sign-in with this passkey; absent if never used.
          $ref: '#/components/schemas/Timestamp'
    PasskeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Passkey'

    ApiToken:
      type: object
      additionalProperties: false
      required: [id, publicId, name, scopes, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        publicId:
          type: string
          description: The token's public ID, shown in the dashboard and logs.
          pattern: ^[a-z2-7]{10}$
          examples: [k7m2q6xw4a]
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          $ref: '#/components/schemas/Scopes'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          description: Absent when the token never expires.
          $ref: '#/components/schemas/Timestamp'
        lastUsedAt:
          description: Absent until the token is first used.
          $ref: '#/components/schemas/Timestamp'
    ApiTokenPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    CreateApiTokenRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          $ref: '#/components/schemas/Scopes'
        expiresAt:
          description: Omit for a token that never expires.
          $ref: '#/components/schemas/Timestamp'
    CreatedApiToken:
      type: object
      additionalProperties: false
      required: [apiToken, token]
      properties:
        apiToken:
          $ref: '#/components/schemas/ApiToken'
        token:
          type: string
          description: The secret token. Shown only in this response.
          pattern: ^wl_[a-z2-7]{10}_[A-Za-z0-9_-]{43}$

    StartCliLoginRequest:
      type: object
      additionalProperties: false
      properties:
        clientName:
          type: string
          description: Shown to the owner on the approval page.
          maxLength: 100
    CliLogin:
      type: object
      additionalProperties: false
      required:
        [
          deviceCode,
          userCode,
          verificationUrl,
          verificationUrlComplete,
          expiresAt,
          interval,
        ]
      properties:
        deviceCode:
          type: string
          description: Secret the CLI polls with. Never log it.
          minLength: 32
          maxLength: 128
        userCode:
          $ref: '#/components/schemas/UserCode'
        verificationUrl:
          type: string
          format: uri
          description: The dashboard page where the owner approves the login.
        verificationUrlComplete:
          type: string
          format: uri
          description: '`verificationUrl` with the user code filled in.'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        interval:
          type: integer
          format: int32
          description: Minimum seconds between polls.
          minimum: 1
    UserCode:
      type: string
      description: >-
        Eight letters from an alphabet without vowels or look-alikes, in two
        groups of four.
      pattern: ^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$
      examples: [BDFH-KMPR]
    PollCliLoginRequest:
      type: object
      additionalProperties: false
      required: [deviceCode]
      properties:
        deviceCode:
          type: string
          minLength: 1
          maxLength: 128
    CliLoginPending:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [pending]
    ApproveCliLoginRequest:
      type: object
      additionalProperties: false
      required: [userCode, scopes]
      properties:
        userCode:
          $ref: '#/components/schemas/UserCode'
        scopes:
          $ref: '#/components/schemas/Scopes'
        name:
          type: string
          description: The new token's name; defaults to the CLI's `clientName`.
          minLength: 1
          maxLength: 100
    DenyCliLoginRequest:
      type: object
      additionalProperties: false
      required: [userCode]
      properties:
        userCode:
          $ref: '#/components/schemas/UserCode'

    Site:
      type: object
      additionalProperties: false
      required: [id, name, hostname, url, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/SiteName'
        hostname:
          description: '`<name>.<base domain>`.'
          $ref: '#/components/schemas/Hostname'
        url:
          type: string
          format: uri
          description: The site's URL on the base domain.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        activeDeployId:
          description: Absent until the first activation.
          $ref: '#/components/schemas/Id'
        activatedAt:
          description: When the active deploy was last activated.
          $ref: '#/components/schemas/Timestamp'
    SitePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Site'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    CreateSiteRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/SiteName'

    Deploy:
      type: object
      additionalProperties: false
      required: [id, status, createdAt, fileCount, totalSize, spa]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          description: >-
            `pending` until first activated; `active` while it is the site's
            active deploy; `inactive` once replaced or rolled back from.
          enum: [pending, active, inactive]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        activatedAt:
          description: When it was last activated. Absent while pending.
          $ref: '#/components/schemas/Timestamp'
        fileCount:
          type: integer
          format: int32
          minimum: 0
        totalSize:
          type: integer
          format: int64
          description: Sum of file sizes in bytes.
          minimum: 0
        message:
          type: string
          maxLength: 500
        spa:
          type: boolean
          description: >-
            Whether missing paths without a file extension serve
            `/index.html` while this deploy is active.
    DeployPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Deploy'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    ManifestFile:
      type: object
      additionalProperties: false
      required: [path, sha256, size]
      properties:
        path:
          type: string
          description: Path relative to the deployed directory, with forward slashes.
          minLength: 1
          maxLength: 1024
          examples: [docs/install.html]
        sha256:
          $ref: '#/components/schemas/Sha256'
        size:
          type: integer
          format: int64
          description: File size in bytes.
          minimum: 0
    CreateDeployRequest:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ManifestFile'
        message:
          type: string
          maxLength: 500
        spa:
          type: boolean
          default: false
          description: Serve `/index.html` for missing extensionless paths.
    CreatedDeploy:
      type: object
      additionalProperties: false
      required: [deploy, missing]
      properties:
        deploy:
          $ref: '#/components/schemas/Deploy'
        missing:
          type: array
          description: Hashes to upload before activating, each once.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Sha256'
    RollbackRequest:
      type: object
      additionalProperties: false
      properties:
        deployId:
          description: Omit to return to the deploy active before the current one.
          $ref: '#/components/schemas/Id'
    Activation:
      type: object
      additionalProperties: false
      required: [site, deploy]
      properties:
        site:
          $ref: '#/components/schemas/Site'
        deploy:
          $ref: '#/components/schemas/Deploy'

    DnsRecord:
      type: object
      additionalProperties: false
      required: [type, name, value]
      properties:
        type:
          type: string
          enum: [CNAME, TXT]
        name:
          $ref: '#/components/schemas/Hostname'
        value:
          type: string
          examples: [docs.wardlock.example.net]
    Domain:
      type: object
      additionalProperties: false
      required:
        [id, hostname, status, routingRecord, verificationRecord, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        hostname:
          $ref: '#/components/schemas/Hostname'
        status:
          type: string
          description: >-
            `pending`: added, not yet verified, not served. `active`: verified,
            served and eligible for a certificate. `lapsed`: was active but has
            failed re-checks for 72 hours; not served until it passes again.
          enum: [pending, active, lapsed]
        routingRecord:
          description: '`CNAME <hostname> → <name>.<base domain>`.'
          $ref: '#/components/schemas/DnsRecord'
        verificationRecord:
          description: >-
            `TXT _wardlock.<hostname> → wardlock-verify=<token>`, needed only
            where the CNAME cannot be seen (apex or CDN-proxied records).
          $ref: '#/components/schemas/DnsRecord'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        verifiedAt:
          description: When the domain last became active.
          $ref: '#/components/schemas/Timestamp'
        lastCheckedAt:
          description: When DNS was last checked.
          $ref: '#/components/schemas/Timestamp'
        nextCheckAt:
          description: >-
            When the next automatic check is due. Absent for a pending domain
            past its 48-hour window, which is checked only on request.
          $ref: '#/components/schemas/Timestamp'
        failingSince:
          description: Start of the current run of failed checks. Absent after a pass.
          $ref: '#/components/schemas/Timestamp'
        failureReason:
          type: string
          description: >-
            Why the last check failed. Absent after a pass. `no_record`: no
            matching CNAME or TXT; `cname_elsewhere`: the CNAME chain leads
            somewhere else; `txt_mismatch`: the TXT record holds another
            token; `dns_error`: the lookup failed or timed out.
          enum: [no_record, cname_elsewhere, txt_mismatch, dns_error]
        failureDetail:
          type: string
          description: Plain-language detail for the last failure.
    DomainPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    AddDomainRequest:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname:
          type: string
          description: The hostname as typed; the server normalises it.
          minLength: 1
          maxLength: 253

    PolicyVisibility:
      type: string
      description: >-
        `public`: anyone may read. `protected`: a visitor must satisfy one of
        the policy's methods.
      enum: [public, protected]
    PolicyMethod:
      type: string
      description: >-
        A way for a visitor to satisfy a protected policy. Methods are
        alternatives, not layers. `links`: share links (A2.2). Password,
        email code and OAuth join with A2.3, A2.4 and A2.5.
      enum: [links]
    PolicyPath:
      type: string
      description: >-
        `/` for the site default, or a directory prefix starting and ending
        with `/`, such as `/docs/`. A prefix also covers the directory's own
        path without its slash (`/docs`). Matched case-sensitively against
        the decoded request path; `/.wardlock/` is never subject to
        policies.
      minLength: 1
      maxLength: 1024
      examples: [/docs/]
    Policy:
      type: object
      additionalProperties: false
      required: [id, path, visibility, methods, version, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        path:
          $ref: '#/components/schemas/PolicyPath'
        visibility:
          $ref: '#/components/schemas/PolicyVisibility'
        methods:
          type: array
          description: Enabled methods; empty exactly when the policy is public.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PolicyMethod'
        version:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Starts at 1 and increases with every change. Visitor sessions are
            bound to the version they were created under.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    PolicyPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    SetPolicyRequest:
      type: object
      additionalProperties: false
      required: [path, visibility]
      properties:
        path:
          $ref: '#/components/schemas/PolicyPath'
        visibility:
          $ref: '#/components/schemas/PolicyVisibility'
        methods:
          type: array
          description: >-
            Methods to enable on a protected policy; omitted means `[links]`
            (share links are on by default). Must be empty or omitted for a
            public policy.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PolicyMethod'

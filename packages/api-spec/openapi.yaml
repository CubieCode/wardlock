          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/domains/{hostname}/verify:
    parameters:
      - $ref: '#/components/parameters/SiteName'
      - $ref: '#/components/parameters/DomainHostname'
    post:
      operationId: verifyDomain
      summary: Check a custom domain's DNS now.
      description: >-
        Runs a check immediately and answers with the result: `status`,

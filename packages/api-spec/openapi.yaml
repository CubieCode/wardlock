  /api/v0/sites/{site}/deploys:
    parameters:
      - $ref: '#/components/parameters/SiteName'
    get:
      operationId: listDeploys
      summary: List a site's deploys.
      description: Newest first.
      tags: [deploys]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of deploys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployPage'
              example:
                items:
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e10
                    status: active
                    createdAt: 1767225600000
                    activatedAt: 1767225660000
                    fileCount: 42
                    totalSize: 1532918
                    message: Fix typo on the install page
                    spa: false
                    immutableAssets: false
                  - id: 01928c4a-1f2e-7d3c-8b4a-596877665544
                    status: inactive
                    createdAt: 1767139200000
                    activatedAt: 1767139260000
                    fileCount: 40
                    totalSize: 1480233
                    spa: false
                    immutableAssets: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createDeploy
      summary: Create a deploy from a manifest.
      description: >-
        Records the manifest and answers with the SHA-256 hashes the server
        still needs. Upload each with `uploadDeployBlob`, then call
        `activateDeploy`. Files whose content the server already holds for
        the owner are not listed, so an unchanged re-deploy uploads nothing.
        Paths are normalised to forward slashes and must be valid UTF-8,
        without `..`, empty segments, control characters or a leading
        `.wardlock/`; a rejected path answers `400 invalid_path` with the
        path as `target`. A duplicate path answers `400 invalid_manifest`,
        and so does a file whose content (its `sha256`) the owner has already
        uploaded but whose listed `size` is not that content's size, with the
        path as `target` and a message naming both sizes; only the owner's
        own uploads are compared, never another owner's.
        Exceeding the file count, file size or total size limits, or the
        lower per-file limit for video files (by extension: `.mp4`, `.webm`,
        `.mov` and the like), answers `413 limit_exceeded` with the file's
        path as `target`; a server that refuses video answers the same for
        any video file. A file whose extension the operator has blocked
        answers `422 file_type_blocked` with its path as `target`. The
        deploy also counts against the owner's quotas at once, before any
        upload: bytes stored (each distinct file once, however many of the
        owner's deploys list it, so unchanged files cost nothing), answered
        `413 limit_exceeded` with target `files`, and deploys created in any
        24 hours, answered `413 limit_exceeded` with target `deploys`. A
        refused deploy counts towards neither. A site the operator has taken
        down answers `409 site_unavailable`.

        With `path` (a prefix such as `/mockup-x/`), the deploy replaces
        only that prefix of the site and keeps everything else. The server
        pins the site's active deploy as the base; the new deploy lists the
        base's files outside the prefix unchanged plus `files` placed under
        the prefix (`index.html` becomes `mockup-x/index.html`), and `files`
        may be empty to remove the prefix. A site with nothing live takes
        the prefix's files alone. `spa` and `immutableAssets` carry over from
        the base unless given. Limits, blocked file types, the video limit
        and quotas apply to the merged deploy exactly as to a full one, and
        `fileCount` and `totalSize` describe it; listed sizes are checked
        against the owner's uploads for `files` only, since the base's were
        checked when it was created. A prefix that is `/`, does
        not start and end with `/`, breaks the path rules or lies under
        `/.wardlock/` answers `400 invalid_path` with target `path`.
        Activation refuses a path deploy with `409 stale_base` once the site
        serves another deploy than its base; create it again (nothing needs
        uploading again).

        `redirects` and `headers` are the deploy's rules (SPEC "Redirects
        and response headers"), recorded on it like `spa`, so rollback
        restores them. Left out, a full deploy has none and a path deploy
        keeps its base's; an empty list has none either way. A malformed
        rule, a status other than 301, 302, 307 or 308, a `to` that is not a
        path on the site or an `https://` URL, a control character, a
        `from` or `path` under `/.wardlock/`, or a header name outside the
        allowlist answers `400 invalid_config` with the rule
        (`redirects[3]`, `headers[0]`) as `target`. More than 1,000
        redirects or 100 header rules answers `413 limit_exceeded` with
        target `redirects` or `headers`; a value over 8 KiB, with the rule
        as target; more than 64 KiB in all rules, with the list that
        passed it (redirects are counted first).

        With `preview` (a name such as `pr-42`), the deploy goes to that
        preview of the site (C1.19), served at
        `<site>--<preview>.<base domain>`, instead of the live site:
        activating it makes it the preview's deploy and leaves the site as
        it is, and deploying to the same name again replaces it. A name
        that is not 1 to 20 characters of a-z, 0-9 and '-', starts or ends
        with '-' or contains '--', or whose hostname label would pass 63
        characters, answers `400 invalid_preview_name`; a label that is an
        existing site's name answers `409 site_name_taken`, both with target
        `preview`. With `path` too, the base is the live site's active
        deploy, as for any path deploy. `previewExpires` sets how long the
        preview lasts after this deploy is activated, `14d` by default (or
        the preview's own setting when it already exists); it needs
        `preview` (`400 invalid_request` otherwise). A preview deploy counts
        towards quotas and is screened like any other.
      tags: [deploys]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeployRequest'
            example:
              message: Fix typo on the install page
              spa: false
              immutableAssets: false
              files:
                - path: index.html
                  sha256: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
                  size: 5120
                - path: assets/app.js
                  sha256: fcde2b2edba56bf408601fb721fe9b5c338d10ee429ea04fae5511b68fbf8fb9
                  size: 48211
      responses:
        '201':
          description: Created. Upload the missing blobs, then activate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedDeploy'
              example:
                deploy:
                  id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e10
                  status: pending
                  createdAt: 1767225600000
                  fileCount: 2
                  totalSize: 53331
                  message: Fix typo on the install page
                  spa: false
                  immutableAssets: false
                missing:
                  - fcde2b2edba56bf408601fb721fe9b5c338d10ee429ea04fae5511b68fbf8fb9
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/FileTypeBlocked'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/deploys/{deployId}/files:
    parameters:
      - $ref: '#/components/parameters/SiteName'
      - $ref: '#/components/parameters/DeployId'
    get:
      operationId: listDeployFiles
      summary: List a deploy's files.
      description: >-
        Every file the deploy serves, ordered by path (bytewise), with its
        SHA-256 and size (C1.14). A path deploy lists the whole merged site,
        as it serves it. Download each body with `downloadDeployBlob`. Works
        for any deploy in the site's history, pending ones included. A site
        the operator has taken down answers `409 site_unavailable`, for its
        owner too.
      tags: [deploys]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployFilePage'
              example:
                items:
                  - path: assets/app.js
                    sha256: fcde2b2edba56bf408601fb721fe9b5c338d10ee429ea04fae5511b68fbf8fb9
                    size: 48211
                  - path: index.html
                    sha256: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
                    size: 5120
                nextCursor: aW5kZXguaHRtbA
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/deploys/{deployId}/blobs/{sha256}:
    parameters:
      - $ref: '#/components/parameters/SiteName'
      - $ref: '#/components/parameters/DeployId'
      - name: sha256
        in: path
        required: true
        description: The blob's SHA-256, as listed in the deploy's manifest.
        schema:
          $ref: '#/components/schemas/Sha256'
        example: fcde2b2edba56bf408601fb721fe9b5c338d10ee429ea04fae5511b68fbf8fb9
    get:
      operationId: downloadDeployBlob
      summary: Download one file body of a deploy.
      description: >-
        Answers the raw bytes of a file the deploy lists, for any deploy in
        the site's history (C1.14). The hash must be listed by this deploy
        and uploaded by this owner: a hash the deploy does not list, one only
        another owner uploaded (a pending deploy can list any hash), and a
        body garbage collection has removed all answer the same
        `404 not_found` as a missing site or deploy, so content addressing
        never reveals or hands over another owner's file. `Range` requests
        are answered `206` with one range or `multipart/byteranges`, and a
        range outside the file `416`; `If-None-Match` with the `ETag` (the
        quoted hash) answers `304`. The body is always
        `application/octet-stream` with `Content-Disposition: attachment`,
        `X-Content-Type-Options: nosniff`,
        `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'; sandbox`
        and `Cache-Control: private, no-store`, so site content never renders
        on the dashboard origin. A file content screening has withheld
        (A2.15) answers `451 file_withheld`. A site the operator has taken
        down answers `409 site_unavailable`, for its owner too: its files
        are kept for the operator, never handed out for rehosting.
      tags: [deploys]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      parameters:
        - name: Range
          in: header
          required: false
          description: One or more byte ranges, as in RFC 9110 (`bytes=0-1023`).
          schema:
            type: string
          example: bytes=0-1023
      responses:
        '200':
          description: The whole file.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/Attachment'
            ETag:
              $ref: '#/components/headers/BlobETag'
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
              example: console.log("hello");
        '206':
          description: The requested range or ranges of the file.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/Attachment'
            Content-Range:
              description: The range sent, for a single range.
              schema:
                type: string
              example: bytes 0-1023/48211
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
              example: console.log(
        '304':
          description: Not modified; the `If-None-Match` ETag matches.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '416':
          description: The range lies outside the file.
          content:
            text/plain:
              schema:
                type: string
              example: invalid range
        '451':
          $ref: '#/components/responses/FileWithheld'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: uploadDeployBlob
      summary: Upload one file body for a pending deploy.
      description: >-
        The body is the file's raw bytes. The server verifies the SHA-256
        before storing it (`400 hash_mismatch`) and accepts only hashes in
        this deploy's manifest (`400 unexpected_blob`). Uploading a blob the
        server already holds succeeds without storing it again, so retries
        are safe. Bodies over the per-file limit answer
        `413 limit_exceeded`. A site the operator has taken down answers
        `409 site_unavailable`.
      tags: [deploys]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
            example: console.log("hello");
      responses:
        '204':
          description: Stored.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/deploys/{deployId}/activate:
    parameters:
      - $ref: '#/components/parameters/SiteName'
      - $ref: '#/components/parameters/DeployId'
    post:
      operationId: activateDeploy
      summary: Make a pending deploy the site's active deploy.
      description: >-
        Atomic: visitors see the previous deploy or this one, never a mix. A
        deploy with blobs still missing answers `409 blobs_missing`; one that
        is not pending answers `409 deploy_not_pending` (use `rollbackSite`
        to return to an earlier deploy). A path deploy whose base is no
        longer the site's active deploy answers `409 stale_base`: another
        deploy or rollback went live after it was created, so create it
        again, which pins the new base. A deploy listing a file whose
        content (its `sha256`) the owner holds at a size other than the
        listed one answers `400 invalid_manifest` with the path as `target`
        and a message naming both sizes, as `createDeploy` does; this
        happens when that content was uploaded through another deploy after
        this one was created. Such a deploy can never be activated: create a
        new one with the right sizes. A site the operator has taken down
        answers `409 site_unavailable`. A preview deploy (C1.19) becomes its
        preview's deploy instead, its expiry starting again from now, and
        the site keeps its active deploy; the answer then carries
        `preview`.
      tags: [deploys]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
      responses:
        '200':
          description: Activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
              examples:
                activation:
                  $ref: '#/components/examples/Activation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/rollback:
    parameters:
      - $ref: '#/components/parameters/SiteName'
    post:
      operationId: rollbackSite
      summary: Reactivate an earlier deploy.
      description: >-
        Reactivates `deployId`, or without it the deploy that was active
        before the current one, instantly and with no upload. A deploy that
        was never activated on the live site, including a preview deploy
        that was never promoted, answers `409 deploy_not_activated`; a site
        with no earlier deploy answers `409 no_previous_deploy`; a site the
        operator has taken down answers `409 site_unavailable`.
      tags: [deploys]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequest'
            example:
              deployId: 01928c4a-1f2e-7d3c-8b4a-596877665544
      responses:
        '200':
          description: Rolled back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
              examples:
                activation:
                  $ref: '#/components/examples/Activation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/domains:
    parameters:
      - $ref: '#/components/parameters/SiteName'
    get:
      operationId: listDomains
      summary: List a site's custom domains.

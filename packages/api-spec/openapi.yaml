      value:
        id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e32
        hostname: old.example.org
        status: lapsed
        routingRecord:
          type: CNAME
          name: old.example.org
          value: docs.wardlock.example.net
        verificationRecord:
          type: TXT
          name: _wardlock.old.example.org
          value: wardlock-verify=EXAMPLEverifyTokenEXAMPLE2
        createdAt: 1767225600000
        verifiedAt: 1767225660000
        lastCheckedAt: 1767571260000
        nextCheckAt: 1767657660000
        failingSince: 1767312060000
        failureReason: cname_elsewhere
        failureDetail: old.example.org is a CNAME for elsewhere.example.net.

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: The server's release version, or `dev` for local builds.
          examples: ['0.1.0']

    Error:
      type: object
      description: The body of every error response.
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            Stable machine-readable error code; see the table in the API
            description. New codes may be added.
          pattern: ^[a-z][a-z_]*$
          examples: [not_found]
        message:
          type: string
          description: Human-readable explanation. Never contains secrets.
          examples: [Not found.]
        target:
          type: string
          description: The field, manifest path or hostname the error is about.
          examples: [assets/../secret.txt]

    Id:
      type: string
      description: A lowercase, hyphenated UUIDv7.
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      examples: [01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e01]
    Timestamp:
      type: integer
      format: int64
      description: UTC milliseconds since the Unix epoch.
      minimum: 0
      examples: [1767225600000]
    Cursor:
      type: string
      description: Opaque pagination cursor.
      minLength: 1
      maxLength: 512
      examples: [c2l0ZTpkb2Nz]
    Email:
      type: string
      format: email
      maxLength: 254
      examples: [owner@example.com]
    Scope:
      type: string
      description: >-
        An API token scope. `deploy` creates sites and deploys, uploads,
        activates and rolls back; `manage` deletes sites, manages custom
        domains and sets access policies. Both read.
      enum: [deploy, manage]
    Scopes:
      type: array
      minItems: 1
      maxItems: 2
      uniqueItems: true
      items:
        $ref: '#/components/schemas/Scope'
      examples: [[deploy, manage]]
    SiteName:
      type: string
      description: >-
        A DNS label: 1-63 characters of a-z, 0-9 and '-', not starting or
        ending with '-'.
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
      examples: [docs]
    Hostname:
      type: string
      description: >-
        A hostname. Stored and returned lowercase, as A-labels, with no
        trailing dot or port.
      minLength: 1
      maxLength: 253
      examples: [docs.example.com]
    Sha256:
      type: string
      description: A SHA-256 digest as 64 lowercase hex characters.
      pattern: ^[0-9a-f]{64}$
      examples:
        [2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae]

    SetupRequest:
      type: object
      additionalProperties: false
      required: [code, email]
      properties:
        code:
          type: string
          description: The `code` query parameter of the setup URL.
          minLength: 1
          maxLength: 128
        email:
          $ref: '#/components/schemas/Email'
    SignInLinkRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: The `code` query parameter of the sign-in URL.
          minLength: 1
          maxLength: 128
    EmailCodeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    EmailCodeVerifyRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        code:
          type: string
          description: The 6-digit code from the email.
          pattern: ^[0-9]{6}$
    InviteOwnerRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'

    Owner:
      type: object
      additionalProperties: false
      required: [id, email, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          $ref: '#/components/schemas/Email'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    Me:
      type: object
      additionalProperties: false
      required: [owner, credential, scopes]
      properties:
        owner:
          $ref: '#/components/schemas/Owner'
        credential:
          type: string
          description: How this request was authenticated.
          enum: [session, apiToken]
        scopes:
          description: What the credential may do. A session has every scope.
          $ref: '#/components/schemas/Scopes'

    OwnerSession:
      type: object
      additionalProperties: false
      required: [id, createdAt, lastUsedAt, expiresAt, current]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastUsedAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          description: >-
            When the session ends if not used again: the earlier of the idle
            and absolute expiry.
          $ref: '#/components/schemas/Timestamp'
        userAgent:
          type: string
          description: The User-Agent that signed in, truncated to 200 characters.
          maxLength: 200
        current:
          type: boolean
          description: Whether this is the session making the request.
    SessionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OwnerSession'
        nextCursor:
          $ref: '#/components/schemas/Cursor'

    PasskeyChallenge:
      type: object
      additionalProperties: false
      required: [ceremonyId, options]
      properties:
        ceremonyId:
          type: string
          description: Names this challenge; send it back with the authenticator's response.
          maxLength: 128
        options:
          type: object
          additionalProperties: true
          description: >-
            WebAuthn `PublicKeyCredentialCreationOptions` (registration) or
            `PublicKeyCredentialRequestOptions` (sign-in) in their JSON form,
            with binary members (`challenge`, `user.id`, credential `id`s)
            base64url-encoded without padding.
    PasskeyCredential:
      type: object
      additionalProperties: true
      description: >-
        The `PublicKeyCredential` the authenticator returned, in its JSON
        form (`PublicKeyCredential.toJSON()`), binary members
        base64url-encoded without padding.
      required: [id, rawId, type, response]
      properties:
        id:
          type: string
        rawId:
          type: string
        type:
          type: string
          enum: [public-key]
        response:
          type: object
          additionalProperties: true
    PasskeySignInRequest:
      type: object
      additionalProperties: false
      required: [ceremonyId, credential]
      properties:
        ceremonyId:
          type: string
          maxLength: 128
        credential:
          $ref: '#/components/schemas/PasskeyCredential'
    CreatePasskeyRequest:
      type: object
      additionalProperties: false
      required: [ceremonyId, credential]
      properties:
        ceremonyId:
          type: string
          maxLength: 128
        name:
          type: string
          description: >-
            A label for the passkey, such as the device or password manager
            that holds it. Trimmed; blank or absent means "Passkey". No
            control characters.
          maxLength: 100
        credential:
          $ref: '#/components/schemas/PasskeyCredential'
    Passkey:
      type: object
      additionalProperties: false
      required: [id, name, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          maxLength: 100
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastUsedAt:
          description: The last sign-in with this passkey; absent if never used.
          $ref: '#/components/schemas/Timestamp'
    NotificationSettings:
      type: object
      description: Which emails an owner gets, each `true` for on.
      additionalProperties: false
      required:
        [
          domainVerified,
          domainFailing,
          linkUsedUp,
          linksExpiring,
          tokenExpiring,
          previewExpiring,
        ]
      properties:
        domainVerified:
          type: boolean
          description: A custom domain passed verification.
        domainFailing:
          type: boolean
          description: >-
            An active custom domain has failed its checks for 24 hours, and
            again if it lapses.
        linkUsedUp:
          type: boolean
          description: A use-limited share link has no uses left.
        linksExpiring:
          type: boolean
          description: >-
            Share links expire within 48 hours, at most one email a day.
        tokenExpiring:
          type: boolean
          description: An API token expires within 7 days.
        previewExpiring:
          type: boolean
          description: A preview expires within 2 days.
    NotificationSettingsUpdate:
      type: object
      description: >-
        The settings to change, as in `NotificationSettings`; one left out
        keeps its value.
      additionalProperties: false
      properties:
        domainVerified:
          type: boolean
        domainFailing:
          type: boolean
        linkUsedUp:
          type: boolean
        linksExpiring:
          type: boolean
        tokenExpiring:
          type: boolean
        previewExpiring:
          type: boolean
    PasskeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Passkey'

    ApiToken:
      type: object
      additionalProperties: false
      required: [id, publicId, name, scopes, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        publicId:
          type: string
          description: The token's public ID, shown in the dashboard and logs.
          pattern: ^[a-z2-7]{10}$
          examples: [k7m2q6xw4a]
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          $ref: '#/components/schemas/Scopes'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          description: Absent when the token never expires.
          $ref: '#/components/schemas/Timestamp'
        lastUsedAt:
          description: Absent until the token is first used.
          $ref: '#/components/schemas/Timestamp'
    ApiTokenPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    CreateApiTokenRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          $ref: '#/components/schemas/Scopes'
        expiresAt:
          description: Omit for a token that never expires.
          $ref: '#/components/schemas/Timestamp'
    CreatedApiToken:
      type: object
      additionalProperties: false
      required: [apiToken, token]
      properties:
        apiToken:
          $ref: '#/components/schemas/ApiToken'
        token:
          type: string
          description: The secret token. Shown only in this response.
          pattern: ^wl_[a-z2-7]{10}_[A-Za-z0-9_-]{43}$

    StartCliLoginRequest:
      type: object
      additionalProperties: false
      properties:
        clientName:
          type: string
          description: >-
            How the CLI describes itself, such as `wardlock 0.1.0 on
            build-laptop`. It becomes the default name of the API token the
            login creates, unless the approving owner names the token. It is
            not shown on the approval page.
          maxLength: 100
    CliLogin:
      type: object
      additionalProperties: false
      required:
        [
          deviceCode,
          userCode,
          verificationUrl,
          verificationUrlComplete,
          expiresAt,
          interval,
        ]
      properties:
        deviceCode:
          type: string
          description: Secret the CLI polls with. Never log it.
          minLength: 32
          maxLength: 128
        userCode:
          $ref: '#/components/schemas/UserCode'
        verificationUrl:
          type: string
          format: uri
          description: The dashboard page where the owner approves the login.
        verificationUrlComplete:
          type: string
          format: uri
          description: '`verificationUrl` with the user code filled in.'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        interval:
          type: integer
          format: int32
          description: Minimum seconds between polls.
          minimum: 1
    UserCode:
      type: string
      description: >-
        Eight letters from an alphabet without vowels or look-alikes, in two
        groups of four.
      pattern: ^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$
      examples: [BDFH-KMPR]
    PollCliLoginRequest:
      type: object
      additionalProperties: false
      required: [deviceCode]
      properties:
        deviceCode:
          type: string
          minLength: 1
          maxLength: 128
    CliLoginPending:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [pending]
    ApproveCliLoginRequest:
      type: object
      additionalProperties: false
      required: [userCode, scopes]
      properties:
        userCode:
          $ref: '#/components/schemas/UserCode'
        scopes:
          $ref: '#/components/schemas/Scopes'
        name:
          type: string
          description: >-
            The new token's name; defaults to the CLI's `clientName`, or
            `wardlock CLI` when it sent none.
          minLength: 1
          maxLength: 100
    DenyCliLoginRequest:
      type: object
      additionalProperties: false
      required: [userCode]
      properties:
        userCode:
          $ref: '#/components/schemas/UserCode'

    Site:
      type: object
      additionalProperties: false
      required:
        [id, name, hostname, url, createdAt, unavailable, tagIds, pinned]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/SiteName'
        unavailable:
          type: boolean
          description: >-
            True while the instance's operator has taken the site down:
            visitors see an unavailable page on every hostname, and deploys,
            activations, rollbacks and deletion answer
            `409 site_unavailable`. Only the operator can restore it.
        hostname:
          description: '`<name>.<base domain>`.'
          $ref: '#/components/schemas/Hostname'
        url:
          type: string
          format: uri
          description: The site's URL on the base domain.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        activeDeployId:
          description: Absent until the first activation.
          $ref: '#/components/schemas/Id'
        activatedAt:
          description: When the active deploy was last activated.
          $ref: '#/components/schemas/Timestamp'
        groupId:
          description: >-
            The owner's group the site is in; absent when ungrouped. Read
            only: set with setSiteOrganisation or organiseSites.
          $ref: '#/components/schemas/Id'
        tagIds:
          type: array
          description: >-
            The site's tags in tag-name order; empty when it has none. Read
            only, like `groupId`.
          maxItems: 20
          items:
            $ref: '#/components/schemas/Id'
        pinned:
          type: boolean
          description: >-
            True while the owner has the site pinned. Read only: set with
            pinSite, unpinSite or organiseSites.
        primaryHost:
          description: >-
            The hostname the site's other hostnames redirect to with `308`
            (C1.18): `hostname` or one of its active custom domains. Absent
            when there is none in effect, which is the default: every
            hostname then serves the site. A chosen custom domain that
            lapses is not in effect (absent here, no redirect) until it is
            active again; removing it clears the choice. Read only: set
            with setPrimaryHost and clearPrimaryHost.
          $ref: '#/components/schemas/Hostname'
    SitePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Site'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    CreateSiteRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/SiteName'
    GroupName:
      type: string
      description: >-
        1 to 40 characters with no control characters, unique among the
        owner's groups ignoring case: names are compared after Unicode NFC
        normalisation and lowercasing, so "Board" and "board", or "Kōwhai"
        and "KŌWHAI", cannot both exist. Surrounding spaces are trimmed; the
        name is kept and shown as typed.
      minLength: 1
      maxLength: 40
      examples: [Client work]
    GroupNote:
      type: string
      description: >-
        Up to 200 characters with no control characters. Surrounding spaces
        are trimmed; an empty note is no note.
      maxLength: 200
      examples: [Previews for clients]
    Group:
      type: object
      additionalProperties: false
      required: [id, name, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/GroupName'
        note:
          description: Absent when the group has no note.
          $ref: '#/components/schemas/GroupNote'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    GroupList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Group'
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/GroupName'
        note:
          $ref: '#/components/schemas/GroupNote'
    UpdateGroupRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/GroupName'
        note:
          $ref: '#/components/schemas/GroupNote'

    TagName:
      type: string
      description: 1 to 30 characters of a-z, 0-9 and '-', unique among the owner's tags.
      pattern: ^[a-z0-9-]{1,30}$
      examples: [preview]
    TagColour:
      type: integer
      format: int32
      description: >-
        A slot in the dashboard's tag palette: 0 is neutral, 1 to 8 the
        categorical colours. The dashboard always shows a tag's name beside
        its colour.
      minimum: 0
      maximum: 8
      examples: [1]
    Tag:
      type: object
      additionalProperties: false
      required: [id, name, colour, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/TagName'
        colour:
          $ref: '#/components/schemas/TagColour'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    TagList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Tag'
    CreateTagRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/TagName'
        colour:
          description: Absent for the lowest free slot 1-8, else 0.
          $ref: '#/components/schemas/TagColour'
    UpdateTagRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/TagName'
        colour:
          $ref: '#/components/schemas/TagColour'

    SetSiteOrganisationRequest:
      type: object
      additionalProperties: false
      required: [tagIds]
      properties:
        groupId:
          description: The site's group; absent for no group.
          $ref: '#/components/schemas/Id'
        tagIds:
          type: array
          description: Every tag the site should have, at most 20; empty for none.
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
    OrganiseSitesRequest:
      type: object
      additionalProperties: false
      required: [sites]
      description: >-
        At least one of `addTagIds`, `removeTagIds`, `groupId`, `ungroup`
        and `pinned` must change something.
      properties:
        sites:
          type: array
          description: The sites to change, by name, each at most once.
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SiteName'
        addTagIds:
          type: array
          description: Tags to add to every site; tags a site has are kept.
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
        removeTagIds:
          type: array
          description: Tags to remove from every site that has them.
          maxItems: 200
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
        groupId:
          description: Put every site in this group.
          $ref: '#/components/schemas/Id'
        ungroup:
          type: boolean
          description: True takes every site out of its group. Not with `groupId`.
        pinned:
          type: boolean
          description: Pin (true) or unpin (false) every site; a pinned site stays pinned since it was first pinned.
        pinnedAt:
          description: >-
            Only with `pinned: true`: pin each site that is not pinned as of
            this time rather than now, so undoing an unpin puts the site back
            in its place among the pins. Not in the future.
          $ref: '#/components/schemas/Timestamp'
    SiteOrganisation:
      type: object
      additionalProperties: false
      required: [site, tagIds, pinned]
      properties:
        site:
          $ref: '#/components/schemas/SiteName'
        groupId:
          description: Absent when the site was in no group.
          $ref: '#/components/schemas/Id'
        tagIds:
          type: array
          description: In tag-name order.
          maxItems: 20
          items:
            $ref: '#/components/schemas/Id'
        pinned:
          type: boolean
        pinnedAt:
          description: When the site was pinned; absent when it was not.
          $ref: '#/components/schemas/Timestamp'
    OrganiseSitesResult:
      type: object
      additionalProperties: false
      required: [prior]
      properties:
        prior:
          type: array
          description: Each site's group, tags and pin before the change, in the order named.
          maxItems: 500
          items:
            $ref: '#/components/schemas/SiteOrganisation'

    Deploy:
      type: object
      additionalProperties: false
      required:
        [id, status, createdAt, fileCount, totalSize, spa, immutableAssets]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          description: >-
            `pending` until first activated; `active` while it is the site's
            active deploy; `inactive` once replaced or rolled back from;
            `preview` for a preview deploy activated as its preview and never
            on the live site (C1.19), which is not a rollback target until
            promoted.
          enum: [pending, active, inactive, preview]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        activatedAt:
          description: >-
            When it was last activated on the live site. Absent while
            pending, and for a preview deploy that was never promoted.
          $ref: '#/components/schemas/Timestamp'
        fileCount:
          type: integer
          format: int32
          minimum: 0
        totalSize:
          type: integer
          format: int64
          description: Sum of file sizes in bytes.
          minimum: 0
        message:
          type: string
          maxLength: 500
        spa:
          type: boolean
          description: >-
            Whether missing paths without a file extension serve
            `/index.html` while this deploy is active.
        immutableAssets:
          type: boolean
          description: >-
            Whether files under `/assets/` with a content hash in their name
            are served with `Cache-Control: public, max-age=31536000,
            immutable` (`private` on protected sites) while this deploy is
            active. See SPEC "Serving" for the hash rule.
        path:
          description: >-
            The prefix a path deploy replaced, keeping the rest of its base.
            Absent for a full deploy. Either way the deploy lists every file
            the site serves while it is active.
          $ref: '#/components/schemas/DeployPath'
        redirects:
          type: array
          description: >-
            The deploy's redirect rules in order, each with its status.
            Absent when it has none.
          items:
            $ref: '#/components/schemas/Redirect'
        headers:
          type: array
          description: >-
            The deploy's header rules in order, with canonical header names.
            Absent when it has none.
          items:
            $ref: '#/components/schemas/HeaderRule'
        preview:
          description: >-
            The preview the deploy was made for (C1.19); absent for a
            deploy to the live site.
          $ref: '#/components/schemas/PreviewName'
    Redirect:
      type: object
      additionalProperties: false
      description: >-
        Applied, first match wins, only to a request path that serves no
        file (after clean URLs, before the 404 page and the SPA fallback),
        once the visitor may read that path. See SPEC "Redirects and
        response headers".
      required: [from, to]
      properties:
        from:
          type: string
          description: >-
            An exact clean path such as `/old`, or a prefix ending in `/*`
            such as `/blog/*`, which matches `/blog/` and everything under
            it. Never under `/.wardlock/`.
          minLength: 1
          maxLength: 8192
          examples: [/blog/*]
        to:
          type: string
          description: >-
            A path on the same site (`/news/:splat`) or an absolute
            `https://` URL. `:splat` in its path is replaced by what a `/*`
            prefix matched. The request's query string is kept unless `to`
            has its own.
          minLength: 1
          maxLength: 8192
          examples: [/news/:splat]
        status:
          type: integer
          description: Defaults to 301 on creation; always present on a Deploy.
          enum: [301, 302, 307, 308]
    HeaderRule:
      type: object
      additionalProperties: false
      description: >-
        Sets response headers on deploy responses for matching request
        paths; every matching rule applies in order, a later one
        overwriting the same name. See SPEC "Redirects and response
        headers" for the allowlist.
      required: [path, set]
      properties:
        path:
          type: string
          description: >-
            An exact clean path, or a prefix ending in `/*` (`/*` matches
            every path). Never under `/.wardlock/`.
          minLength: 1
          maxLength: 8192
          examples: [/*]
        set:
          type: object
          description: >-
            Header names to values: `Content-Security-Policy`,
            `Content-Security-Policy-Report-Only`, `Permissions-Policy`,
            `X-Frame-Options`, `Cross-Origin-Opener-Policy`,
            `Cross-Origin-Embedder-Policy`, `X-Content-Type-Options` (only
            `nosniff`), `Link`, and, sent only under public policies,
            `Referrer-Policy` and the `Access-Control-Allow-*`,
            `Access-Control-Expose-Headers` and `Access-Control-Max-Age`
            response headers.
          minProperties: 1
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 8192
          examples:
            - X-Frame-Options: DENY
    DeployPath:
      type: string
      description: >-
        A directory prefix starting and ending with `/`, such as
        `/mockup-x/`: never `/` itself, with no empty, `.` or `..` segments,
        no control or invisible format characters, and never under
        `/.wardlock/`. Matched byte for byte against deploy paths.
      minLength: 3
      maxLength: 1024
      pattern: ^/.+/$
      examples: [/mockup-x/]
    DeployPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Deploy'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    DeployFile:
      type: object
      additionalProperties: false
      required: [path, sha256, size]
      properties:
        path:
          type: string
          description: The file's path in the site, with forward slashes and no leading slash.
          minLength: 1
          maxLength: 1024
          examples: [docs/install.html]
        sha256:
          $ref: '#/components/schemas/Sha256'
        size:
          type: integer
          format: int64
          description: File size in bytes.
          minimum: 0
    DeployFilePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeployFile'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    ManifestFile:
      type: object
      additionalProperties: false
      required: [path, sha256, size]
      properties:
        path:
          type: string
          description: Path relative to the deployed directory, with forward slashes.
          minLength: 1
          maxLength: 1024
          examples: [docs/install.html]
        sha256:
          $ref: '#/components/schemas/Sha256'
        size:
          type: integer
          format: int64
          description: File size in bytes.
          minimum: 0
    CreateDeployRequest:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          description: >-
            The deploy's files, relative to `path` when it is given. At least
            one for a full deploy; empty with `path` removes the prefix.
          items:
            $ref: '#/components/schemas/ManifestFile'
        message:
          type: string
          maxLength: 500
        spa:
          type: boolean
          description: >-
            Serve `/index.html` for missing extensionless paths. Defaults to
            false, or with `path` to the base deploy's setting.
        immutableAssets:
          type: boolean
          description: >-
            Cache files under `/assets/` with a content hash in their name
            for a year as immutable (SPEC "Serving"). Only set it when every
            such name changes whenever its content does. Defaults to false,
            or with `path` to the base deploy's setting.
        path:
          description: >-
            Replace only this prefix of the site, keeping the active
            deploy's files outside it (see `createDeploy`).
          $ref: '#/components/schemas/DeployPath'
        redirects:
          type: array
          description: >-
            Redirect rules, in order. Left out, none, or with `path` the
            base deploy's; `[]` for none.
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Redirect'
        headers:
          type: array
          description: >-
            Header rules, in order. Left out, none, or with `path` the base
            deploy's; `[]` for none.
          maxItems: 100
          items:
            $ref: '#/components/schemas/HeaderRule'
        preview:
          description: >-
            Deploy to this preview of the site instead of the live site
            (see `createDeploy`).
          $ref: '#/components/schemas/PreviewName'
        previewExpires:
          $ref: '#/components/schemas/PreviewExpires'
    CreatedDeploy:
      type: object
      additionalProperties: false
      required: [deploy, missing]
      properties:
        deploy:
          $ref: '#/components/schemas/Deploy'
        missing:
          type: array
          description: Hashes to upload before activating, each once.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Sha256'
    RollbackRequest:
      type: object
      additionalProperties: false
      properties:
        deployId:
          description: Omit to return to the deploy active before the current one.
          $ref: '#/components/schemas/Id'
    Activation:
      type: object
      additionalProperties: false
      required: [site, deploy]
      properties:
        site:
          $ref: '#/components/schemas/Site'
        deploy:
          $ref: '#/components/schemas/Deploy'
        preview:
          description: >-
            The preview, as it is now, when a preview deploy was activated
            or a preview promoted (C1.19).
          $ref: '#/components/schemas/Preview'
    PreviewName:
      type: string
      description: >-
        A preview's name (C1.19): 1-20 characters of a-z, 0-9 and '-', not
        starting or ending with '-' and without '--'. The preview is served
        at `<site>--<name>.<base domain>`, a label of at most 63
        characters.
      minLength: 1
      maxLength: 20
      pattern: ^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?$
      examples: [pr-42]
    PreviewExpires:
      type: string
      description: >-
        How long a preview lasts after each deploy: `<days>d`, 1 to 90 days,
        or `never`. Left out, `14d` for a new preview, or the preview's own
        setting.
      pattern: ^(never|[1-9][0-9]?d)$
      examples: [14d, never]
    Preview:
      type: object
      additionalProperties: false
      required: [name, hostname, url, createdAt, deployedAt, deploy]
      properties:
        name:
          $ref: '#/components/schemas/PreviewName'
        hostname:
          description: '`<site>--<name>.<base domain>`.'
          $ref: '#/components/schemas/Hostname'
        url:
          type: string
          format: uri
          description: The preview's URL.
        createdAt:
          description: When the preview was first deployed.
          $ref: '#/components/schemas/Timestamp'
        deployedAt:
          description: When its deploy went live as the preview.
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          description: When it stops being served. Absent when it never expires.
          $ref: '#/components/schemas/Timestamp'
        deploy:
          $ref: '#/components/schemas/Deploy'
    PreviewPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Preview'
        nextCursor:
          $ref: '#/components/schemas/Cursor'

    DnsRecord:
      type: object
      additionalProperties: false
      required: [type, name, value]
      properties:
        type:
          type: string
          enum: [CNAME, TXT]
        name:
          $ref: '#/components/schemas/Hostname'
        value:
          type: string
          examples: [docs.wardlock.example.net]
    Domain:
      type: object
      additionalProperties: false
      required:
        [id, hostname, status, routingRecord, verificationRecord, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        hostname:
          $ref: '#/components/schemas/Hostname'
        status:
          type: string
          description: >-
            `pending`: added, not yet verified, not served. `active`: verified,
            served and eligible for a certificate. `lapsed`: was active but has
            failed re-checks for 72 hours; not served until it passes again.
          enum: [pending, active, lapsed]
        routingRecord:
          description: '`CNAME <hostname> → <name>.<base domain>`.'
          $ref: '#/components/schemas/DnsRecord'
        verificationRecord:
          description: >-
            `TXT _wardlock.<hostname> → wardlock-verify=<token>`, needed only
            where the CNAME cannot be seen (apex or CDN-proxied records).
          $ref: '#/components/schemas/DnsRecord'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        verifiedAt:
          description: When the domain last became active.
          $ref: '#/components/schemas/Timestamp'
        lastCheckedAt:
          description: When DNS was last checked.
          $ref: '#/components/schemas/Timestamp'
        nextCheckAt:
          description: >-
            When the next automatic check is due. Absent for a pending domain
            past its 48-hour window, which is checked only on request.
          $ref: '#/components/schemas/Timestamp'
        failingSince:
          description: Start of the current run of failed checks. Absent after a pass.
          $ref: '#/components/schemas/Timestamp'
        failureReason:
          type: string
          description: >-
            Why the last check failed. Absent after a pass. `no_record`: no
            matching CNAME or TXT; `cname_elsewhere`: the CNAME chain leads
            somewhere else; `txt_mismatch`: the TXT record holds another
            token; `dns_error`: the lookup failed or timed out.
          enum: [no_record, cname_elsewhere, txt_mismatch, dns_error]
        failureDetail:
          type: string
          description: Plain-language detail for the last failure.
        primary:
          type: boolean
          description: >-
            True when the owner chose this domain as the site's primary
            hostname (C1.18); absent otherwise. It is in effect only while
            the domain is `active`: while it is lapsed the site's
            `primaryHost` is absent and nothing redirects, and it resumes
            when a check passes again.
    DomainPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    SetPrimaryHostRequest:
      type: object
      additionalProperties: false
      required: [host]
      properties:
        host:
          type: string
          description: >-
            The site's base-domain hostname or one of its active custom
            domains, as typed; the server normalises it.
          minLength: 1
          maxLength: 253
    AddDomainRequest:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname:
          type: string
          description: The hostname as typed; the server normalises it.
          minLength: 1
          maxLength: 253

    PolicyVisibility:
      type: string
      description: >-
        `public`: anyone may read. `protected`: a visitor must satisfy one of
        the policy's methods.
      enum: [public, protected]
    PolicyMethod:
      type: string
      description: >-
        A way for a visitor to satisfy a protected policy. Methods are
        alternatives, not layers. `links`: share links (A2.2). `password`:
        the policy password, entered on the site's login page (A2.3).
        `email`: a 6-digit code emailed to an address the policy's
        `allowlist` lets in, entered on the site's login page (A2.4).
        `oauth`: signing in with a GitHub, Google or OIDC account the
        `allowlist` lets in, through the providers the server's operator
        configured (A2.5); enabling it on a server with no provider answers
        `400 invalid_policy`.
      enum: [links, password, email, oauth]
    PolicyPath:
      type: string
      description: >-
        `/` for the site default, or a directory prefix starting and ending
        with `/`, such as `/docs/`. A prefix also covers the directory's own
        path without its slash (`/docs`). Matched case-sensitively against
        the decoded request path; `/.wardlock/` is never subject to
        policies.
      minLength: 1
      maxLength: 1024
      examples: [/docs/]
    PolicyAllowlist:
      type: object
      additionalProperties: false
      description: >-
        Who the email-code and OAuth methods let in: one list per policy,
        shared by both. A visitor is allowed when their verified address is
        listed exactly or is at a listed domain, or (OAuth with GitHub only)
        when their GitHub account is an active member of a listed
        organisation. At most 1,000 entries in all; the server normalises
        entries (lower case, sorted, without duplicates) and answers `400
        invalid_policy` (`target: allowlist`) for an entry it cannot read.
      required: [emails, domains]
      properties:
        emails:
          type: array
          description: Exact email addresses, lower case.
          items:
            type: string
            maxLength: 254
          examples: [[ana@example.com]]
        domains:
          type: array
          description: >-
            Email domains as lower-case A-labels (international names in
            their `xn--` form): `example.com` matches addresses at that
            domain only, `*.example.com` addresses at any of its subdomains
            but not at `example.com` itself (list both for both).
          items:
            type: string
            maxLength: 255
          examples: [[example.com, '*.example.com']]
        githubOrgs:
          type: array
          description: >-
            GitHub organisation logins, lower case, checked only for visitors
            signing in with GitHub (A2.5). Always present in responses; in a
            request, omitted keeps the policy's current organisations while
            `emails` and `domains` are replaced.
          items:
            type: string
            maxLength: 39
          examples: [[example-org]]
    Policy:
      type: object
      additionalProperties: false
      required:
        [
          id,
          path,
          visibility,
          methods,
          allowlist,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        path:
          $ref: '#/components/schemas/PolicyPath'
        visibility:
          $ref: '#/components/schemas/PolicyVisibility'
        methods:
          type: array
          description: Enabled methods; empty exactly when the policy is public.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PolicyMethod'
        allowlist:
          $ref: '#/components/schemas/PolicyAllowlist'
        version:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Starts at 1 and increases with every change. Visitor sessions are
            bound to the version they were created under.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    PolicyPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    SetPolicyRequest:
      type: object
      additionalProperties: false
      required: [path, visibility]
      properties:
        path:
          $ref: '#/components/schemas/PolicyPath'
        visibility:
          $ref: '#/components/schemas/PolicyVisibility'
        methods:
          type: array
          description: >-
            Methods to enable on a protected policy; omitted means `[links]`
            (share links are on by default). Must be empty or omitted for a
            public policy.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PolicyMethod'
        password:
          type: string
          writeOnly: true
          format: password
          minLength: 8
          description: >-
            The new policy password, with the `password` method only: at
            least 8 characters and at most 1,024 bytes of UTF-8 (the server
            enforces the byte limit; JSON Schema lengths count characters). Stored only as
            an Argon2id hash and never returned. Omitted with the `password`
            method keeps the current password (`400 invalid_policy` when
            there is none). Any new password, even the same text, is a
            change: it increments `version` and ends the policy's password
            sessions.
        allowlist:
          $ref: '#/components/schemas/PolicyAllowlist'
          description: >-
            Replaces the policy's allowlist; omitted keeps the current one
            (and an omitted `githubOrgs` keeps the current organisations).
            The `email` method needs at least one address or domain in it,
            and the `oauth` method at least one entry of any kind. Must be
            empty or omitted for a public policy.

    LinkPublicId:
      type: string
      description: >-
        A share link's public ID: it names the link in listings, the access
        log and the CLI without revealing the token.
      pattern: ^[a-z2-7]{10}$
      examples: [q4v7m2xkpa]
    ShareLinkStatus:
      type: string
      description: >-
        `active`: the link works. `expired`: past `expiresAt`. `used_up`:
        `uses` has reached `maxUses`.
      enum: [active, expired, used_up]
    ShareLink:
      type: object
      additionalProperties: false
      required: [id, publicId, path, status, uses, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        publicId:
          $ref: '#/components/schemas/LinkPublicId'
        label:
          type: string
          description: Free text for the owner; never part of the URL. Absent when empty.
          maxLength: 200
        path:
          $ref: '#/components/schemas/PolicyPath'
        status:
          $ref: '#/components/schemas/ShareLinkStatus'
        uses:
          type: integer
          format: int32
          minimum: 0
          description: >-
            Uses spent: presses of the "Click to view" button on a link with
            `maxUses`. Always 0 for a link without a use limit.
        maxUses:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
          description: Absent when the link has no use limit.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          description: Absent when the link never expires.
          $ref: '#/components/schemas/Timestamp'
        lastAccessedAt:
          description: >-
            The last request the link (or a session from it) let in, to the
            minute. Absent until first used.
          $ref: '#/components/schemas/Timestamp'
        rotatedAt:
          description: Absent until the token is first rotated.
          $ref: '#/components/schemas/Timestamp'
    ShareLinkPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShareLink'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    AccessVia:
      type: string
      description: >-
        How the request got in: `public` (no protection), `link` (a share
        link's token or a session from it), `password`, `email`, `oauth`, or
        `none` when it was refused.
      enum: [public, link, password, email, oauth, none]
    AccessLogEntry:
      type: object
      additionalProperties: false
      required: [id, occurredAt, host, path, status, via]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        host:
          type: string
          description: The host the request named.
        preview:
          description: >-
            The preview the request reached (C1.19); absent for the live
            site. Analytics never counts preview requests.
          $ref: '#/components/schemas/PreviewName'
        path:
          type: string
          description: The requested path, without the query string.
        status:
          type: integer
          format: int32
          description: The HTTP status of the response.
        via:
          $ref: '#/components/schemas/AccessVia'
        linkPublicId:
          description: The share link the request came through; absent unless `via` is `link`.
          $ref: '#/components/schemas/LinkPublicId'
        linkLabel:
          type: string
          description: >-
            That share link's label, kept after the link is revoked; absent
            when the request did not come through a link or the link has no
            label.
          maxLength: 200
        ip:
          type: string
          description: >-
            The client IP, truncated as the server is configured (IPv4 /24
            and IPv6 /48 by default). Absent when not recorded.
        userAgent:
          type: string
          description: The User-Agent header; absent when the request sent none.
        country:
          description: >-
            The country the server's country database places the stored
            (truncated) IP in, or `unknown` when it has none. Absent when
            its database could not be read or no IP was stored, and from
            every entry while the operator has the lookup off, even
            entries recorded while it was on.
          $ref: '#/components/schemas/RequestCountry'
    RequestCountry:
      type: string
      description: >-
        An ISO 3166-1 alpha-2 country code in upper case, looked up from a
        request's stored IP, or `unknown` when the country database has no
        country for it (often a relay, VPN or private network). Never a
        city or region.
      pattern: ^([A-Z]{2}|unknown)$
      examples: [NZ]
    CountryCode:
      type: string
      description: An ISO 3166-1 alpha-2 country code in upper case.
      pattern: ^[A-Z]{2}$
      examples: [NZ]
    CountryLookup:
      type: object
      additionalProperties: false
      description: The operator's country lookup, present only while it is on.
      required: [attribution]
      properties:
        attribution:
          type: string
          maxLength: 300
          description: >-
            The credit the country database's licence requires, to show
            wherever countries are shown; show any https URL in it as a
            link. By default DB-IP's: `IP Geolocation by DB-IP
            (https://db-ip.com), licensed under CC BY 4.0
            (https://creativecommons.org/licenses/by/4.0/)`.
        serverCountry:
          description: The country to draw the server in; absent when the operator has not named one.
          $ref: '#/components/schemas/CountryCode'
    AnalyticsCountry:
      type: object
      additionalProperties: false
      required: [country, allowed, refused]
      properties:
        country:
          $ref: '#/components/schemas/RequestCountry'
        allowed:
          $ref: '#/components/schemas/Requests'
        refused:
          $ref: '#/components/schemas/Requests'
    AnalyticsDays:
      type: integer
      format: int32
      description: The range of an analytics report, in days.
      enum: [7, 30, 90]
      default: 7
    RequestCount:
      type: object
      additionalProperties: false
      description: Requests answered below 400 (`allowed`) and at 400 or above (`refused`).
      required: [allowed, refused]
      properties:
        allowed:
          $ref: '#/components/schemas/Requests'
        refused:
          $ref: '#/components/schemas/Requests'
    Requests:
      type: integer
      format: int64
      minimum: 0
      description: A number of requests.
    Analytics:
      type: object
      additionalProperties: false
      required:
        [
          days,
          from,
          to,
          total,
          hours,
          via,
          sites,
          groups,
          tags,
          links,
          paths,
          otherPaths,
          browsers,
        ]
      properties:
        days:
          $ref: '#/components/schemas/AnalyticsDays'
        from:
          description: The start of the first hour counted.
          $ref: '#/components/schemas/Timestamp'
        to:
          description: The end of the current hour, the first not counted.
          $ref: '#/components/schemas/Timestamp'
        total:
          $ref: '#/components/schemas/RequestCount'
        hours:
          type: array
          maxItems: 2160
          description: Each UTC hour with requests, oldest first; hours with none are left out.
          items:
            $ref: '#/components/schemas/AnalyticsHour'
        via:
          type: array
          description: Requests by way in, each way with requests, by name.
          items:
            $ref: '#/components/schemas/AnalyticsVia'
        sites:
          type: array
          description: Requests by site, each site with requests, by name.
          items:
            $ref: '#/components/schemas/AnalyticsSite'
        groups:
          type: array
          description: >-
            Requests by the group each site is in now, each group with
            requests; the entry without `groupId` is the ungrouped sites.
          items:
            $ref: '#/components/schemas/AnalyticsGroup'
        tags:
          type: array
          description: >-
            Requests by each tag the sites have now, each tag with requests.
            A site with several tags counts under each, so these can add up
            to more than the total.
          items:
            $ref: '#/components/schemas/AnalyticsTag'
        links:
          type: array
          maxItems: 10
          description: The 10 share links with the most requests, busiest first.
          items:
            $ref: '#/components/schemas/AnalyticsLink'
        paths:
          type: array
          maxItems: 10
          description: >-
            The 10 paths with the most requests, busiest first. The rollup
            keeps a site's first 50 distinct paths in each hour, up to 256
            bytes each; requests for any other path count in `otherPaths`.
          items:
            $ref: '#/components/schemas/AnalyticsPath'
        otherPaths:
          description: Requests for the paths the rollup did not keep.
          $ref: '#/components/schemas/RequestCount'
        browsers:
          type: array
          description: Requests by browser family, each family with requests, by name.
          items:
            $ref: '#/components/schemas/AnalyticsBrowser'
        countries:
          type: array
          description: >-
            Requests by country, each country with requests, busiest first,
            `unknown` among them. Every such country is listed, not a top
            few. Present only while the country lookup is
            on (with `countryLookup`). Requests logged while it was off have
            no country, so these can add up to less than the total.
          items:
            $ref: '#/components/schemas/AnalyticsCountry'
        countryLookup:
          $ref: '#/components/schemas/CountryLookup'
    AnalyticsHour:
      type: object
      additionalProperties: false
      required: [hour, allowed, refused]
      properties:
        hour:
          description: The start of the hour.
          $ref: '#/components/schemas/Timestamp'
        allowed:
          $ref: '#/components/schemas/Requests'
        refused:
          $ref: '#/components/schemas/Requests'
    AnalyticsVia:
      type: object
      additionalProperties: false
      required: [via, allowed, refused]
      properties:
        via:
          $ref: '#/components/schemas/AccessVia'
        allowed:
          $ref: '#/components/schemas/Requests'
        refused:
          $ref: '#/components/schemas/Requests'
    AnalyticsSite:
      type: object
      additionalProperties: false
      required: [site, allowed, refused]
      properties:
        site:
          $ref: '#/components/schemas/SiteName'
        allowed:
          $ref: '#/components/schemas/Requests'
        refused:
          $ref: '#/components/schemas/Requests'
    AnalyticsGroup:
      type: object
      additionalProperties: false
      required: [allowed, refused]
      properties:
        groupId:
          description: Absent for the sites in no group.
          $ref: '#/components/schemas/Id'
        allowed:
          $ref: '#/components/schemas/Requests'
        refused:
          $ref: '#/components/schemas/Requests'
    AnalyticsTag:
      type: object
      additionalProperties: false
      required: [tagId, allowed, refused]
      properties:
        tagId:
          $ref: '#/components/schemas/Id'
        allowed:
          $ref: '#/components/schemas/Requests'
        refused:
          $ref: '#/components/schemas/Requests'
    AnalyticsLink:
      type: object
      additionalProperties: false
      required: [site, publicId, allowed, refused]
      properties:
        site:
          $ref: '#/components/schemas/SiteName'
        publicId:
          $ref: '#/components/schemas/LinkPublicId'
        label:
          type: string
          description: >-
            The link's label, while the link exists (revoked or not);
            absent when it has none or has been deleted.
          maxLength: 200
        allowed:
          $ref: '#/components/schemas/Requests'
        refused:
          $ref: '#/components/schemas/Requests'
    AnalyticsPath:
      type: object
      additionalProperties: false
      required: [site, path, allowed, refused]
      properties:
        site:
          $ref: '#/components/schemas/SiteName'
        path:
          type: string
          description: The path, without the query string.
          maxLength: 256
        allowed:
          $ref: '#/components/schemas/Requests'
        refused:
          $ref: '#/components/schemas/Requests'
    AnalyticsBrowser:
      type: object
      additionalProperties: false
      required: [browser, allowed, refused]
      properties:
        browser:
          $ref: '#/components/schemas/BrowserFamily'
        allowed:
          $ref: '#/components/schemas/Requests'
        refused:
          $ref: '#/components/schemas/Requests'
    BrowserFamily:
      type: string
      description: >-
        The browser family of the request's User-Agent: `chrome`, `safari`,
        `firefox`, `edge`, `tool` (scripts and tools: command-line clients,
        HTTP libraries, crawlers and other bots, and requests with no
        User-Agent) or `other`.
      enum: [chrome, safari, firefox, edge, tool, other]
    GroupFilter:
      type: string
      description: A group's ID, or `none` for the sites in no group.
      pattern: ^(none|[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$
      examples: [none]
    SiteView:
      type: string
      description: >-
        A saved view (SPEC "Site summaries"). `pinned`: pinned sites.
        `expiring`: sites with a share link expiring within 48 hours
        (`expiringLinks` above 0). `public`: available sites whose default
        policy is public. `quiet`: available sites with no requests in the
        last 30 UTC days. `untagged`: sites with no tags. `down`: sites the
        operator has taken down.
      enum: [pinned, expiring, public, quiet, untagged, down]
    SiteSort:
      type: string
      description: The order of a list of site summaries.
      enum: [deploy, name, requests, links]
      default: deploy
    LiveDeploy:
      type: object
      additionalProperties: false
      description: The deploy a site serves.
      required: [id, shortId, activatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        shortId:
          type: string
          description: The last eight characters of `id`, as the dashboard and CLI show it.
          pattern: ^[0-9a-f]{8}$
          examples: [5a6b7c8d]
        message:
          type: string
          description: The deploy's message; absent when it has none.
          maxLength: 500
        activatedAt:
          description: When it was last activated.
          $ref: '#/components/schemas/Timestamp'
    SiteSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          hostname,
          url,
          createdAt,
          unavailable,
          tagIds,
          pinned,
          visibility,
          methods,
          workingLinks,
          expiringLinks,
          requests,
          quiet,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/SiteName'
        hostname:
          description: '`<name>.<base domain>`.'
          $ref: '#/components/schemas/Hostname'
        url:
          type: string
          format: uri
          description: The site's URL on the base domain.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        unavailable:
          type: boolean
          description: True while the operator has taken the site down, as on Site.
        groupId:
          description: The site's group; absent when ungrouped.
          $ref: '#/components/schemas/Id'
        tagIds:
          type: array
          description: The site's tags in tag-name order; empty when it has none.
          maxItems: 20
          items:
            $ref: '#/components/schemas/Id'
        pinned:
          type: boolean
        visibility:
          description: >-
            The site's default policy (path `/`); `public` for a site that
            has not stored one yet.
          $ref: '#/components/schemas/PolicyVisibility'
        methods:
          type: array
          description: The default policy's methods; empty when it is public.
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PolicyMethod'
        workingLinks:
          type: integer
          format: int32
          minimum: 0
          description: >-
            The site's share links that work now: not revoked, not expired
            and not used up.
        expiringLinks:
          type: integer
          format: int32
          minimum: 0
          description: >-
            Working links that expire within the next 48 hours, leaving out
            links whose whole lifetime (creation to expiry) is an hour or
            less, such as the Open site button's 10-minute links.
        requests:
          type: array
          description: >-
            Requests (allowed and refused) on each of the last 7 UTC days,
            oldest first; the last is today so far.
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/Requests'
        quiet:
          type: boolean
          description: >-
            True when the site had no requests in the last 30 UTC days
            (today and the 29 days before).
        liveDeploy:
          description: The deploy the site serves; absent until the first activation.
          $ref: '#/components/schemas/LiveDeploy'
    SiteSummaryPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SiteSummary'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    ExpiringLink:
      type: object
      additionalProperties: false
      description: A share link that expires soon, as listExpiringLinks finds them.
      required: [id, site, expiresAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        site:
          description: The name of the site the link opens.
          $ref: '#/components/schemas/SiteName'
        label:
          type: string
          description: The link's label; absent when it has none.
          maxLength: 200
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        usesLeft:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Uses the link has left (`maxUses` less uses spent); absent when
            the link has no use limit.
    ExpiringLinkList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ExpiringLink'
    SiteCount:
      type: integer
      format: int32
      minimum: 0
      description: A number of sites.
    SiteViewCounts:
      type: object
      additionalProperties: false
      description: The sites in each saved view.
      required: [pinned, expiring, public, quiet, untagged, down]
      properties:
        pinned:
          $ref: '#/components/schemas/SiteCount'
        expiring:
          $ref: '#/components/schemas/SiteCount'
        public:
          $ref: '#/components/schemas/SiteCount'
        quiet:
          $ref: '#/components/schemas/SiteCount'
        untagged:
          $ref: '#/components/schemas/SiteCount'
        down:
          $ref: '#/components/schemas/SiteCount'
    GroupSiteCount:
      type: object
      additionalProperties: false
      required: [groupId, sites]
      properties:
        groupId:
          $ref: '#/components/schemas/Id'
        sites:
          $ref: '#/components/schemas/SiteCount'
    TagSiteCount:
      type: object
      additionalProperties: false
      required: [tagId, sites]
      properties:
        tagId:
          $ref: '#/components/schemas/Id'
        sites:
          $ref: '#/components/schemas/SiteCount'
    SiteCounts:
      type: object
      additionalProperties: false
      required: [all, views, groups, noGroup, tags]
      properties:
        all:
          $ref: '#/components/schemas/SiteCount'
        views:
          $ref: '#/components/schemas/SiteViewCounts'
        groups:
          type: array
          description: Every group, in listGroups order.
          maxItems: 100
          items:
            $ref: '#/components/schemas/GroupSiteCount'
        noGroup:
          $ref: '#/components/schemas/SiteCount'
        tags:
          type: array
          description: Every tag, in listTags order.
          maxItems: 200
          items:
            $ref: '#/components/schemas/TagSiteCount'
    SignInProviderId:
      type: string
      description: An OAuth or OIDC provider the operator can configure.
      enum: [github, google, oidc]
    SignInProvider:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/SignInProviderId'
        name:
          type: string
          description: >-
            The name its login button shows: `GitHub`, `Google`, or for
            `oidc` the operator's `WARDLOCK_OIDC_NAME` (default
            `single sign-on`).
          minLength: 1
          maxLength: 40
          examples: [GitHub]
    SignInProviderList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/SignInProvider'
    AccessLogPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessLogEntry'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    CreateShareLinkRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          description: Free text up to 200 characters, such as "Linear ENG-123" or "sent to Alice".
          maxLength: 200
        path:
          description: >-
            Scope: `/` (the default) for the whole site, or a directory
            prefix such as `/docs/`, which also covers `/docs`.
          $ref: '#/components/schemas/PolicyPath'
        expiresAt:
          description: >-
            When the link stops working. Omit for a link that never expires
            (a first-class choice for permanent references).
          $ref: '#/components/schemas/Timestamp'
        maxUses:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
          description: Limit the uses (1 for a one-time link). Omit for unlimited.
    CreatedShareLink:
      type: object
      additionalProperties: false
      required: [shareLink, token, url]
      properties:
        shareLink:
          $ref: '#/components/schemas/ShareLink'
        token:
          type: string
          description: The secret token. Shown only in this response.
          pattern: ^wl_[a-z2-7]{10}_[A-Za-z0-9_-]{43}$
        url:
          type: string
          format: uri
          description: >-
            The share link: `https://<site host><path>?t=<token>`. Shown only
            in this response.

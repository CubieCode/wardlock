#
# The Wardlock HTTP API contract and the single source of truth for API types.
# Changing this file is a serialization gate (AGENTS.md). After editing, run
# `pnpm codegen` and commit the regenerated Go and TypeScript code;
# `pnpm check:api-spec` lints it with the rules in lint.redocly.yaml.
openapi: 3.1.0
info:
  title: Wardlock API
  version: 0.0.0
  summary: Owner API for the Wardlock server, used by the dashboard and the CLI.
  description: |
    All paths sit under `/api/v0/` on the dashboard host. Requests and
    responses are JSON (`application/json`) except blob uploads, which send
    raw bytes (`application/octet-stream`).

    ## Authentication

    - `sessionCookie`: the dashboard's owner session, a `__Host-` cookie set
      by setup, sign-in-link and email-code sign-in (C1.1) and passkey sign-in
      (C1.6). Cookie-authenticated
      requests with an unsafe method (`POST`, `PUT`, `DELETE`) must come from
      the dashboard origin (C1.1 enforces this). The server checks `Origin`;
      without it, `Sec-Fetch-Site`, which must be `same-origin`. A request with
      the session cookie is rejected with `403 forbidden` when either header
      names another origin or neither is present. Only a request with neither
      header and no session cookie is outside this check.
    - `apiToken`: `Authorization: Bearer wl_<public id>_<secret>` (C1.7). A
      token carries one or both scopes. `deploy` covers creating sites and
      deploys, uploading blobs, activation and rollback. `manage` covers
      deleting sites and managing custom domains. Read operations accept
      either scope. `manage` also covers setting and deleting access
      policies. Tokens never manage owners, sessions or other tokens.

    Each operation lists the credentials it accepts; any one of them is
    enough. Operations with no security take no credentials and are
    rate-limited.

    ## Conventions

    - **IDs** are lowercase, hyphenated UUIDv7 text generated by the server.
      Sites are addressed by name, custom domains by hostname, everything else
      by ID.
    - **Timestamps** are integers: UTC milliseconds since the Unix epoch.
    - **Absent values** are omitted from responses; the API never sends `null`.
    - **Field names** are camelCase.
    - **Pagination**: list operations take `limit` (1 to 100, default 50) and
      an opaque `cursor`, and answer `{items, nextCursor}`. `nextCursor` is
      present only when there is another page; pass it back unchanged.
    - **Owner scoping**: every resource belongs to the signed-in owner. A
      resource that does not exist and one that belongs to another owner get
      the same `404 not_found` with the same body.
    - **Secrets** (API tokens, CLI device codes) appear in exactly one
      response, at creation, and are never returned again.

    ## Errors

    Every error response is an `Error` object: a stable machine-readable
    `code`, a human-readable `message` and, where it helps, the `target` the
    error is about (a field, a manifest path or a hostname). Clients branch on
    `code`, never on `message`.

    | Status | Codes |
    | ------ | ----- |
    | 400 | `invalid_request` (malformed JSON, missing or invalid field), `invalid_code`, `invalid_site_name`, `reserved_site_name`, `invalid_path`, `invalid_manifest`, `invalid_hostname`, `hash_mismatch`, `unexpected_blob`, `invalid_policy_path`, `invalid_policy`, `invalid_passkey` |
    | 401 | `unauthenticated`: no credential, or an expired, revoked or unknown one |
    | 403 | `forbidden`: the credential lacks the scope, or a cookie request came from another origin |
    | 404 | `not_found` |
    | 409 | `site_name_taken`, `domain_taken`, `blobs_missing`, `deploy_not_pending`, `deploy_not_activated`, `no_previous_deploy`, `default_policy`, `passkey_limit` |
    | 410 | `login_expired` |
    | 413 | `limit_exceeded` |
    | 429 | `rate_limited`, `slow_down`; `Retry-After` gives the seconds to wait |
    | 500 | `internal` |
    | 501 | `not_implemented`: the operation is in the contract but not built yet |
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: The dashboard host of the Wardlock server.
tags:
  - name: system
    description: Server status.
  - name: owners
    description: Owner bootstrap, sign-in, sessions and invitations (C1.1); passkeys (C1.6).
  - name: tokens
    description: API tokens and the CLI device login (C1.7).
  - name: sites
    description: Sites (C1.2).
  - name: deploys
    description: Deploys, blob uploads, activation and rollback (C1.2).
  - name: domains
    description: Custom domains (C1.9).
  - name: policies
    description: Access policies (A2.1).
security: []
paths:
  /api/v0/health:
    get:
      operationId: getHealth
      summary: Report that the API is serving requests.
      description: >-
        Returns the server version so clients can report it. Database and
        certificate readiness are reported separately (O4.2).
      tags: [system]
      security: []
      responses:
        '200':
          description: The API is serving requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                version: 0.1.0
        default:
          $ref: '#/components/responses/Error'

  /api/v0/setup:
    post:
      operationId: completeSetup
      summary: Create the first owner from the one-time setup code.
      description: >-
        Redeems the code from the setup URL that `wardlockd serve` prints
        while no owner exists, creates the owner with the given email address
        and signs them in. The code is single use and valid for 60 minutes. A
        wrong, used or expired code, or an instance that already has an
        owner, all answer `400 invalid_code`.
      tags: [owners]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
            example:
              code: EXAMPLEsetupCodeEXAMPLE
              email: owner@example.com
      responses:
        '201':
          description: The owner exists and is signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                meSession:
                  $ref: '#/components/examples/MeSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/auth/sign-in-link:
    post:
      operationId: redeemSignInLink
      summary: Sign in with a one-time sign-in link code.
      description: >-
        Redeems the code from a one-time sign-in URL, such as the one printed
        by `wardlockd admin create` or sent with an invitation, and starts a
        dashboard session. A wrong, used or expired code answers
        `400 invalid_code`.
      tags: [owners]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInLinkRequest'
            example:
              code: EXAMPLEsignInCodeEXAMPLE
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                meSession:
                  $ref: '#/components/examples/MeSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/auth/email-code:
    post:
      operationId: sendEmailCode
      summary: Email a sign-in code.
      description: >-
        Sends a 6-digit code valid for 10 minutes if the address belongs to
        an owner. The response is the same whether or not it does. Sends are
        rate-limited per IP and per address.
      tags: [owners]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
            example:
              email: owner@example.com
      responses:
        '202':
          description: Accepted. A code is on its way if the address belongs to an owner.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/auth/email-code/verify:
    post:
      operationId: verifyEmailCode
      summary: Sign in with an emailed code.
      description: >-
        Checks the code sent to the address and starts a dashboard session.
        A code allows 5 attempts. A wrong, expired or exhausted code, and an
        address that is not an owner's, all answer `400 invalid_code`.
      tags: [owners]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeVerifyRequest'
            example:
              email: owner@example.com
              code: '482913'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                meSession:
                  $ref: '#/components/examples/MeSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/auth/passkey:
    post:
      operationId: startPasskeySignIn
      summary: Start signing in with a passkey.
      description: >-
        Returns a WebAuthn challenge for a discoverable-credential sign-in:
        it names no owner, and the browser offers whichever of this
        dashboard's passkeys it holds. Pass `options` to
        `navigator.credentials.get({publicKey})` after decoding its base64url
        fields, then send the result to `verifyPasskeySignIn` with
        `ceremonyId` within 5 minutes. Rate-limited per IP.
      tags: [owners]
      security: []
      responses:
        '200':
          description: The challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyChallenge'
              example:
                ceremonyId: 3q2-7wCqUu8pX1rM0dLh9N5bYk4sQe6tVz2aJf8gHcI
                options:
                  challenge: oN7c4Hd0sYp2qL1v9xRk3TfW6mEuB8aZgJ5iQcV0nXs
                  timeout: 300000
                  rpId: wardlock.example.com
                  userVerification: preferred
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/auth/passkey/verify:
    post:
      operationId: verifyPasskeySignIn
      summary: Finish signing in with a passkey.
      description: >-
        Checks the authenticator's assertion against the challenge and starts
        a dashboard session for the passkey's owner. Each challenge is used
        once, whatever the outcome. An unknown, used or expired challenge, an
        assertion for another origin or relying party, a bad signature, an
        unknown or removed passkey and a signature counter that did not
        increase all answer `400 invalid_passkey`.
      tags: [owners]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeySignInRequest'
            example:
              ceremonyId: 3q2-7wCqUu8pX1rM0dLh9N5bYk4sQe6tVz2aJf8gHcI
              credential:
                id: AbCdEfGhIjKlMnOp
                rawId: AbCdEfGhIjKlMnOp
                type: public-key
                response:
                  clientDataJSON: eyJ0eXBlIjoid2ViYXV0aG4uZ2V0In0
                  authenticatorData: SZYN5YgOjGh0NBcPZHZgW4_krrmihjLHmVzzuoMdl2MFAAAAAQ
                  signature: MEUCIQDexample
                  userHandle: MDE5MjhjNWU
                clientExtensionResults: {}
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                meSession:
                  $ref: '#/components/examples/MeSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/auth/sign-out:
    post:
      operationId: signOut
      summary: End the current session or revoke the current API token.
      description: >-
        With a session cookie, ends that session and clears the cookie. With
        an API token, revokes that token (`wardlock logout`).
      tags: [owners]
      security:
        - sessionCookie: []
        - apiToken: []
      responses:
        '204':
          description: Signed out.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookie'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/me:
    get:
      operationId: getMe
      summary: Describe the signed-in owner and the credential used.
      tags: [owners]
      security:
        - sessionCookie: []
        - apiToken: []
      responses:
        '200':
          description: The signed-in owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                session:
                  $ref: '#/components/examples/MeSession'
                apiToken:
                  $ref: '#/components/examples/MeApiToken'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/owners:
    post:
      operationId: inviteOwner
      summary: Invite another owner by email.
      description: >-
        Emails the address a one-time sign-in link. The response is the same
        whether or not the address already belongs to an owner, so it reveals
        nothing about other owners. Rate-limited per owner.
      tags: [owners]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteOwnerRequest'
            example:
              email: colleague@example.com
      responses:
        '202':
          description: Accepted. The invitation is on its way.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sessions:
    get:
      operationId: listSessions
      summary: List the signed-in owner's dashboard sessions.
      description: Most recently used first.
      tags: [owners]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
              example:
                items:
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e0f
                    createdAt: 1767225600000
                    lastUsedAt: 1767312000000
                    expiresAt: 1768521600000
                    userAgent: Mozilla/5.0 (X11; Linux x86_64)
                    current: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      operationId: revokeSession
      summary: Revoke one of the signed-in owner's sessions.
      description: Takes effect on the session's next request.
      tags: [owners]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/passkeys:
    get:
      operationId: listPasskeys
      summary: List the signed-in owner's passkeys.
      description: >-
        Every passkey, oldest first, in one page: an owner has at most 20.
      tags: [owners]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The owner's passkeys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyList'
              example:
                items:
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e40
                    name: Chrome on macOS
                    createdAt: 1767225600000
                    lastUsedAt: 1767312000000
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createPasskey
      summary: Finish adding a passkey.
      description: >-
        Checks the authenticator's attestation against a challenge from
        `startPasskeyRegistration` started by the same owner, and stores the
        passkey. Each challenge is used once, whatever the outcome. A bad,
        used, expired, cross-origin or already registered credential answers
        `400 invalid_passkey`.
      tags: [owners]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePasskeyRequest'
            example:
              ceremonyId: 7Kq1mZp4xR9sT2vW5yA8bC3dE6fG0hJ1kL4nP7qS9uV
              name: Chrome on macOS
              credential:
                id: AbCdEfGhIjKlMnOp
                rawId: AbCdEfGhIjKlMnOp
                type: public-key
                response:
                  clientDataJSON: eyJ0eXBlIjoid2ViYXV0aG4uY3JlYXRlIn0
                  attestationObject: o2NmbXRkbm9uZWdhdHRTdG10oGhhdXRoRGF0YQ
                  transports: [internal, hybrid]
                clientExtensionResults: {}
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
              example:
                id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e40
                name: Chrome on macOS
                createdAt: 1767225600000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/PasskeyLimit'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/passkeys/registration:
    post:
      operationId: startPasskeyRegistration
      summary: Start adding a passkey.
      description: >-
        Returns a WebAuthn challenge to create a discoverable passkey for the
        signed-in owner, with the dashboard host as the relying party and the
        owner's existing passkeys excluded. Pass `options` to
        `navigator.credentials.create({publicKey})` after decoding its
        base64url fields, then send the result to `createPasskey` with
        `ceremonyId` within 5 minutes.
      tags: [owners]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyChallenge'
              example:
                ceremonyId: 7Kq1mZp4xR9sT2vW5yA8bC3dE6fG0hJ1kL4nP7qS9uV
                options:
                  rp:
                    id: wardlock.example.com
                    name: Wardlock
                  user:
                    id: MDE5MjhjNWU
                    name: owner@example.com
                    displayName: owner@example.com
                  challenge: oN7c4Hd0sYp2qL1v9xRk3TfW6mEuB8aZgJ5iQcV0nXs
                  pubKeyCredParams:
                    - type: public-key
                      alg: -7
                  timeout: 300000
                  authenticatorSelection:
                    residentKey: required
                    requireResidentKey: true
                    userVerification: preferred
                  attestation: none
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/PasskeyLimit'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/passkeys/{passkeyId}:
    parameters:
      - $ref: '#/components/parameters/PasskeyId'
    delete:
      operationId: deletePasskey
      summary: Remove one of the signed-in owner's passkeys.
      description: >-
        The passkey stops working for sign-in at once. Sessions it started
        are not ended. The authenticator keeps its copy until the owner
        deletes it there.
      tags: [owners]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/tokens:
    get:
      operationId: listApiTokens
      summary: List the signed-in owner's API tokens.
      description: Newest first. Token secrets are never returned.
      tags: [tokens]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of API tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenPage'
              example:
                items:
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e20
                    publicId: k7m2q6xw4a
                    name: CI deploys
                    scopes: [deploy]
                    createdAt: 1767225600000
                    expiresAt: 1798761600000
                    lastUsedAt: 1767312000000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createApiToken
      summary: Create an API token.
      description: The response is the only time the token is shown.
      tags: [tokens]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiTokenRequest'
            example:
              name: CI deploys
              scopes: [deploy]
              expiresAt: 1798761600000
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiToken'
              examples:
                createdApiToken:
                  $ref: '#/components/examples/CreatedApiToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    delete:
      operationId: revokeApiToken
      summary: Revoke an API token.
      description: Takes effect on the token's next request.
      tags: [tokens]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/cli-login:
    post:
      operationId: startCliLogin
      summary: Start a CLI device login.
      description: >-
        Called by `wardlock login`. The CLI shows `userCode`, opens
        `verificationUrlComplete` in a browser and polls `pollCliLogin` with
        `deviceCode` no more often than every `interval` seconds until a
        signed-in owner approves or denies it on the dashboard, or it
        expires. `deviceCode` is a secret: keep it out of logs.
      tags: [tokens]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartCliLoginRequest'
            example:
              clientName: wardlock 0.1.0 on build-laptop
      responses:
        '201':
          description: Started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliLogin'
              example:
                deviceCode: dc_EXAMPLEonlyEXAMPLEonlyEXAMPLEonlyEXAMPLE
                userCode: BDFH-KMPR
                verificationUrl: https://wardlock.example.com/cli-login
                verificationUrlComplete: https://wardlock.example.com/cli-login?code=BDFH-KMPR
                expiresAt: 1767226500000
                interval: 5
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/cli-login/poll:
    post:
      operationId: pollCliLogin
      summary: Poll a CLI device login for its token.
      description: >-
        Answers `202` while the login waits for approval and `200` with a new
        API token once approved; the token is delivered once. A denied,
        expired, already delivered or unknown login answers
        `410 login_expired`. Polling faster than `interval` answers
        `429 slow_down`.
      tags: [tokens]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollCliLoginRequest'
            example:
              deviceCode: dc_EXAMPLEonlyEXAMPLEonlyEXAMPLEonlyEXAMPLE
      responses:
        '200':
          description: Approved. The response carries the new API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiToken'
              examples:
                createdApiToken:
                  $ref: '#/components/examples/CreatedApiToken'
        '202':
          description: Waiting for approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliLoginPending'
              example:
                status: pending
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/cli-login/approve:
    post:
      operationId: approveCliLogin
      summary: Approve a CLI device login.
      description: >-
        Called by the dashboard's `/cli-login` page once the owner confirms
        the code matches their terminal. Creates an API token with the chosen
        scopes for the waiting CLI. An unknown, expired or already decided
        code answers `400 invalid_code`.
      tags: [tokens]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveCliLoginRequest'
            example:
              userCode: BDFH-KMPR
              scopes: [deploy, manage]
              name: wardlock CLI on build-laptop
      responses:
        '204':
          description: Approved. The CLI receives its token on its next poll.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/cli-login/deny:
    post:
      operationId: denyCliLogin
      summary: Deny a CLI device login.
      description: >-
        An unknown, expired or already decided code answers
        `400 invalid_code`.
      tags: [tokens]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DenyCliLoginRequest'
            example:
              userCode: BDFH-KMPR
      responses:
        '204':
          description: Denied. The CLI's next poll answers `410 login_expired`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites:
    get:
      operationId: listSites
      summary: List the owner's sites.
      description: >-
        Ordered by name. With `hostname`, answers the owner's site served at
        that hostname (`<name>.<base domain>` or one of its custom domains,
        whatever the domain's status), or an empty page; the CLI uses it to
        resolve the DOMAIN argument.
      tags: [sites]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: hostname
          in: query
          required: false
          description: Only the site served at this hostname.
          schema:
            $ref: '#/components/schemas/Hostname'
          example: docs.example.com
      responses:
        '200':
          description: One page of sites.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitePage'
              example:
                items:
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e01
                    name: docs
                    hostname: docs.wardlock.example.net
                    url: https://docs.wardlock.example.net/
                    createdAt: 1767225600000
                    activeDeployId: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e10
                    activatedAt: 1767225660000
                nextCursor: c2l0ZTpkb2Nz
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createSite
      summary: Create an empty site.
      description: >-
        Site names are unique per instance. A name held by any site, the
        caller's or another owner's, answers `409 site_name_taken`; site
        names are public through DNS, so this reveals nothing secret. The CLI
        calls this before the first deploy to a new name.
      tags: [sites]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
            example:
              name: docs
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
              example:
                id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e01
                name: docs
                hostname: docs.wardlock.example.net
                url: https://docs.wardlock.example.net/
                createdAt: 1767225600000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}:
    parameters:
      - $ref: '#/components/parameters/SiteName'
    get:
      operationId: getSite

        nextCheckAt: 1767225780000
        failingSince: 1767225600000
        failureReason: no_record
        failureDetail: No CNAME or TXT record found for docs.example.com.
    ActiveDomain:
      summary: A verified domain.
      value:
        id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e31
        hostname: www.example.org
        status: active
        routingRecord:
          type: CNAME
          name: www.example.org
          value: docs.wardlock.example.net
        verificationRecord:
          type: TXT
          name: _wardlock.www.example.org
          value: wardlock-verify=EXAMPLEverifyTokenEXAMPLE1
        createdAt: 1767225600000
        verifiedAt: 1767225660000
        lastCheckedAt: 1767312060000
        nextCheckAt: 1767398460000
    LapsedDomain:
      summary: A domain whose record has been gone for 72 hours.
      value:
        id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e32
        hostname: old.example.org
        status: lapsed
        routingRecord:
          type: CNAME
          name: old.example.org
          value: docs.wardlock.example.net
        verificationRecord:
          type: TXT
          name: _wardlock.old.example.org
          value: wardlock-verify=EXAMPLEverifyTokenEXAMPLE2
        createdAt: 1767225600000
        verifiedAt: 1767225660000
        lastCheckedAt: 1767571260000
        nextCheckAt: 1767657660000
        failingSince: 1767312060000
        failureReason: cname_elsewhere
        failureDetail: old.example.org is a CNAME for elsewhere.example.net.

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: The server's release version, or `dev` for local builds.
          examples: ['0.1.0']

    Error:
      type: object
      description: The body of every error response.
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            Stable machine-readable error code; see the table in the API
            description. New codes may be added.
          pattern: ^[a-z][a-z_]*$
          examples: [not_found]
        message:
          type: string
          description: Human-readable explanation. Never contains secrets.
          examples: [Not found.]
        target:
          type: string
          description: The field, manifest path or hostname the error is about.
          examples: [assets/../secret.txt]

    Id:
      type: string
      description: A lowercase, hyphenated UUIDv7.
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      examples: [01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e01]
    Timestamp:
      type: integer
      format: int64
      description: UTC milliseconds since the Unix epoch.
      minimum: 0
      examples: [1767225600000]
    Cursor:
      type: string
      description: Opaque pagination cursor.
      minLength: 1
      maxLength: 512
      examples: [c2l0ZTpkb2Nz]
    Email:
      type: string
      format: email
      maxLength: 254
      examples: [owner@example.com]
    Scope:
      type: string
      description: >-
        An API token scope. `deploy` creates sites and deploys, uploads,
        activates and rolls back; `manage` deletes sites, manages custom
        domains and sets access policies. Both read.
      enum: [deploy, manage]
    Scopes:
      type: array
      minItems: 1
      maxItems: 2
      uniqueItems: true
      items:
        $ref: '#/components/schemas/Scope'
      examples: [[deploy, manage]]
    SiteName:
      type: string
      description: >-
        A DNS label: 1-63 characters of a-z, 0-9 and '-', not starting or
        ending with '-'.
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
      examples: [docs]
    Hostname:
      type: string
      description: >-
        A hostname. Stored and returned lowercase, as A-labels, with no
        trailing dot or port.
      minLength: 1
      maxLength: 253
      examples: [docs.example.com]
    Sha256:
      type: string
      description: A SHA-256 digest as 64 lowercase hex characters.
      pattern: ^[0-9a-f]{64}$
      examples:
        [2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae]

    SetupRequest:
      type: object
      additionalProperties: false
      required: [code, email]
      properties:
        code:
          type: string
          description: The `code` query parameter of the setup URL.
          minLength: 1
          maxLength: 128
        email:
          $ref: '#/components/schemas/Email'
    SignInLinkRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: The `code` query parameter of the sign-in URL.
          minLength: 1
          maxLength: 128
    EmailCodeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    EmailCodeVerifyRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        code:
          type: string
          description: The 6-digit code from the email.
          pattern: ^[0-9]{6}$
    InviteOwnerRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'

    Owner:
      type: object
      additionalProperties: false
      required: [id, email, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          $ref: '#/components/schemas/Email'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    Me:
      type: object
      additionalProperties: false
      required: [owner, credential, scopes]
      properties:
        owner:
          $ref: '#/components/schemas/Owner'
        credential:
          type: string
          description: How this request was authenticated.
          enum: [session, apiToken]
        scopes:
          description: What the credential may do. A session has every scope.
          $ref: '#/components/schemas/Scopes'

    OwnerSession:
      type: object
      additionalProperties: false
      required: [id, createdAt, lastUsedAt, expiresAt, current]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastUsedAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          description: >-
            When the session ends if not used again: the earlier of the idle
            and absolute expiry.
          $ref: '#/components/schemas/Timestamp'
        userAgent:
          type: string
          description: The User-Agent that signed in, truncated to 200 characters.
          maxLength: 200
        current:
          type: boolean
          description: Whether this is the session making the request.
    SessionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OwnerSession'
        nextCursor:
          $ref: '#/components/schemas/Cursor'

    PasskeyChallenge:
      type: object
      additionalProperties: false
      required: [ceremonyId, options]
      properties:
        ceremonyId:
          type: string
          description: Names this challenge; send it back with the authenticator's response.
          maxLength: 128
        options:
          type: object
          additionalProperties: true
          description: >-
            WebAuthn `PublicKeyCredentialCreationOptions` (registration) or
            `PublicKeyCredentialRequestOptions` (sign-in) in their JSON form,
            with binary members (`challenge`, `user.id`, credential `id`s)
            base64url-encoded without padding.
    PasskeyCredential:
      type: object
      additionalProperties: true
      description: >-
        The `PublicKeyCredential` the authenticator returned, in its JSON
        form (`PublicKeyCredential.toJSON()`), binary members
        base64url-encoded without padding.
      required: [id, rawId, type, response]
      properties:
        id:
          type: string
        rawId:
          type: string
        type:
          type: string
          enum: [public-key]
        response:
          type: object
          additionalProperties: true
    PasskeySignInRequest:
      type: object
      additionalProperties: false
      required: [ceremonyId, credential]
      properties:
        ceremonyId:
          type: string
          maxLength: 128
        credential:
          $ref: '#/components/schemas/PasskeyCredential'
    CreatePasskeyRequest:
      type: object
      additionalProperties: false
      required: [ceremonyId, credential]
      properties:
        ceremonyId:
          type: string
          maxLength: 128
        name:
          type: string
          description: >-
            A label for the passkey, such as the device or password manager
            that holds it. Trimmed; blank or absent means "Passkey". No
            control characters.
          maxLength: 100
        credential:
          $ref: '#/components/schemas/PasskeyCredential'
    Passkey:
      type: object
      additionalProperties: false
      required: [id, name, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          maxLength: 100
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastUsedAt:
          description: The last sign-in with this passkey; absent if never used.
          $ref: '#/components/schemas/Timestamp'
    PasskeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Passkey'

    ApiToken:
      type: object
      additionalProperties: false
      required: [id, publicId, name, scopes, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        publicId:
          type: string
          description: The token's public ID, shown in the dashboard and logs.
          pattern: ^[a-z2-7]{10}$
          examples: [k7m2q6xw4a]
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          $ref: '#/components/schemas/Scopes'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          description: Absent when the token never expires.
          $ref: '#/components/schemas/Timestamp'
        lastUsedAt:
          description: Absent until the token is first used.
          $ref: '#/components/schemas/Timestamp'
    ApiTokenPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    CreateApiTokenRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          $ref: '#/components/schemas/Scopes'
        expiresAt:
          description: Omit for a token that never expires.
          $ref: '#/components/schemas/Timestamp'
    CreatedApiToken:
      type: object
      additionalProperties: false
      required: [apiToken, token]
      properties:
        apiToken:
          $ref: '#/components/schemas/ApiToken'
        token:
          type: string
          description: The secret token. Shown only in this response.
          pattern: ^wl_[a-z2-7]{10}_[A-Za-z0-9_-]{43}$

    StartCliLoginRequest:
      type: object
      additionalProperties: false
      properties:
        clientName:
          type: string
          description: >-
            How the CLI describes itself, such as `wardlock 0.1.0 on
            build-laptop`. It becomes the default name of the API token the
            login creates, unless the approving owner names the token. It is
            not shown on the approval page.
          maxLength: 100
    CliLogin:
      type: object
      additionalProperties: false
      required:
        [
          deviceCode,
          userCode,
          verificationUrl,
          verificationUrlComplete,
          expiresAt,
          interval,
        ]
      properties:
        deviceCode:
          type: string
          description: Secret the CLI polls with. Never log it.
          minLength: 32
          maxLength: 128
        userCode:
          $ref: '#/components/schemas/UserCode'
        verificationUrl:
          type: string
          format: uri
          description: The dashboard page where the owner approves the login.
        verificationUrlComplete:
          type: string
          format: uri
          description: '`verificationUrl` with the user code filled in.'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        interval:
          type: integer
          format: int32
          description: Minimum seconds between polls.
          minimum: 1
    UserCode:
      type: string
      description: >-
        Eight letters from an alphabet without vowels or look-alikes, in two
        groups of four.
      pattern: ^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$
      examples: [BDFH-KMPR]
    PollCliLoginRequest:
      type: object
      additionalProperties: false
      required: [deviceCode]
      properties:
        deviceCode:
          type: string
          minLength: 1
          maxLength: 128
    CliLoginPending:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [pending]
    ApproveCliLoginRequest:
      type: object
      additionalProperties: false
      required: [userCode, scopes]
      properties:
        userCode:
          $ref: '#/components/schemas/UserCode'
        scopes:
          $ref: '#/components/schemas/Scopes'
        name:
          type: string
          description: >-
            The new token's name; defaults to the CLI's `clientName`, or
            `wardlock CLI` when it sent none.
          minLength: 1
          maxLength: 100
    DenyCliLoginRequest:
      type: object
      additionalProperties: false
      required: [userCode]
      properties:
        userCode:
          $ref: '#/components/schemas/UserCode'

    Site:
      type: object
      additionalProperties: false
      required: [id, name, hostname, url, createdAt, unavailable]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/SiteName'
        unavailable:
          type: boolean
          description: >-
            True while the instance's operator has taken the site down:
            visitors see an unavailable page on every hostname, and deploys,
            activations, rollbacks and deletion answer
            `409 site_unavailable`. Only the operator can restore it.
        hostname:
          description: '`<name>.<base domain>`.'
          $ref: '#/components/schemas/Hostname'
        url:
          type: string
          format: uri
          description: The site's URL on the base domain.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        activeDeployId:
          description: Absent until the first activation.
          $ref: '#/components/schemas/Id'
        activatedAt:
          description: When the active deploy was last activated.
          $ref: '#/components/schemas/Timestamp'
    SitePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Site'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    CreateSiteRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/SiteName'

    Deploy:
      type: object
      additionalProperties: false
      required:
        [id, status, createdAt, fileCount, totalSize, spa, immutableAssets]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          description: >-
            `pending` until first activated; `active` while it is the site's
            active deploy; `inactive` once replaced or rolled back from.
          enum: [pending, active, inactive]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        activatedAt:
          description: When it was last activated. Absent while pending.
          $ref: '#/components/schemas/Timestamp'
        fileCount:
          type: integer
          format: int32
          minimum: 0
        totalSize:
          type: integer
          format: int64
          description: Sum of file sizes in bytes.
          minimum: 0
        message:
          type: string
          maxLength: 500
        spa:
          type: boolean
          description: >-
            Whether missing paths without a file extension serve
            `/index.html` while this deploy is active.
        immutableAssets:
          type: boolean
          description: >-
            Whether files under `/assets/` with a content hash in their name
            are served with `Cache-Control: public, max-age=31536000,
            immutable` (`private` on protected sites) while this deploy is
            active. See SPEC "Serving" for the hash rule.
    DeployPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Deploy'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    ManifestFile:
      type: object
      additionalProperties: false
      required: [path, sha256, size]
      properties:
        path:
          type: string
          description: Path relative to the deployed directory, with forward slashes.
          minLength: 1
          maxLength: 1024
          examples: [docs/install.html]
        sha256:
          $ref: '#/components/schemas/Sha256'
        size:
          type: integer
          format: int64
          description: File size in bytes.
          minimum: 0
    CreateDeployRequest:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ManifestFile'
        message:
          type: string
          maxLength: 500
        spa:
          type: boolean
          default: false
          description: Serve `/index.html` for missing extensionless paths.
        immutableAssets:
          type: boolean
          default: false
          description: >-
            Cache files under `/assets/` with a content hash in their name
            for a year as immutable (SPEC "Serving"). Only set it when every
            such name changes whenever its content does.
    CreatedDeploy:
      type: object
      additionalProperties: false
      required: [deploy, missing]
      properties:
        deploy:
          $ref: '#/components/schemas/Deploy'
        missing:
          type: array
          description: Hashes to upload before activating, each once.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Sha256'
    RollbackRequest:
      type: object
      additionalProperties: false
      properties:
        deployId:
          description: Omit to return to the deploy active before the current one.
          $ref: '#/components/schemas/Id'
    Activation:
      type: object
      additionalProperties: false
      required: [site, deploy]
      properties:
        site:
          $ref: '#/components/schemas/Site'
        deploy:
          $ref: '#/components/schemas/Deploy'

    DnsRecord:
      type: object
      additionalProperties: false
      required: [type, name, value]
      properties:
        type:
          type: string
          enum: [CNAME, TXT]
        name:
          $ref: '#/components/schemas/Hostname'
        value:
          type: string
          examples: [docs.wardlock.example.net]
    Domain:
      type: object
      additionalProperties: false
      required:
        [id, hostname, status, routingRecord, verificationRecord, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        hostname:
          $ref: '#/components/schemas/Hostname'
        status:
          type: string
          description: >-
            `pending`: added, not yet verified, not served. `active`: verified,
            served and eligible for a certificate. `lapsed`: was active but has
            failed re-checks for 72 hours; not served until it passes again.
          enum: [pending, active, lapsed]
        routingRecord:
          description: '`CNAME <hostname> → <name>.<base domain>`.'
          $ref: '#/components/schemas/DnsRecord'
        verificationRecord:
          description: >-
            `TXT _wardlock.<hostname> → wardlock-verify=<token>`, needed only
            where the CNAME cannot be seen (apex or CDN-proxied records).
          $ref: '#/components/schemas/DnsRecord'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        verifiedAt:
          description: When the domain last became active.
          $ref: '#/components/schemas/Timestamp'
        lastCheckedAt:
          description: When DNS was last checked.
          $ref: '#/components/schemas/Timestamp'
        nextCheckAt:
          description: >-
            When the next automatic check is due. Absent for a pending domain
            past its 48-hour window, which is checked only on request.
          $ref: '#/components/schemas/Timestamp'
        failingSince:
          description: Start of the current run of failed checks. Absent after a pass.
          $ref: '#/components/schemas/Timestamp'
        failureReason:
          type: string
          description: >-
            Why the last check failed. Absent after a pass. `no_record`: no
            matching CNAME or TXT; `cname_elsewhere`: the CNAME chain leads
            somewhere else; `txt_mismatch`: the TXT record holds another
            token; `dns_error`: the lookup failed or timed out.
          enum: [no_record, cname_elsewhere, txt_mismatch, dns_error]
        failureDetail:
          type: string
          description: Plain-language detail for the last failure.
    DomainPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    AddDomainRequest:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname:
          type: string
          description: The hostname as typed; the server normalises it.
          minLength: 1
          maxLength: 253

    PolicyVisibility:
      type: string
      description: >-
        `public`: anyone may read. `protected`: a visitor must satisfy one of
        the policy's methods.
      enum: [public, protected]
    PolicyMethod:
      type: string
      description: >-
        A way for a visitor to satisfy a protected policy. Methods are
        alternatives, not layers. `links`: share links (A2.2). `password`:
        the policy password, entered on the site's login page (A2.3).
        `email`: a 6-digit code emailed to an address the policy's
        `allowlist` lets in, entered on the site's login page (A2.4).
        `oauth`: signing in with a GitHub, Google or OIDC account the
        `allowlist` lets in, through the providers the server's operator
        configured (A2.5); enabling it on a server with no provider answers
        `400 invalid_policy`.
      enum: [links, password, email, oauth]
    PolicyPath:
      type: string
      description: >-
        `/` for the site default, or a directory prefix starting and ending
        with `/`, such as `/docs/`. A prefix also covers the directory's own
        path without its slash (`/docs`). Matched case-sensitively against
        the decoded request path; `/.wardlock/` is never subject to
        policies.
      minLength: 1
      maxLength: 1024
      examples: [/docs/]
    PolicyAllowlist:
      type: object
      additionalProperties: false
      description: >-
        Who the email-code and OAuth methods let in: one list per policy,
        shared by both. A visitor is allowed when their verified address is
        listed exactly or is at a listed domain, or (OAuth with GitHub only)
        when their GitHub account is an active member of a listed
        organisation. At most 1,000 entries in all; the server normalises
        entries (lower case, sorted, without duplicates) and answers `400
        invalid_policy` (`target: allowlist`) for an entry it cannot read.
      required: [emails, domains]
      properties:
        emails:
          type: array
          description: Exact email addresses, lower case.
          items:
            type: string
            maxLength: 254
          examples: [[ana@example.com]]
        domains:
          type: array
          description: >-
            Email domains as lower-case A-labels (international names in
            their `xn--` form): `example.com` matches addresses at that
            domain only, `*.example.com` addresses at any of its subdomains
            but not at `example.com` itself (list both for both).
          items:
            type: string
            maxLength: 255
          examples: [[example.com, '*.example.com']]
        githubOrgs:
          type: array
          description: >-
            GitHub organisation logins, lower case, checked only for visitors
            signing in with GitHub (A2.5). Always present in responses; in a
            request, omitted keeps the policy's current organisations while
            `emails` and `domains` are replaced.
          items:
            type: string
            maxLength: 39
          examples: [[example-org]]
    Policy:
      type: object
      additionalProperties: false
      required:
        [
          id,
          path,
          visibility,
          methods,
          allowlist,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        path:
          $ref: '#/components/schemas/PolicyPath'
        visibility:
          $ref: '#/components/schemas/PolicyVisibility'
        methods:
          type: array
          description: Enabled methods; empty exactly when the policy is public.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PolicyMethod'
        allowlist:
          $ref: '#/components/schemas/PolicyAllowlist'
        version:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Starts at 1 and increases with every change. Visitor sessions are
            bound to the version they were created under.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    PolicyPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    SetPolicyRequest:
      type: object
      additionalProperties: false
      required: [path, visibility]
      properties:
        path:
          $ref: '#/components/schemas/PolicyPath'
        visibility:
          $ref: '#/components/schemas/PolicyVisibility'
        methods:
          type: array
          description: >-
            Methods to enable on a protected policy; omitted means `[links]`
            (share links are on by default). Must be empty or omitted for a
            public policy.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PolicyMethod'
        password:
          type: string
          writeOnly: true
          format: password
          minLength: 8
          description: >-
            The new policy password, with the `password` method only: at
            least 8 characters and at most 1,024 bytes of UTF-8 (the server
            enforces the byte limit; JSON Schema lengths count characters). Stored only as
            an Argon2id hash and never returned. Omitted with the `password`
            method keeps the current password (`400 invalid_policy` when
            there is none). Any new password, even the same text, is a
            change: it increments `version` and ends the policy's password
            sessions.
        allowlist:
          $ref: '#/components/schemas/PolicyAllowlist'
          description: >-
            Replaces the policy's allowlist; omitted keeps the current one
            (and an omitted `githubOrgs` keeps the current organisations).
            The `email` method needs at least one address or domain in it,
            and the `oauth` method at least one entry of any kind. Must be
            empty or omitted for a public policy.

    LinkPublicId:
      type: string
      description: >-
        A share link's public ID: it names the link in listings, the access
        log and the CLI without revealing the token.
      pattern: ^[a-z2-7]{10}$
      examples: [q4v7m2xkpa]
    ShareLinkStatus:
      type: string
      description: >-
        `active`: the link works. `expired`: past `expiresAt`. `used_up`:
        `uses` has reached `maxUses`.
      enum: [active, expired, used_up]
    ShareLink:
      type: object
      additionalProperties: false
      required: [id, publicId, path, status, uses, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        publicId:
          $ref: '#/components/schemas/LinkPublicId'
        label:
          type: string
          description: Free text for the owner; never part of the URL. Absent when empty.
          maxLength: 200
        path:
          $ref: '#/components/schemas/PolicyPath'
        status:
          $ref: '#/components/schemas/ShareLinkStatus'
        uses:
          type: integer
          format: int32
          minimum: 0
          description: >-
            Uses spent: presses of the "Click to view" button on a link with
            `maxUses`. Always 0 for a link without a use limit.
        maxUses:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
          description: Absent when the link has no use limit.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          description: Absent when the link never expires.
          $ref: '#/components/schemas/Timestamp'
        lastAccessedAt:
          description: >-
            The last request the link (or a session from it) let in, to the
            minute. Absent until first used.
          $ref: '#/components/schemas/Timestamp'
        rotatedAt:
          description: Absent until the token is first rotated.
          $ref: '#/components/schemas/Timestamp'
    ShareLinkPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShareLink'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    AccessVia:
      type: string
      description: >-
        How the request got in: `public` (no protection), `link` (a share
        link's token or a session from it), `password`, `email`, `oauth`, or
        `none` when it was refused.
      enum: [public, link, password, email, oauth, none]
    AccessLogEntry:
      type: object
      additionalProperties: false
      required: [id, occurredAt, host, path, status, via]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        host:
          type: string
          description: The host the request named.
        path:
          type: string
          description: The requested path, without the query string.
        status:
          type: integer
          format: int32
          description: The HTTP status of the response.
        via:
          $ref: '#/components/schemas/AccessVia'
        linkPublicId:
          description: The share link the request came through; absent unless `via` is `link`.
          $ref: '#/components/schemas/LinkPublicId'
        linkLabel:
          type: string
          description: >-
            That share link's label, kept after the link is revoked; absent
            when the request did not come through a link or the link has no
            label.
          maxLength: 200
        ip:
          type: string
          description: >-
            The client IP, truncated as the server is configured (IPv4 /24
            and IPv6 /48 by default). Absent when not recorded.
        userAgent:
          type: string
          description: The User-Agent header; absent when the request sent none.
    AccessLogPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessLogEntry'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    CreateShareLinkRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          description: Free text up to 200 characters, such as "Linear ENG-123" or "sent to Alice".
          maxLength: 200
        path:
          description: >-
            Scope: `/` (the default) for the whole site, or a directory
            prefix such as `/docs/`, which also covers `/docs`.
          $ref: '#/components/schemas/PolicyPath'
        expiresAt:
          description: >-
            When the link stops working. Omit for a link that never expires
            (a first-class choice for permanent references).
          $ref: '#/components/schemas/Timestamp'
        maxUses:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
          description: Limit the uses (1 for a one-time link). Omit for unlimited.
    CreatedShareLink:
      type: object
      additionalProperties: false
      required: [shareLink, token, url]
      properties:
        shareLink:
          $ref: '#/components/schemas/ShareLink'
        token:
          type: string
          description: The secret token. Shown only in this response.
          pattern: ^wl_[a-z2-7]{10}_[A-Za-z0-9_-]{43}$
        url:
          type: string
          format: uri
          description: >-
            The share link: `https://<site host><path>?t=<token>`. Shown only
            in this response.

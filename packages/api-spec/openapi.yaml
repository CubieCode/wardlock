                pending:
                  $ref: '#/components/examples/PendingDomain'
                lapsed:
                  $ref: '#/components/examples/LapsedDomain'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

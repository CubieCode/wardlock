                    allowlist:
                      emails: []
                      domains: []
                      githubOrgs: []
                    version: 1
                    createdAt: 1767225600000
                    updatedAt: 1767225600000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setPolicy
      summary: Set the default or a path policy.
      description: >-
        Creates the policy for `path` or replaces its settings. The policy
        for a request is the one with the longest path matching it, falling
        back to the default (`/`); policies do not stack. A change takes
        effect on the next request and increments `version`, which ends
        every visitor session created under the old version. Setting the
        same settings again changes nothing. A path that is not `/` or a
        clean directory prefix such as `/docs/` answers
        `400 invalid_policy_path`; methods on a public policy, or none on a
        protected one, answer `400 invalid_policy`, as does the `password`
        method without a password to set or keep (`target: password`), and
        the `email` method without an allowed address or domain to set or
        keep (`target: allowlist`). The password is write-only: no response
        includes it or its hash. The `allowlist` is shared by the email-code
        and OAuth methods; omitting it keeps the current one, any change to
        it increments `version` (ending the sessions it let in), and a
        public policy has none (setting a policy public clears it).
      tags: [policies]
      security:
        - sessionCookie: []
        - apiToken: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPolicyRequest'
            example:
              path: /docs/
              visibility: protected
              methods: [links]
      responses:
        '200':
          description: The stored policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
              examples:
                policy:
                  $ref: '#/components/examples/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sites/{site}/policies/{policyId}:
    parameters:
      - $ref: '#/components/parameters/SiteName'
      - $ref: '#/components/parameters/PolicyId'
    delete:
      operationId: deletePolicy
      summary: Delete a path policy.
      description: >-
        Its paths fall back to the next longest matching policy on the next
        request, and visitor sessions created under it end. The site
        default cannot be deleted (`409 default_policy`); set it instead.
        A site the operator has taken down answers `409 site_unavailable`,
        since deleting a policy deletes the records of the sessions it
        issued.
      tags: [policies]
      security:
        - sessionCookie: []
        - apiToken: [manage]
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':

        - apiToken: [manage]
      responses:
        '200':
          description: The site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
              examples:
                site:
                  $ref: '#/components/examples/Site'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSite
      summary: Tear down a site.
      description: >-
        Deletes the site with its deploys, links, policies and custom domains
        and frees the name. Serving stops immediately. Unreferenced blobs are

          spa: false
          immutableAssets: false
    Policy:
      summary: A protected path policy.
      value:
        id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e42
        path: /docs/
        visibility: protected
        methods: [links]
        allowlist:
          emails: []
          domains: []
          githubOrgs: []
        version: 1
        createdAt: 1767225600000
        updatedAt: 1767225600000
    CreatedShareLink:
      summary: A new share link with its token.
      value:
        shareLink:
          id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e50
          publicId: q4v7m2xkpa
          label: Linear ENG-123
          path: /docs/
          status: active
          uses: 0
          createdAt: 1767225600000
          expiresAt: 1767830400000
        token: wl_q4v7m2xkpa_EXAMPLEonlyEXAMPLEonlyEXAMPLEonlyEXAMPLEonl
        url: https://docs.wardlock.example.net/docs/?t=wl_q4v7m2xkpa_EXAMPLEonlyEXAMPLEonlyEXAMPLEonlyEXAMPLEonl
    PendingDomain:
      summary: A domain waiting for its DNS record.
      value:

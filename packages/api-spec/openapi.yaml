                    createdAt: 1767225600000
                    verifiedAt: 1767225660000
                    lastCheckedAt: 1767312060000
                    nextCheckAt: 1767398460000
                    primary: true
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e30
                    hostname: docs.example.com
                    status: pending

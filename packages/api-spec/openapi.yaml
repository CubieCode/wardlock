  /api/v0/analytics:
    get:
      operationId: getAnalytics
      summary: Count requests over the last 7, 30 or 90 days.
      description: >-
        Requests for the owner's sites over the last `days` days, from the
        hourly traffic rollup: per UTC hour, so a client can draw days in
        the viewer's timezone, and in total by way in, site, group, tag,
        browser family, the busiest share links and the busiest paths, and,
        when the operator has turned on the country lookup, by country with
        the credit the country database's licence requires. Every count
        is of requests, split into `allowed` (answered with a status below
        400) and `refused` (400 and above); none is a count of visitors. The range is the `days` × 24 whole UTC hours ending
        with the current one. Give at most one of `site`, `group` and
        `tag` to narrow it; groups and tags are read as they are now, so
        a site's history moves with it. Giving more than one answers
        `400 invalid_request`; a missing site, group or tag and another
        owner's answer the same `404`.
      tags: [analytics]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      parameters:
        - name: days
          in: query
          required: false
          description: How many days back to count, ending with the current hour.
          schema:
            $ref: '#/components/schemas/AnalyticsDays'
          example: 30
        - name: site
          in: query
          required: false
          description: Only this site, by name.
          schema:
            $ref: '#/components/schemas/SiteName'
          example: docs
        - name: group
          in: query
          required: false
          description: Only the sites now in this group, by ID.
          schema:
            $ref: '#/components/schemas/Id'
          example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e70
        - name: tag
          in: query
          required: false
          description: Only the sites that now have this tag, by ID.
          schema:
            $ref: '#/components/schemas/Id'
          example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e80
      responses:
        '200':
          description: The requests in the range and scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytics'
              example:
                days: 7
                from: 1767225600000
                to: 1767830400000
                total: { allowed: 42, refused: 3 }
                hours:
                  - { hour: 1767229200000, allowed: 40, refused: 3 }
                  - { hour: 1767232800000, allowed: 2, refused: 0 }
                via:
                  - { via: link, allowed: 30, refused: 0 }
                  - { via: none, allowed: 0, refused: 3 }
                  - { via: public, allowed: 12, refused: 0 }
                sites:
                  - { site: docs, allowed: 42, refused: 3 }
                groups:
                  - {
                      groupId: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e70,
                      allowed: 42,
                      refused: 3,
                    }
                tags:
                  - {
                      tagId: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e80,
                      allowed: 42,
                      refused: 3,
                    }
                links:
                  - {
                      site: docs,
                      publicId: q4v7m2xkpa,
                      label: Client review,
                      allowed: 30,
                      refused: 0,
                    }
                paths:
                  - { site: docs, path: /, allowed: 25, refused: 1 }
                  - { site: docs, path: /docs/, allowed: 17, refused: 0 }
                otherPaths: { allowed: 0, refused: 2 }
                browsers:
                  - { browser: chrome, allowed: 28, refused: 0 }
                  - { browser: tool, allowed: 14, refused: 3 }
                countries:
                  - { country: NZ, allowed: 30, refused: 1 }
                  - { country: AU, allowed: 12, refused: 0 }
                  - { country: unknown, allowed: 0, refused: 2 }
                countryLookup:
                  attribution: >-
                    IP Geolocation by DB-IP (https://db-ip.com), licensed
                    under CC BY 4.0
                    (https://creativecommons.org/licenses/by/4.0/)
                  serverCountry: NZ
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/site-summaries:
    get:
      operationId: listSiteSummaries
      summary: List the owner's sites with what lists and maps show of each.
      description: >-
        One read for the dashboard's sites list, navigator, jump-to, map and
        overview: each site with its default policy, group, tags, pin,
        working and soon-expiring share links, requests on each of the last
        7 UTC days, whether it had no requests in the last 30 UTC days, and
        its live deploy. `group`, `tag`, `view` and `q` narrow the list and
        combine (a site must match all of them); SPEC "Site summaries"
        defines each saved view and search token. A missing group or tag
        and another owner's answer the same `404`. Every page costs the
        same few database queries, whatever its size. `nextCursor` belongs
        to the `sort` it was issued for; a cursor from another sort answers
        `400 invalid_request`.
      tags: [sites]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: group
          in: query
          required: false
          description: Only the sites in this group, by ID, or `none` for the ungrouped sites.
          schema:
            $ref: '#/components/schemas/GroupFilter'
          example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e70
        - name: tag
          in: query
          required: false
          description: Only the sites with this tag, by ID.
          schema:
            $ref: '#/components/schemas/Id'
          example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e80
        - name: view
          in: query
          required: false
          description: Only the sites in this saved view.
          schema:
            $ref: '#/components/schemas/SiteView'
          example: expiring
        - name: q
          in: query
          required: false
          description: >-
            Search: words separated by spaces, each of which a site must
            match. `tag:NAME`, `group:NAME` and `is:public`, `is:protected`,
            `is:down` or `is:pinned` are tokens; any other word is free text
            over the site's name, hostnames, tag names and group name,
            ignoring case.
          schema:
            type: string
            maxLength: 200
          example: is:protected tag:client docs
        - name: sort
          in: query
          required: false
          description: >-
            `deploy`: the live deploy's activation, newest first, sites with
            nothing live last. `name`: by name. `requests`: requests over the
            last 7 UTC days, most first. `links`: working share links, most
            first. Ties are broken by name.
          schema:
            $ref: '#/components/schemas/SiteSort'
          example: deploy
      responses:
        '200':
          description: One page of site summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSummaryPage'
              example:
                items:
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e01
                    name: docs
                    hostname: docs.wardlock.example.net
                    url: https://docs.wardlock.example.net/
                    createdAt: 1767225600000
                    unavailable: false
                    groupId: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e70
                    tagIds: [01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e80]
                    pinned: true
                    visibility: protected
                    methods: [links, password]
                    workingLinks: 3
                    expiringLinks: 1
                    requests: [12, 0, 4, 31, 8, 0, 2]
                    quiet: false
                    liveDeploy:
                      id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e10
                      shortId: 5a6b7c8d
                      message: Fix typo on the install page
                      activatedAt: 1767225660000
                nextCursor: ZGVwbG95OjE3NjcyMjU2NjAwMDA6ZG9jcw
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/site-counts:
    get:
      operationId: getSiteCounts
      summary: Count the owner's sites in each view, group and tag.
      description: >-
        How many sites listSiteSummaries would answer for all sites, each
        saved view, each group, no group and each tag, as the navigator
        shows them. Every group and tag is listed, with `0` when it has no
        sites, in the order listGroups and listTags answer them.
      tags: [sites]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteCounts'
              example:
                all: 12
                views:
                  pinned: 2
                  expiring: 1
                  public: 5
                  quiet: 3
                  untagged: 4
                  down: 0
                groups:
                  - { groupId: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e70, sites: 7 }
                noGroup: 5
                tags:
                  - { tagId: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e80, sites: 6 }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/expiring-links:
    get:
      operationId: listExpiringLinks
      summary: List the owner's share links that expire soon.
      description: >-
        The links that listSiteSummaries counts in each site's
        `expiringLinks`, across all the owner's sites, soonest expiry
        first (ties by ID): working links (not revoked, not expired and
        not used up) that expire within the next 48 hours, leaving out
        links whose whole lifetime is an hour or less. Answers the first
        `limit`; the sum of `expiringLinks` says how many there are in
        all. Tokens and link URLs are never returned. Not paged.
      tags: [links]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The soonest-expiring links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpiringLinkList'
              example:
                items:
                  - id: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e50
                    site: docs
                    label: Linear ENG-123
                    expiresAt: 1767312000000
                    usesLeft: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'

  /api/v0/sign-in-providers:
    get:
      operationId: listSignInProviders
      summary: List the OAuth and OIDC providers the operator configured.
      description: >-
        The providers a policy's `oauth` method signs visitors in with
        (A2.5), as the operator configured them: `github`, `google` and
        `oidc`, in that order, each only when configured, with the name its
        login button shows. Empty when none is, and then enabling `oauth`
        answers `400 invalid_policy`. Never includes client IDs, secrets or
        the issuer URL.
      tags: [policies]
      security:
        - sessionCookie: []
        - apiToken: [deploy]
        - apiToken: [manage]
      responses:
        '200':
          description: The configured providers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInProviderList'
              example:
                items:
                  - { id: github, name: GitHub }
                  - { id: oidc, name: Harbour SSO }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-wardlock_session
      description: >-
        Dashboard owner session (C1.1): host-only, `Secure`, `HttpOnly`,
        `SameSite=Lax`, idle timeout 14 days, absolute 90 days.
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: wl_<public id>_<secret>
      description: >-
        API token (C1.7). Required scopes are listed per operation: `deploy`
        or `manage`.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
      example: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `nextCursor` of the previous page.
      schema:
        $ref: '#/components/schemas/Cursor'
      example: c2l0ZTpkb2Nz
    SiteName:
      name: site
      in: path
      required: true
      description: The site's name.
      schema:
        $ref: '#/components/schemas/SiteName'
      example: docs
    PreviewName:
      name: preview
      in: path
      required: true
      description: The preview's name.
      schema:
        $ref: '#/components/schemas/PreviewName'
      example: pr-42
    DeployId:
      name: deployId
      in: path
      required: true
      description: The deploy's ID.
      schema:
        $ref: '#/components/schemas/Id'
      example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e10
    SessionId:
      name: sessionId
      in: path
      required: true
      description: The session's ID.
      schema:
        $ref: '#/components/schemas/Id'
      example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e0f
    PasskeyId:
      name: passkeyId
      in: path
      required: true
      description: The passkey's ID (not its WebAuthn credential ID).
      schema:
        $ref: '#/components/schemas/Id'
      example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e40
    TokenId:
      name: tokenId
      in: path
      required: true
      description: The API token's ID (not its public ID).
      schema:
        $ref: '#/components/schemas/Id'
      example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e20
    PolicyId:
      name: policyId
      in: path
      required: true
      description: The policy's ID.
      schema:
        $ref: '#/components/schemas/Id'
      example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e41
    LinkId:
      name: linkId
      in: path
      required: true
      description: The share link's public ID.
      schema:
        $ref: '#/components/schemas/LinkPublicId'
      example: q4v7m2xkpa
    DomainHostname:
      name: hostname
      in: path
      required: true
      description: The custom domain, in its normalised form.
      schema:
        $ref: '#/components/schemas/Hostname'
      example: docs.example.com
    GroupId:
      name: groupId
      in: path
      required: true
      description: The group's ID.
      schema:
        $ref: '#/components/schemas/Id'
      example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e70
    TagId:
      name: tagId
      in: path
      required: true
      description: The tag's ID.
      schema:
        $ref: '#/components/schemas/Id'
      example: 01928c5e-7a1b-7c3d-9e4f-5a6b7c8d9e80

  headers:
    SetSessionCookie:
      description: >-
        The dashboard session cookie, `__Host-wardlock_session`, `Path=/`,
        `Secure`, `HttpOnly`, `SameSite=Lax`.
      schema:
        type: string
      example: __Host-wardlock_session=<opaque>; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=1209600
    ClearSessionCookie:
      description: Clears the dashboard session cookie when the request used one.
      schema:
        type: string
      example: __Host-wardlock_session=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0
    Attachment:
      description: Always `attachment`, so a browser saves the file rather than showing it.
      schema:
        type: string
      example: attachment
    BlobETag:
      description: The file's SHA-256 in quotes.
      schema:
        type: string
      example: '"fcde2b2edba56bf408601fb721fe9b5c338d10ee429ea04fae5511b68fbf8fb9"'
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 30

  responses:
    BadRequest:
      description: The request is malformed or a field is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid_request
            message: name must be 1-63 characters of a-z, 0-9 and '-'.
            target: name
    Unauthenticated:
      description: No valid credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthenticated
            message: Sign in or provide an API token.
    Forbidden:
      description: >-
        The credential lacks the scope this operation needs, or a
        cookie-authenticated request came from another origin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: forbidden
            message: This API token lacks the manage scope.
    NotFound:
      description: >-
        No such resource for this owner. Missing resources and other owners'
        resources get the same response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: Not found.
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: site_name_taken
            message: The site name docs is taken.
            target: name
    PasskeyLimit:
      description: The owner already has the most passkeys allowed (20).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: passkey_limit
            message: You have 20 passkeys, the most allowed. Remove one first.
    Gone:
      description: The CLI login is over; start a new one.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: login_expired
            message: This login has expired or was denied. Run wardlock login again.
    TooLarge:
      description: >-
        A size or count limit, or one of the owner's quotas, was exceeded.
        The message names the file or quota and the limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: limit_exceeded
            message: assets/intro.mp4 is a video file of 15 MiB; the limit for video files is 10 MiB.
            target: assets/intro.mp4
    FileTypeBlocked:
      description: The manifest lists a file whose extension the operator has blocked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: file_type_blocked
            message: downloads/setup.exe is a .exe file, a type this server does not accept.
            target: downloads/setup.exe
    FileWithheld:
      description: Content screening has withheld this file on every site (A2.15).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: file_withheld
            message: The operator of this server has withheld this file, so it cannot be downloaded.
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rate_limited
            message: Too many attempts. Try again in 30 seconds.
    CheckedRecently:
      description: >-
        The domain was checked moments ago (`checked_recently`); try again
        after `Retry-After`. A refused API token answers `rate_limited`
        instead, which waiting out the cooldown does not fix.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: checked_recently
            message: This domain was checked moments ago. Try again shortly.
    Error:
      description: >-
        Any other error, including `500 internal` and `501 not_implemented`
        for an operation that is in the contract but not built yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_implemented
            message: This operation is not implemented yet.


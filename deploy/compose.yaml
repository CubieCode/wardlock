#
# Example only. Wardlock needs no other services. Images are not published
# yet; build one with `goreleaser release --snapshot --clean` and set
# WARDLOCK_IMAGE to its tag, e.g.
# ghcr.io/cubiecode/wardlock:0.0.1-snapshot.abc1234-amd64 (docs/DEPLOYMENT.md).
# The image runs as the distroless nonroot user (65532) with a read-only root
# filesystem; only the /data volume is writable.
services:
  wardlockd:
    image: ${WARDLOCK_IMAGE:-ghcr.io/cubiecode/wardlock:latest}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WARDLOCK_PORT:-8080}:8080'
    environment:
      WARDLOCK_BASE_DOMAIN: ${WARDLOCK_BASE_DOMAIN:-wardlock.localhost}
      WARDLOCK_DASHBOARD_HOST: ${WARDLOCK_DASHBOARD_HOST:-}
      WARDLOCK_LOG_FORMAT: json
      WARDLOCK_SECRET: ${WARDLOCK_SECRET:?set WARDLOCK_SECRET; see docs/DEPLOYMENT.md}
    volumes:
      - wardlock-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
volumes:
  wardlock-data:

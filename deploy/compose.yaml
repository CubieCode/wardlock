#
# Example only. Wardlock needs no other services. Images are not published
# yet (O4.1); build one locally with `goreleaser release --snapshot --clean`
# and set WARDLOCK_IMAGE to its tag.
services:
  wardlockd:
    image: ${WARDLOCK_IMAGE:-ghcr.io/cubiecode/wardlock:latest}
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      WARDLOCK_BASE_DOMAIN: ${WARDLOCK_BASE_DOMAIN:-wardlock.localhost}
      WARDLOCK_DASHBOARD_HOST: ${WARDLOCK_DASHBOARD_HOST:-}
      WARDLOCK_LOG_FORMAT: json
    volumes:
      - wardlock-data:/data
volumes:
  wardlock-data:

#
# Shared by every Go module; scripts/check-go.sh runs golangci-lint in each.
# depguard enforces the package boundaries in docs/MODULES.md.
version: '2'
linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gochecknoinits
    - gosec
    - misspell
    - nolintlint
    - sloglint
    - usestdlibvars
  settings:
    misspell:
      # Prose is NZ English; flag only real misspellings, not UK spellings.
      ignore-rules:
        [
          behaviour,
          colour,
          licence,
          normalise,
          organisation,
          serialisation,
          initialise,
          authorise,
          recognise,
        ]
    depguard:
      rules:
        edge:
          files: ['**/apps/server/internal/edge/**']
          deny:
            - pkg: wardlock.nz/server/internal/api
              desc: the edge never imports the API; receive handlers through edge.Config
            - pkg: wardlock.nz/server/internal/store
              desc: the edge reads sites through edge.SiteSource, adapted in cmd/wardlockd
            - pkg: wardlock.nz/server/internal/deploys
              desc: the edge takes BlobOpener and Invalidator, satisfied by deploys types in cmd/wardlockd
        access:
          files: ['**/apps/server/internal/access/**']
          deny:
            - pkg: net/http
              desc: access takes plain values from the edge; keep HTTP out
            - pkg: wardlock.nz/server/internal/api
              desc: access never imports the HTTP layer
            - pkg: wardlock.nz/server/internal/edge
              desc: access never imports the HTTP layer
        country:
          files: ['**/apps/server/internal/country/**']
          deny:
            - pkg: net/http
              desc: country reads a local file; it never fetches anything
            - pkg: wardlock.nz/server/internal/api
              desc: country is a leaf; cmd/wardlockd hands it to the access-log writer
            - pkg: wardlock.nz/server/internal/edge
              desc: country is a leaf; cmd/wardlockd hands it to the access-log writer
            - pkg: wardlock.nz/server/internal/access
              desc: country is a leaf; the access-log writer calls it through accesslog.CountryLookup
            - pkg: wardlock.nz/server/internal/store
              desc: country keeps no state in the database
        oauth:
          files: ['**/apps/server/internal/oauth/**']
          deny:
            - pkg: wardlock.nz/server/internal/api
              desc: oauth only talks to providers; access decides and the edge serves
            - pkg: wardlock.nz/server/internal/edge
              desc: oauth only talks to providers; access decides and the edge serves
            - pkg: wardlock.nz/server/internal/store
              desc: oauth keeps no state; flows live in access
        mail:
          files: ['**/apps/server/internal/mail/**']
          deny:
            - pkg: wardlock.nz/server/internal/api
              desc: mail is called by domain packages, never the reverse
            - pkg: wardlock.nz/server/internal/edge
              desc: mail is called by domain packages, never the reverse
        tls:
          files: ['**/apps/server/internal/tls/**']
          deny:
            - pkg: wardlock.nz/server/internal/api
              desc: tls wraps the edge from cmd/wardlockd; it never imports the API
            - pkg: wardlock.nz/server/internal/edge
              desc: tls wraps the edge from cmd/wardlockd; it never imports the edge
        platform:
          files: ['**/apps/server/internal/platform/**']
          deny:
            - pkg: wardlock.nz/server/internal/edge
              desc: platform is the base layer; it imports no other internal package
            - pkg: wardlock.nz/server/internal/access
              desc: platform is the base layer; it imports no other internal package
            - pkg: wardlock.nz/server/internal/oauth
              desc: platform is the base layer; it imports no other internal package
            - pkg: wardlock.nz/server/internal/deploys
              desc: platform is the base layer; it imports no other internal package
            - pkg: wardlock.nz/server/internal/sites
              desc: platform is the base layer; it imports no other internal package
            - pkg: wardlock.nz/server/internal/owners
              desc: platform is the base layer; it imports no other internal package
            - pkg: wardlock.nz/server/internal/mail
              desc: platform is the base layer; it imports no other internal package
            - pkg: wardlock.nz/server/internal/moderation
              desc: platform is the base layer; it imports no other internal package
            - pkg: wardlock.nz/server/internal/country
              desc: platform is the base layer; it imports no other internal package
            - pkg: wardlock.nz/server/internal/tls
              desc: platform is the base layer; it imports no other internal package
            - pkg: wardlock.nz/server/internal/api
              desc: platform is the base layer; it imports no other internal package
            - pkg: wardlock.nz/server/internal/store
              desc: platform is the base layer; it imports no other internal package
            - pkg: wardlock.nz/server/internal/dashboard
              desc: platform is the base layer; it imports no other internal package
        store:
          files: ['**/apps/server/internal/store/**']
          deny:
            - pkg: wardlock.nz/server/internal/edge
              desc: store serves domain packages through repository interfaces; it never imports them
            - pkg: wardlock.nz/server/internal/access
              desc: store serves domain packages through repository interfaces; it never imports them
            - pkg: wardlock.nz/server/internal/oauth
              desc: store serves domain packages through repository interfaces; it never imports them
            - pkg: wardlock.nz/server/internal/deploys
              desc: store serves domain packages through repository interfaces; it never imports them
            - pkg: wardlock.nz/server/internal/sites
              desc: store serves domain packages through repository interfaces; it never imports them
            - pkg: wardlock.nz/server/internal/owners
              desc: store serves domain packages through repository interfaces; it never imports them
            - pkg: wardlock.nz/server/internal/mail
              desc: store serves domain packages through repository interfaces; it never imports them
            - pkg: wardlock.nz/server/internal/moderation
              desc: store serves domain packages through repository interfaces; it never imports them
            - pkg: wardlock.nz/server/internal/country
              desc: store serves domain packages through repository interfaces; it never imports them
            - pkg: wardlock.nz/server/internal/tls
              desc: store serves domain packages through repository interfaces; it never imports them
            - pkg: wardlock.nz/server/internal/api
              desc: store serves domain packages through repository interfaces; it never imports them
            - pkg: wardlock.nz/server/internal/dashboard
              desc: store serves domain packages through repository interfaces; it never imports them
        dashboard:
          files: ['**/apps/server/internal/dashboard/**']
          deny:
            - pkg: wardlock.nz/server/internal/edge
              desc: the dashboard only serves embedded files; it reaches the server through the API
            - pkg: wardlock.nz/server/internal/access
              desc: the dashboard only serves embedded files; it reaches the server through the API
            - pkg: wardlock.nz/server/internal/oauth
              desc: the dashboard only serves embedded files; it reaches the server through the API
            - pkg: wardlock.nz/server/internal/deploys
              desc: the dashboard only serves embedded files; it reaches the server through the API
            - pkg: wardlock.nz/server/internal/sites
              desc: the dashboard only serves embedded files; it reaches the server through the API
            - pkg: wardlock.nz/server/internal/owners
              desc: the dashboard only serves embedded files; it reaches the server through the API
            - pkg: wardlock.nz/server/internal/mail
              desc: the dashboard only serves embedded files; it reaches the server through the API
            - pkg: wardlock.nz/server/internal/moderation
              desc: the dashboard only serves embedded files; it reaches the server through the API
            - pkg: wardlock.nz/server/internal/country
              desc: the dashboard only serves embedded files; it reaches the server through the API
            - pkg: wardlock.nz/server/internal/tls
              desc: the dashboard only serves embedded files; it reaches the server through the API
            - pkg: wardlock.nz/server/internal/api
              desc: the dashboard only serves embedded files; it reaches the server through the API
            - pkg: wardlock.nz/server/internal/store
              desc: the dashboard only serves embedded files; it reaches the server through the API
        deploys:
          files: ['**/apps/server/internal/deploys/**']
          deny:
            - pkg: wardlock.nz/server/internal/api
              desc: deploys is a domain package; the API and edge call it, never the reverse
            - pkg: wardlock.nz/server/internal/edge
              desc: deploys is a domain package; the API and edge call it, never the reverse
        sites:
          files: ['**/apps/server/internal/sites/**']
          deny:
            - pkg: wardlock.nz/server/internal/api
              desc: sites is a domain package; the API and edge call it, never the reverse
            - pkg: wardlock.nz/server/internal/edge
              desc: sites is a domain package; the API and edge call it, never the reverse
        moderation:
          files: ['**/apps/server/internal/moderation/**']
          deny:
            - pkg: wardlock.nz/server/internal/api
              desc: moderation is a domain package; cmd/wardlockd wires it, the API never calls it
            - pkg: wardlock.nz/server/internal/edge
              desc: moderation tells the edge what to withhold through a value cmd/wardlockd passes it
        owners:
          files: ['**/apps/server/internal/owners/**']
          deny:
            - pkg: wardlock.nz/server/internal/edge
              desc: owners serves the dashboard and API; it never imports the edge
        api:
          files: ['**/apps/server/internal/api/**']
          deny:
            - pkg: wardlock.nz/server/internal/edge
              desc: the API and the edge meet only in cmd/wardlockd
        domain-storage:
          files:
            - '**/apps/server/internal/tls/**'
            - '**/apps/server/internal/mail/**'
            - '**/apps/server/internal/access/**'
            - '**/apps/server/internal/oauth/**'
            - '**/apps/server/internal/deploys/**'
            - '**/apps/server/internal/sites/**'
            - '**/apps/server/internal/owners/**'
            - '**/apps/server/internal/edge/**'
            - '**/apps/server/internal/moderation/**'
            - '**/apps/server/internal/country/**'
          deny:
            - pkg: database/sql
              desc: domain code depends on store's repository interfaces
            - pkg: wardlock.nz/server/internal/store/sqlcgen
              desc: domain code depends on store's repository interfaces, not sqlc types
            - pkg: modernc.org/sqlite
              desc: only internal/store opens the database
        mit-modules:
          files: ['**/apps/cli/**', '**/packages/apiclient-go/**']
          deny:
            - pkg: wardlock.nz/server
              desc: MIT code must never import the AGPL server
  exclusions:
    generated: lax
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec]
      # wardlock pull creates the directory the user names (or one named
      # after the site, whose name it checks first). gosec's taint analysis
      # reports that intended flow only on some runs, which fails CI at
      # random, so G703 is excluded for that file alone.
      - path: apps/cli/cmd/wardlock/pull\.go
        linters: [gosec]
        text: G703
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [wardlock.nz]

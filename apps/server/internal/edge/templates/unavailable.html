<!--
  The unavailable page (A2.13): every path of a site the operator has taken
  down, or whose owner is suspended, on every host it answers on. Neutral
  on purpose: it never says why, by whom or whose the site is. A quiet link
  leads to the report form when the operator takes reports. No scripts:
  the same strict Content-Security-Policy as the login page, whose styles
  it shares (colours mirror packages/ui/styles/tokens.css).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Site unavailable · {{.Site}}</title>
    <style>
      :root {
        color-scheme: light dark;
        --canvas: light-dark(#f6f6f3, #12171d);
        --surface: light-dark(#ffffff, #1a2028);
        --surface-muted: light-dark(#eeeeea, #222a33);
        --text: light-dark(#1b2430, #e8ebee);
        --muted: light-dark(#4f5a66, #a7b0ba);
        --border: light-dark(#d9dad4, #2e3742);
        --border-strong: light-dark(#7d858e, #6b7682);
        --primary: light-dark(#1f4f5c, #7fc1cf);
        --primary-hover: light-dark(#183f4a, #9fd2dc);
        --primary-text: light-dark(#ffffff, #0f1a1f);
        --focus: light-dark(#2f6fb0, #8fbfff);
        --danger: light-dark(#a3302a, #f0a39c);
        --accent: light-dark(#a8741f, #d7a756);
        --warning: light-dark(#7d5200, #e8c06d);
        --warning-surface: light-dark(#fbf1dc, #2a2213);
        --warning-border: light-dark(#e2c27c, #5e4a1d);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 1.5rem 1rem;
        background: var(--canvas);
        color: var(--text);
        font:
          1rem/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 26rem;
        padding: 2rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .site {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0 0 1.5rem;
        font-size: 0.875rem;
        color: var(--muted);
      }
      .host {
        overflow-wrap: anywhere;
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      }
      .status {
        flex: none;
        padding: 0.125rem 0.5rem;
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        background: var(--surface-muted);
        color: var(--text);
        font-weight: 500;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        line-height: 1.25;
        font-weight: 650;
      }
      p {
        margin: 0;
      }
      .lead {
        color: var(--muted);
      }
      .notice {
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.875rem;
      }
      footer {
        font-size: 0.875rem;
        color: var(--muted);
      }
      footer span {
        color: var(--accent);
      }
      footer a {
        color: var(--primary);
        text-underline-offset: 2px;
      }
      footer a:hover {
        color: var(--primary-hover);
      }
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }
      @media (max-width: 30rem) {
        body {
          justify-content: flex-start;
          padding-top: 3rem;
        }
        main {
          padding: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="site">
        <span class="host">{{.Site}}</span>
        <span class="status">Unavailable</span>
      </p>
      <h1>This site is unavailable</h1>
      <p class="lead">
        It has been taken offline by the operator of this server.
      </p>
      <p class="notice">
        If you run this site, contact the operator of this server.
      </p>
    </main>
    <footer>
      Served by <span>Wardlock</span>{{with .ReportURL}} ·
      <a href="{{.}}">Report this site</a>{{end}}
    </footer>
  </body>
</html>

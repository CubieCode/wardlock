<!--
  The site login page (/.wardlock/login and every protected page a browser
  may not see yet). A2.3 (password), A2.4 (email code) and A2.5 (OAuth) add
  their forms as blocks below, each guarded by a field of edge.loginData.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>{{.Site}}: private</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #1b1f24;
        --muted: #59636e;
        --border: #d6dbe1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111418;
          --card: #1a1f25;
          --text: #e7ebef;
          --muted: #a0aab4;
          --border: #2d343c;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        box-sizing: border-box;
        width: min(100% - 32px, 400px);
        padding: 32px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .site {
        margin-bottom: 16px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="site">{{.Site}}</p>
      <h1>This page is private</h1>
      <p>
        No sign-in method is available here.{{if .Links}} Open the page with the
        share link you were given, or ask the site's owner for one.{{end}}
      </p>
    </main>
  </body>
</html>

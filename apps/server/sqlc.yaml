# Typed queries for internal/store. Run `pnpm codegen` after editing a query
# or migration; CI fails when the committed output is stale.
version: '2'
sql:
  - engine: sqlite
    schema: migrations
    queries: internal/store/queries
    gen:
      go:
        package: sqlcgen
        out: internal/store/sqlcgen
